    p.input.right = !!inputPayload.right;
    p.input.action = !!inputPayload.action;
    p.input.interact = !!inputPayload.interact;
    p.input.dash = !!inputPayload.dash;
  }

  _ensureLoop() {
    if (this._loopHandle) return;
    this._lastTick = Date.now();
    this._loopHandle = setInterval(() => this._tick(), TICK_MS);
  }

  stopLoop() {
    if (this._loopHandle) {
      clearInterval(this._loopHandle);
      this._loopHandle = null;
    }
  }

  _tick() {
    const now = Date.now();
    const dt = Math.min(0.1, (now - this._lastTick) / 1000);
    this._lastTick = now;

    if (this.phase === ROOM_PHASE.IN_GAME && this.engine) {
      this.engine.update(dt);

      // 협동: CLEAR 후 일정 시간 지나면 RESULT 진입 -> RESULT에서 자동으로 다음 스테이지 진행
      this.broadcastGameState();
    }
  }

  broadcastRoomState() {
    const payload = {
      code: this.code,
      phase: this.phase,
      mode: this.mode,
      rounds: this.rounds,
      hostId: this.hostId,
      players: Array.from(this.players.values()).map((p) => p.toPublicJSON()),
    };
    this.players.forEach((p) => p.send(MSG.ROOM_STATE, payload));
  }

  broadcastGameState() {
    if (!this.engine) return;
    const payload = {
      players: Array.from(this.players.values()).map((p) => p.toPublicJSON()),
      ...this.engine.getStateJSON(),
    };
    this.players.forEach((p) => p.send(MSG.GAME_STATE, payload));
  }

  broadcastEvent(eventName, data) {
    this.players.forEach((p) => p.send(MSG.GAME_EVENT, { event: eventName, data }));
  }
}
window.Room = Room;
})();

// client/js/net.js
// PeerJS(WebRTC) 기반 P2P 통신 계층. 자체 서버 없이, PeerJS의 무료 공개 브로커는
// "두 브라우저가 서로를 찾도록" 신호(signaling) 용도로만 쓰이고, 실제 게임 데이터는
// 브라우저 간에 직접(P2P) 오간다. 방을 만든 사람(호스트)의 브라우저가 곧 "서버" 역할을
// 맡아 협동/경쟁 게임 로직(Room/Player/CoopEngine/CompetitionManager)을 그대로 실행한다.
const Net = (() => {
  const NS = "splat-game-v1-"; // 다른 앱과 피어 ID가 겹치지 않도록 하는 네임스페이스
  const listeners = {};
  let mode = null; // 'host' | 'join'
  let connected = false;

  // ---- 호스트 전용 상태 ----
  let hostPeer = null;
  let room = null; // 이 브라우저가 호스트일 때만 존재하는 단일 방
  let hostSelfConn = null; // 호스트 자신의 커넥션 상태 { ws, player }
  const remoteConns = new Set(); // 호스트에 연결된 원격 커넥션 상태들

  // ---- 참가자 전용 상태 ----
  let joinPeer = null;
  let hostConn = null;

  function on(type, cb) {
    listeners[type] = listeners[type] || [];
    listeners[type].push(cb);
  }
  function emit(type, payload) {
    (listeners[type] || []).forEach((cb) => cb(payload));
    (listeners["*"] || []).forEach((cb) => cb(type, payload));
  }

  function randomRoomCode() {
    let code = "";
    for (let i = 0; i < ROOM_CODE_LENGTH; i++) {
      code += ROOM_CODE_CHARS[Math.floor(Math.random() * ROOM_CODE_CHARS.length)];
    }
    return code;
  }

  // 원격(PeerJS) 커넥션을 서버 코드가 기대하는 ws 인터페이스(readyState/send)로 감싼다
  function wrapPeerConn(conn) {
    return {
      get readyState() {
        return conn.open ? 1 : 0;
      },
      send: (jsonString) => {
        try {
          conn.send(jsonString);
        } catch (e) {
          /* 연결이 이미 끊겼을 수 있음 - 무시 */
        }
      },
    };
  }

  // 호스트 자기 자신은 네트워크를 안 거치고 같은 페이지 안에서 바로 UI로 전달한다
  function wrapLoopback() {
    return {
      readyState: 1,
      send: (jsonString) => {
        let msg;
        try {
          msg = JSON.parse(jsonString);
        } catch (e) {
          return;
        }
        emit(msg.type, msg.payload);
      },
    };
  }

  // ---------------- 호스트: 서버의 메시지 라우팅 로직을 그대로 이식 ----------------
  function hostHandle(connState, type, payload) {
    try {
      switch (type) {
        case MSG.JOIN_ROOM: {
          if (connState.player) return;
          if (room.isFull()) {
            connState.ws.send(JSON.stringify({ type: MSG.ROOM_ERROR, payload: { message: "방이 가득 찼습니다." } }));
            return;
          }
          if (room.phase === "in_game") {
            connState.ws.send(
              JSON.stringify({ type: MSG.ROOM_ERROR, payload: { message: "게임이 이미 시작되었습니다." } })
            );
            return;
          }
          const name = (payload && payload.name) || "Player";
          const player = new Player(connState.ws, name);
          connState.player = player;
          room.addPlayer(player);
          connState.ws.send(
            JSON.stringify({ type: MSG.ROOM_STATE, payload: { code: room.code, joined: true, playerId: player.id } })
          );
          room.broadcastRoomState();
          break;
        }
        case MSG.SET_MODE:
          if (connState.player) room.setMode(payload && payload.mode);
          break;
        case MSG.SET_ROUNDS:
          if (connState.player) room.setRounds(payload && payload.rounds);
          break;
        case MSG.SET_READY:
          if (connState.player) room.setReady(connState.player.id, payload && payload.ready);
          break;
        case MSG.SET_APPEARANCE:
          if (connState.player) room.setAppearance(connState.player.id, payload);
          break;
        case MSG.START_GAME: {
          if (!connState.player) return;
          const result = room.startGame(connState.player.id);
          if (!result.ok) {
            connState.ws.send(JSON.stringify({ type: MSG.ROOM_ERROR, payload: { message: result.reason } }));
          }
          break;
        }
        case MSG.INPUT:
          if (connState.player) room.handleInput(connState.player.id, payload || {});
          break;
        case MSG.RETRY_STAGE:
          if (connState.player) room.retryStage();
          break;
        case MSG.RETURN_TO_LOBBY:
          if (connState.player) room.returnToLobby();
          break;
        case MSG.LEAVE_ROOM: {
          if (connState.player) {
            room.removePlayer(connState.player.id);
            connState.player = null;
          }
          break;
        }
        case MSG.PING:
          connState.ws.send(JSON.stringify({ type: MSG.PONG, payload: {} }));
          break;
        default:
          break;
      }
    } catch (err) {
      console.error("[host] 메시지 처리 오류:", type, err);
    }
  }

  function handleRemoteDisconnect(connState) {
    remoteConns.delete(connState);
    if (connState.player && room) {
      room.removePlayer(connState.player.id);
    }
  }

  async function becomeHost(name) {
    mode = "host";
    const code = randomRoomCode();
    room = new Room(code);

    // 로컬(호스트 자신) 플레이는 시그널링 서버 연결 여부와 무관하게 즉시 시작한다.
    // 원격 참가자를 받는 기능만 PeerJS 브로커 연결에 의존한다 - 그래서 방장은
    // 신호 서버가 느리거나 일시적으로 안 되더라도 최소한 혼자(또는 나중에) 계속 플레이할 수 있다.
    const wsLike = wrapLoopback();
    const player = new Player(wsLike, name);
    hostSelfConn = { ws: wsLike, player };
    room.addPlayer(player);
    connected = true;
    emit("_connected", {});
    emit(MSG.ROOM_STATE, { code: room.code, joined: true, playerId: player.id });
    room.broadcastRoomState();
    emit("_peer_signaling_pending", {});

    return new Promise((resolve) => {
      hostPeer = new Peer(NS + code, { debug: 0 });

      hostPeer.on("open", () => {
        emit("_peer_signaling_ready", {});
        resolve();
      });

      hostPeer.on("connection", (conn) => {
        const connState = { ws: wrapPeerConn(conn), player: null };
        remoteConns.add(connState);
        conn.on("data", (raw) => {
          let msg;
          try {
            msg = JSON.parse(raw);
          } catch (e) {
            return;
          }
          hostHandle(connState, msg.type, msg.payload);
        });
        conn.on("close", () => handleRemoteDisconnect(connState));
        conn.on("error", () => handleRemoteDisconnect(connState));
      });

      hostPeer.on("error", (err) => {
        if (err.type === "unavailable-id") {
          // 극히 드문 충돌 - 새 코드로 재시도 (이미 시작된 로컬 플레이는 그대로 유지)
          hostPeer.destroy();
          const retryCode = randomRoomCode();
          room.code = retryCode;
          room.broadcastRoomState();
          emit("_peer_signaling_pending", {});
          hostPeer = new Peer(NS + retryCode, { debug: 0 });
          return;
        }
        // 원격 참가자 연결용 신호 서버 연결에는 실패했지만, 이미 시작된 로컬 플레이는 계속된다.
        // (같은 화면에서 계속 플레이하거나, 나중에 다시 시도할 수 있음을 알린다)
        emit("_peer_signaling_error", { message: err.type });
        emit(MSG.ROOM_ERROR, { message: "원격 참가자를 위한 연결에 실패했어요 (신호 서버 오류: " + err.type + "). 같은 화면에서는 계속 플레이할 수 있습니다." });
        resolve();
      });
    });
  }

  async function becomeJoiner(code, name) {
    mode = "join";
    return new Promise((resolve, reject) => {
      joinPeer = new Peer({ debug: 0 });

      joinPeer.on("open", () => {
        const targetId = NS + code.trim().toUpperCase();
        const conn = joinPeer.connect(targetId, { reliable: true });
        hostConn = conn;

        const timeout = setTimeout(() => {
          emit(MSG.ROOM_ERROR, { message: "방을 찾을 수 없습니다." });
          reject(new Error("timeout"));
        }, 12000);

        conn.on("open", () => {
          clearTimeout(timeout);
          connected = true;
          emit("_connected", {});
          conn.send(JSON.stringify({ type: MSG.JOIN_ROOM, payload: { code, name } }));
          resolve();
        });

        conn.on("data", (raw) => {
          let msg;
          try {
            msg = JSON.parse(raw);
          } catch (e) {
            return;
          }
          emit(msg.type, msg.payload);
        });

        conn.on("close", () => {
          connected = false;
          emit("_disconnected", {});
        });

        conn.on("error", () => {
          clearTimeout(timeout);
          emit(MSG.ROOM_ERROR, { message: "연결에 실패했습니다. 코드를 확인하거나 다시 시도해주세요." });
        });
      });

      joinPeer.on("error", (err) => {
        if (err.type === "peer-unavailable") {
          emit(MSG.ROOM_ERROR, { message: "방을 찾을 수 없습니다. 코드를 확인해주세요." });
        } else {
          emit(MSG.ROOM_ERROR, { message: "연결 오류: " + err.type });
        }
        reject(err);
      });
    });
  }

  function connect() {
    // PeerJS 기반에서는 미리 연결할 서버가 없다 - 방을 만들거나 참가할 때 비로소 연결이 시작된다.
    // 타이틀 화면에는 "대기 중" 정도의 안내만 표시한다.
    emit("_idle", {});
  }

  function send(type, payload) {
    if (mode === "host") {
      hostHandle(hostSelfConn, type, payload);
      return;
    }
    if (mode === "join") {
      if (hostConn && hostConn.open) {
        hostConn.send(JSON.stringify({ type, payload }));
      }
      return;
    }
    // 아직 방에 들어가기 전
    if (type === MSG.CREATE_ROOM) {
      becomeHost((payload && payload.name) || "Player").catch(() => {});
    } else if (type === MSG.JOIN_ROOM) {
      becomeJoiner((payload && payload.code) || "", (payload && payload.name) || "Player").catch(() => {});
    }
  }

  function isConnected() {
    return connected;
  }

  function close() {
    if (mode === "host") {
      remoteConns.forEach((c) => {
        try {
          c.ws && c.ws.send && c.ws.send(JSON.stringify({ type: MSG.ROOM_ERROR, payload: { message: "호스트가 나갔습니다." } }));
        } catch (e) {}
      });
      if (hostPeer) {
        try {
          hostPeer.destroy();
        } catch (e) {}
      }
    } else if (mode === "join") {
      if (hostConn) {
        try {
          hostConn.close();
        } catch (e) {}
      }
      if (joinPeer) {
        try {
          joinPeer.destroy();
        } catch (e) {}
      }
    }
    mode = null;
    room = null;
    hostSelfConn = null;
    remoteConns.clear();
    hostConn = null;
    connected = false;
  }

  return { connect, send, on, isConnected, close };
})();


// client/js/input.js
// 중앙 입력 시스템: shared/constants.js의 KEYS 맵을 유일한 출처로 사용한다.
const Input = (() => {
  const state = {
    up: false,
    down: false,
    left: false,
    right: false,
    action: false,
    interact: false,
    dash: false,
  };

  const codeToField = {
    [KEYS.UP]: "up",
    [KEYS.DOWN]: "down",
    [KEYS.LEFT]: "left",
    [KEYS.RIGHT]: "right",
    [KEYS.ACTION]: "action",
    [KEYS.INTERACT]: "interact",
    [KEYS.DASH]: "dash",
  };

  let enabled = false;

  function onKeyDown(e) {
    if (!enabled) return;
    const field = codeToField[e.code];
    if (field) {
      state[field] = true;
      e.preventDefault();
    }
  }
  function onKeyUp(e) {
    const field = codeToField[e.code];
    if (field) {
      state[field] = false;
      e.preventDefault();
    }
  }

  window.addEventListener("keydown", onKeyDown);
  window.addEventListener("keyup", onKeyUp);
  window.addEventListener("blur", () => {
    Object.keys(state).forEach((k) => (state[k] = false));
  });

  function setEnabled(v) {
    enabled = v;
    if (!v) Object.keys(state).forEach((k) => (state[k] = false));
  }

  function getState() {
    return { ...state };
  }

  return { setEnabled, getState };
})();


// client/js/camera.js
// 모든 플레이어가 하나의 공유 시점을 보거나(공유 카메라), 각자 독립된 시점을 볼 수 있다(독립 카메라).
const Camera = (() => {
  let x = 700, y = 400;
  let viewW = 1200, viewH = 700;
  const MARGIN = 220;
  const MIN_VIEW_W = 700;
  const MAX_VIEW_W = 2000;
  const LERP = 0.08;

  let freeOffset = { x: 0, y: 0 }; // 자유시점일 때 플레이어 기준 카메라 오프셋(드래그로 조정)

  // 스폰이 한 곳뿐인 맵에서 스테이지 시작 시 카메라가 골(도착)까지 훑고 오는 인트로 연출.
  // 확대/축소는 건드리지 않고 "카메라가 보는 위치"만 빠르게 이동했다가 훨씬 더 빠르게 돌아온다.
  const PAN_OUT_DURATION = 0.7;
  const PAN_HOLD_DURATION = 0.3;
  const PAN_BACK_DURATION = 0.35; // 갈 때보다 확실히 더 빠르게 복귀
  let introPan = null; // { fromX, fromY, toX, toY, elapsed }
  let introPanLastT = 0;

  function startIntroPan(fromX, fromY, toX, toY) {
    introPan = { fromX, fromY, toX, toY, elapsed: 0 };
    introPanLastT = performance.now();
  }
  function easeInOutQuad(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  function update(points, worldBounds, options) {
    if (!points || points.length === 0) return;
    const opts = options || {};
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    points.forEach((p) => {
      minX = Math.min(minX, p.x);
      maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y);
      maxY = Math.max(maxY, p.y);
    });

    let targetCenterX = (minX + maxX) / 2 + freeOffset.x;
    let targetCenterY = (minY + maxY) / 2 + freeOffset.y;

    const aspect = (canvasEl ? canvasEl.width / canvasEl.height : 16 / 9) || 16 / 9;
    let neededW, neededH;
    if (opts.fixedViewW) {
      // 독립 카메라의 "카메라 거리" 설정 - 인원 퍼짐 정도와 무관하게 항상 이 크기로 고정
      neededW = Math.max(MIN_VIEW_W, Math.min(MAX_VIEW_W, opts.fixedViewW));
      neededH = neededW / aspect;
    } else {
      neededW = Math.max(maxX - minX + MARGIN * 2, MIN_VIEW_W);
      neededH = neededW / aspect;
      if (neededH < maxY - minY + MARGIN * 2) {
        neededH = maxY - minY + MARGIN * 2;
        neededW = neededH * aspect;
      }
      neededW = Math.min(neededW, MAX_VIEW_W);
      neededH = neededW / aspect;
    }

    let targetX = targetCenterX;
    let targetY = targetCenterY;

    if (worldBounds) {
      const halfW = neededW / 2;
      const halfH = neededH / 2;
      targetX = Math.max(halfW, Math.min(worldBounds.width - halfW, targetX));
      targetY = Math.max(halfH, Math.min(worldBounds.height - halfH, targetY));
      if (worldBounds.width < neededW) targetX = worldBounds.width / 2;
      if (worldBounds.height < neededH) targetY = worldBounds.height / 2;
    }

    if (introPan) {
      const now = performance.now();
      const dt = (now - introPanLastT) / 1000;
      introPanLastT = now;
      introPan.elapsed += dt;
      const total = PAN_OUT_DURATION + PAN_HOLD_DURATION + PAN_BACK_DURATION;
      if (introPan.elapsed >= total) {
        introPan = null;
      } else {
        let px, py;
        if (introPan.elapsed < PAN_OUT_DURATION) {
          const p = easeInOutQuad(introPan.elapsed / PAN_OUT_DURATION);
          px = introPan.fromX + (introPan.toX - introPan.fromX) * p;
          py = introPan.fromY + (introPan.toY - introPan.fromY) * p;
        } else if (introPan.elapsed < PAN_OUT_DURATION + PAN_HOLD_DURATION) {
          px = introPan.toX;
          py = introPan.toY;
        } else {
          const p = easeInOutQuad((introPan.elapsed - PAN_OUT_DURATION - PAN_HOLD_DURATION) / PAN_BACK_DURATION);
          px = introPan.toX + (targetX - introPan.toX) * p;
          py = introPan.toY + (targetY - introPan.toY) * p;
        }
        x = px;
        y = py;
        viewW += (neededW - viewW) * LERP;
        viewH += (neededH - viewH) * LERP;
        return;
      }
    }

    x += (targetX - x) * LERP;
    y += (targetY - y) * LERP;
    viewW += (neededW - viewW) * LERP;
    viewH += (neededH - viewH) * LERP;
  }

  // 자유시점: 마우스 드래그로 카메라를 플레이어 기준 오프셋만큼 이동시킨다 (화면 스케일 기준으로 환산)
  function panByScreenDelta(dxScreen, dyScreen) {
    const scale = canvasEl ? canvasEl.width / viewW : 1;
    freeOffset.x -= dxScreen / scale;
    freeOffset.y -= dyScreen / scale;
  }
  function resetPan() {
    freeOffset = { x: 0, y: 0 };
  }

  let canvasEl = null;
  function setCanvas(c) {
    canvasEl = c;
  }

  function getView() {
    return { x, y, w: viewW, h: viewH };
  }

  function worldToScreen(wx, wy, canvasW, canvasH) {
    const scale = canvasW / viewW;
    const sx = (wx - (x - viewW / 2)) * scale;
    const sy = (wy - (y - viewH / 2)) * scale;
    return { x: sx, y: sy, scale };
  }

  return { update, getView, worldToScreen, setCanvas, panByScreenDelta, resetPan, startIntroPan };
})();


// client/js/render.js
const Render = (() => {
  let canvas, ctx;
  let effects = []; // {type, x, y, t, life, ...}

  // 블록에 붙은 커스텀 이미지: 스테이지 로드 시 한 번만 stage_assets 이벤트로 받아서 캐싱한다
  // (매 틱 게임 상태에 base64 이미지를 실어보내면 대역폭이 감당 안 되기 때문).
  let stageAssets = {};
  const imgElCache = {}; // dataURL -> HTMLImageElement
  function setStageAssets(assets) {
    stageAssets = assets || {};
  }
  function getStageImage(key) {
    const dataUrl = stageAssets[key];
    if (!dataUrl) return null;
    if (!imgElCache[dataUrl]) {
      const img = new Image();
      img.src = dataUrl;
      imgElCache[dataUrl] = img;
    }
    const img = imgElCache[dataUrl];
    return img.complete && img.naturalWidth > 0 ? img : null;
  }

  function init(canvasEl) {
    canvas = canvasEl;
    ctx = canvas.getContext("2d");
    Camera.setCanvas(canvas);
    resize();
    window.addEventListener("resize", resize);
  }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function addEffect(effect) {
    effects.push({ t: 0, life: 0.5, ...effect });
  }

  function updateEffects(dt) {
    effects.forEach((e) => (e.t += dt));
    effects = effects.filter((e) => e.t < e.life);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function toScreen(wx, wy) {
    return Camera.worldToScreen(wx, wy, canvas.width, canvas.height);
  }

  function drawWorldRect(rect, color, radius = 8) {
    const s = toScreen(rect.x, rect.y);
    const w = rect.w * s.scale;
    const h = rect.h * s.scale;
    ctx.fillStyle = color;
    roundRect(s.x, s.y, w, h, Math.min(radius * s.scale, w / 2, h / 2));
    ctx.fill();
  }

  // 회전(rotation, 도) 지원 사각형 그리기 - 중심 기준 회전
  function drawWorldRectRotated(rect, color, rotationDeg, imageKey) {
    const cx = rect.x + rect.w / 2;
    const cy = rect.y + rect.h / 2;
    const s = toScreen(cx, cy);
    const w = rect.w * s.scale;
    const h = rect.h * s.scale;
    ctx.save();
    ctx.translate(s.x, s.y);
    if (rotationDeg) ctx.rotate((rotationDeg * Math.PI) / 180);
    const img = imageKey ? getStageImage(imageKey) : null;
    if (img) {
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
    } else {
      ctx.fillStyle = color;
      ctx.fillRect(-w / 2, -h / 2, w, h);
    }
    ctx.restore();
  }

  function drawWater(rect, rotationDeg, imageKey, color) {
    const cx = rect.x + rect.w / 2;
    const cy = rect.y + rect.h / 2;
    const s = toScreen(cx, cy);
    const w = rect.w * s.scale;
    const h = rect.h * s.scale;
    ctx.save();
    ctx.translate(s.x, s.y);
    if (rotationDeg) ctx.rotate((rotationDeg * Math.PI) / 180);
    const img = imageKey ? getStageImage(imageKey) : null;
    if (img) {
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
    } else {
      ctx.fillStyle = color || "#2a7fd6";
      ctx.fillRect(-w / 2, -h / 2, w, h);
      ctx.save();
      ctx.beginPath();
      ctx.rect(-w / 2, -h / 2, w, h);
      ctx.clip();
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = 2;
      const waveOffset = (performance.now() / 500) % 30;
      for (let wy = -h / 2 - 30; wy < h / 2 + 30; wy += 30) {
        ctx.beginPath();
        for (let wx = -w / 2; wx <= w / 2; wx += 6) {
          const yy = wy + waveOffset + Math.sin((wx + waveOffset * 3) / 14) * 4;
          if (wx === -w / 2) ctx.moveTo(wx, yy);
          else ctx.lineTo(wx, yy);
        }
        ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = "#164a80";
      ctx.lineWidth = 2;
      ctx.strokeRect(-w / 2, -h / 2, w, h);
    }
    ctx.restore();
  }

  function drawKillbrick(rect, rotationDeg, imageKey, color) {
    const cx = rect.x + rect.w / 2;
    const cy = rect.y + rect.h / 2;
    const s = toScreen(cx, cy);
    const w = rect.w * s.scale;
    const h = rect.h * s.scale;
    ctx.save();
    ctx.translate(s.x, s.y);
    if (rotationDeg) ctx.rotate((rotationDeg * Math.PI) / 180);
    const img = imageKey ? getStageImage(imageKey) : null;
    if (img) {
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
    } else {
      ctx.fillStyle = color || "#c62828";
      ctx.fillRect(-w / 2, -h / 2, w, h);
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      const spikeSize = Math.max(6, Math.min(w, h) / 5);
      for (let sx = -w / 2; sx < w / 2; sx += spikeSize) {
        ctx.beginPath();
        ctx.moveTo(sx, -h / 2);
        ctx.lineTo(sx + spikeSize / 2, -h / 2 + spikeSize * 0.6);
        ctx.lineTo(sx + spikeSize, -h / 2);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.strokeStyle = "#4a0d0d";
    ctx.lineWidth = 2;
    ctx.strokeRect(-w / 2, -h / 2, w, h);
    ctx.restore();
  }

  function drawDestructible(rect, rotationDeg, imageKey, color) {
    const cx = rect.x + rect.w / 2;
    const cy = rect.y + rect.h / 2;
    const s = toScreen(cx, cy);
    const w = rect.w * s.scale;
    const h = rect.h * s.scale;
    ctx.save();
    ctx.translate(s.x, s.y);
    if (rotationDeg) ctx.rotate((rotationDeg * Math.PI) / 180);
    const img = imageKey ? getStageImage(imageKey) : null;
    if (img) {
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
    } else {
      ctx.fillStyle = color || "#a67c52";
      ctx.fillRect(-w / 2, -h / 2, w, h);
      ctx.strokeStyle = "rgba(0,0,0,0.3)";
      ctx.lineWidth = 1.5;
      const brickH = Math.max(8, h / 3);
      for (let by = -h / 2; by < h / 2; by += brickH) {
        ctx.beginPath();
        ctx.moveTo(-w / 2, by);
        ctx.lineTo(w / 2, by);
        ctx.stroke();
      }
    }
    ctx.strokeStyle = "#5a3a1e";
    ctx.lineWidth = 2;
    ctx.strokeRect(-w / 2, -h / 2, w, h);
    ctx.restore();
  }

  function drawPlayer(p, extraText) {
    const s = toScreen(p.x, p.y);
    const r = 22 * s.scale;
    const dead = p.status === "eliminated";
    ctx.save();
    ctx.globalAlpha = dead ? 0.3 : 1;

    // 그림자
    ctx.beginPath();
    ctx.ellipse(s.x, s.y + r * 0.75, r * 0.9, r * 0.35, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(43,45,51,0.25)";
    ctx.fill();

    // 몸통
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.fillStyle = p.colorHex || "#fff";
    ctx.fill();
    ctx.lineWidth = Math.max(2, 3 * s.scale);
    ctx.strokeStyle = "#2b2d33";
    ctx.stroke();

    // 눈 (바라보는 방향 표시)
    const fx = p.facing ? p.facing.x : 0;
    const fy = p.facing ? p.facing.y : 1;
    const eyeOffsetX = fx * r * 0.35;
    const eyeOffsetY = fy * r * 0.35;
    ctx.fillStyle = "#2b2d33";
    [-1, 1].forEach((side) => {
      const perpX = -fy * side * r * 0.28;
      const perpY = fx * side * r * 0.28;
      ctx.beginPath();
      ctx.arc(s.x + eyeOffsetX + perpX, s.y + eyeOffsetY + perpY, Math.max(2, r * 0.13), 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();

    // 장신구 (머리 위 이모지)
    const accEmoji = { hat: "🎩", sprout: "🌱", comb: "🐔", glasses: "👓" }[p.accessory];
    if (accEmoji) {
      ctx.save();
      ctx.font = `${Math.max(14, 20 * s.scale)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(accEmoji, s.x, s.y - r * 1.15);
      ctx.restore();
    }

    // 이름표
    ctx.font = `${Math.max(10, 12 * s.scale)}px sans-serif`;
    ctx.textAlign = "center";
    ctx.fillStyle = "#2b2d33";
    ctx.fillText(p.name, s.x, s.y - r - 8 * s.scale);

    if (dead) {
      ctx.font = `${Math.max(10, 14 * s.scale)}px sans-serif`;
      ctx.fillStyle = "#e0533d";
      ctx.fillText("X", s.x, s.y + 5 * s.scale);
    }

    if (extraText) {
      ctx.font = `${Math.max(10, 12 * s.scale)}px sans-serif`;
      ctx.fillStyle = "#c98a2e";
      ctx.fillText(extraText, s.x, s.y + r + 16 * s.scale);
    }
  }

  // 선분(x1,y1)-(x2,y2)이 사각형 rect와 교차하는지 - 벽의 빛 차단 판정에 사용
  function segCross(ax, ay, bx, by) { return ax * by - ay * bx; }
  function segmentsIntersect(x1, y1, x2, y2, x3, y3, x4, y4) {
    const d1 = segCross(x4 - x3, y4 - y3, x1 - x3, y1 - y3);
    const d2 = segCross(x4 - x3, y4 - y3, x2 - x3, y2 - y3);
    const d3 = segCross(x2 - x1, y2 - y1, x3 - x1, y3 - y1);
    const d4 = segCross(x2 - x1, y2 - y1, x4 - x1, y4 - y1);
    return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
  }
  function pointInRectSimple(px, py, r) { return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }
  // 암전 어둠 레이어를 그릴 임시(오프스크린) 캔버스 - 메인 캔버스와 다르게 destination-out으로
  // 구멍을 뚫어도 안전하다(이 캔버스엔 어둠 오버레이만 그려서, 뚫린 곳은 그냥 투명해지면 됨)
  let darknessCanvas = null;
  function getDarknessCanvas(w, h) {
    if (!darknessCanvas) darknessCanvas = document.createElement("canvas");
    if (darknessCanvas.width !== w || darknessCanvas.height !== h) {
      darknessCanvas.width = w;
      darknessCanvas.height = h;
    }
    return darknessCanvas;
  }
  function segmentIntersectsRect(x1, y1, x2, y2, rect) {
    if (pointInRectSimple(x1, y1, rect) || pointInRectSimple(x2, y2, rect)) return true;
    const rx = rect.x, ry = rect.y, rw = rect.w, rh = rect.h;
    const corners = [[rx, ry], [rx + rw, ry], [rx + rw, ry + rh], [rx, ry + rh]];
    for (let i = 0; i < 4; i++) {
      const [cx1, cy1] = corners[i];
      const [cx2, cy2] = corners[(i + 1) % 4];
      if (segmentsIntersect(x1, y1, x2, y2, cx1, cy1, cx2, cy2)) return true;
    }
    return false;
  }

  // 광선이 사각형과 만나는 가장 가까운 지점까지의 거리(t) - 없으면 null (그림자 계산용)
  function rayRectHitDistance(px, py, dx, dy, rect) {
    const invDx = dx !== 0 ? 1 / dx : (dx >= 0 ? Infinity : -Infinity);
    const invDy = dy !== 0 ? 1 / dy : (dy >= 0 ? Infinity : -Infinity);
    let tmin = (rect.x - px) * invDx;
    let tmax = (rect.x + rect.w - px) * invDx;
    if (tmin > tmax) { const tmp = tmin; tmin = tmax; tmax = tmp; }
    let tymin = (rect.y - py) * invDy;
    let tymax = (rect.y + rect.h - py) * invDy;
    if (tymin > tymax) { const tmp = tymin; tymin = tymax; tymax = tmp; }
    if (tmin > tymax || tymin > tmax) return null;
    const tEntry = Math.max(tmin, tymin);
    if (tEntry < 0) return null;
    return tEntry;
  }
  // 플레이어의 부채꼴 시야 안에서 벽 그림자를 반영한 실제 "빛이 닿는 폴리곤"을 광선 여러 개로 근사한다
  function computeVisionPolygon(px, py, facingAngle, angleWidth, radius, walls) {
    const RAYS = 48;
    const points = [];
    for (let i = 0; i <= RAYS; i++) {
      const angle = facingAngle - angleWidth / 2 + (angleWidth * i) / RAYS;
      const dx = Math.cos(angle), dy = Math.sin(angle);
      let nearest = radius;
      walls.forEach((w) => {
        const t = rayRectHitDistance(px, py, dx, dy, w);
        if (t != null && t < nearest) nearest = t;
      });
      points.push({ x: px + dx * nearest, y: py + dy * nearest });
    }
    return points;
  }

  // 암전 모드일 때, 이 좌표가 "나"의 부채꼴 시야 안에 있는지 (개인별 조명 - 다른 플레이어 시야는 안 씀)
  function isVisibleInDarkness(state, wx, wy) {
    if (!state.darkness) return true;
    const me = (state.players || []).find((p) => p.id === window.myPlayerId);
    if (!me) return true;
    const dx = wx - me.x, dy = wy - me.y;
    const d = Math.hypot(dx, dy);
    if (d > (state.visionRadius != null ? state.visionRadius : 260)) return false;
    const angleWidth = ((state.visionAngle != null ? state.visionAngle : 80) * Math.PI) / 180;
    const facing = me.facing || { x: 0, y: 1 };
    const facingAngle = Math.atan2(facing.y, facing.x);
    const pointAngle = Math.atan2(dy, dx);
    let diff = Math.abs(pointAngle - facingAngle);
    if (diff > Math.PI) diff = Math.PI * 2 - diff;
    if (diff > angleWidth / 2) return false;
    const blocked = (state.walls || []).some((w) => segmentIntersectsRect(me.x, me.y, wx, wy, w));
    if (blocked) return false;
    return true;
  }

  function drawCoop(state, dt) {
    const bg = state.bounds;
    // 배경
    const topLeft = toScreen(0, 0);
    const botRight = toScreen(bg.width, bg.height);
    ctx.fillStyle = "#cfd8e3";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#e4ebf2";
    ctx.fillRect(topLeft.x, topLeft.y, botRight.x - topLeft.x, botRight.y - topLeft.y);

    // 물웅덩이
    (state.pits || []).forEach((pit, i) => drawWater(pit, pit.rotation, "pit:" + i, pit.color));

    // 목표
    drawWorldRectRotated(state.goal, state.goal.color || "#4caf6d", 0, "goal");
    const gS = toScreen(state.goal.x + state.goal.w / 2, state.goal.y - 14);
    ctx.font = `${12 * gS.scale + 10}px sans-serif`;
    ctx.fillStyle = "#4caf6d";
    ctx.textAlign = "center";
    ctx.fillText("GOAL", gS.x, gS.y);

    // 이동 발판
    state.platforms.forEach((p) => drawWorldRectRotated(p, p.color || "#ffb74d", p.rotation, "platform:" + p.id));

    // 킬브릭
    (state.killbricks || []).forEach((k) => drawKillbrick(k, k.rotation, "killbrick:" + k.id, k.color));

    // 파괴 가능 블럭
    (state.destructibles || []).forEach((d) => drawDestructible(d, d.rotation, "destructible:" + d.id, d.color));

    // 압력판
    state.plates.forEach((p) => {
      if (!isVisibleInDarkness(state, p.x, p.y)) return;
      const s = toScreen(p.x, p.y);
      const img = getStageImage("plate:" + p.id);
      ctx.save();
      ctx.beginPath();
      ctx.arc(s.x, s.y, p.r * s.scale, 0, Math.PI * 2);
      if (img) {
        ctx.clip();
        ctx.drawImage(img, s.x - p.r * s.scale, s.y - p.r * s.scale, p.r * 2 * s.scale, p.r * 2 * s.scale);
      } else {
        ctx.fillStyle = p.color || (p.active ? "#4caf6d" : "#b9c2cc");
        ctx.fill();
      }
      ctx.restore();
      ctx.beginPath();
      ctx.arc(s.x, s.y, p.r * s.scale, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#2b2d33";
      ctx.stroke();
    });

    // 텔레포터 (짝지어진 것끼리 점선 연결)
    (state.teleporters || []).forEach((tp) => {
      if (!tp.linkedId) return;
      if (!isVisibleInDarkness(state, tp.x, tp.y)) return;
      const other = (state.teleporters || []).find((o) => o.id === tp.linkedId);
      if (!other || !isVisibleInDarkness(state, other.x, other.y)) return;
      const s1 = toScreen(tp.x, tp.y);
      const s2 = toScreen(other.x, other.y);
      ctx.save();
      ctx.setLineDash([7, 7]);
      ctx.strokeStyle = "rgba(155,48,255,0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(s1.x, s1.y);
      ctx.lineTo(s2.x, s2.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    });
    (state.teleporters || []).forEach((tp) => {
      if (!isVisibleInDarkness(state, tp.x, tp.y)) return;
      const s = toScreen(tp.x, tp.y);
      const img = getStageImage("teleporter:" + tp.id);
      const pulse = 1 + Math.sin(performance.now() / 300) * 0.08;
      ctx.save();
      ctx.beginPath();
      ctx.arc(s.x, s.y, tp.r * s.scale * pulse, 0, Math.PI * 2);
      if (img) {
        ctx.clip();
        ctx.drawImage(img, s.x - tp.r * s.scale, s.y - tp.r * s.scale, tp.r * 2 * s.scale, tp.r * 2 * s.scale);
      } else {
        ctx.fillStyle = tp.color || "#9b30ff";
        ctx.fill();
      }
      ctx.restore();
      ctx.beginPath();
      ctx.arc(s.x, s.y, tp.r * s.scale * pulse, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#5c1a99";
      ctx.stroke();
    });

    // 문
    state.doors.forEach((d) => {
      if (d.open) {
        // 열린 문: 문 색깔로 가장자리를 따라 점선 표시, 시간제한 있으면 카운트다운
        const cx = d.x + d.w / 2, cy = d.y + d.h / 2;
        const cs = toScreen(cx, cy);
        const dw = d.w * cs.scale, dh = d.h * cs.scale;
        ctx.save();
        ctx.translate(cs.x, cs.y);
        if (d.rotation) ctx.rotate((d.rotation * Math.PI) / 180);
        ctx.setLineDash([7, 5]);
        ctx.strokeStyle = d.color || "#c9793a";
        ctx.lineWidth = 2;
        ctx.strokeRect(-dw / 2, -dh / 2, dw, dh);
        ctx.setLineDash([]);
        ctx.restore();
        if (d.openRemaining != null) {
          const ts = toScreen(cx, d.y - 12);
          const rounded = Math.floor(d.openRemaining * 10) / 10; // 0.1초 단위로 표시
          ctx.save();
          ctx.font = "bold 13px sans-serif";
          ctx.textAlign = "center";
          ctx.fillStyle = d.color || "#c9793a";
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 3;
          const text = rounded.toFixed(1) + "s";
          ctx.strokeText(text, ts.x, ts.y);
          ctx.fillText(text, ts.x, ts.y);
          ctx.restore();
        }
        return;
      }
      drawWorldRectRotated(d, d.color || "#c9793a", d.rotation, "door:" + d.id);
      // 열쇠로 여는 문 위에 현재/필요 열쇠 수 표시
      if (d.requiresKeyIds != null || d.requiresKeys != null) {
        const need = d.requiresKeyIds != null ? d.requiresKeyIds.length : d.requiresKeys;
        const collectedIds = state.collectedKeyIds || [];
        const have = d.requiresKeyIds != null
          ? d.requiresKeyIds.filter((kid) => collectedIds.includes(kid)).length
          : Math.min(need, collectedIds.length);
        const ds = toScreen(d.x + d.w / 2, d.y - 12);
        ctx.save();
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = have >= need ? "#4caf6d" : "#2b2d33";
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        const text = `${have}/${need}`;
        ctx.strokeText(text, ds.x, ds.y);
        ctx.fillText(text, ds.x, ds.y);
        ctx.restore();
      }
    });

    // 벽
    state.walls.forEach((w, i) => drawWorldRectRotated(w, w.color || "#2b2d33", w.rotation, "wall:" + i));

    // 열쇠 (획득된 것은 안 그림 - 획득한 플레이어를 따라다니는 것으로 별도 표시)
    state.keys.forEach((k) => {
      if (k.collected) return;
      if (!isVisibleInDarkness(state, k.x, k.y)) return;
      const s = toScreen(k.x, k.y);
      const bob = Math.sin(performance.now() / 240 + k.x) * 4 * s.scale;
      const img = getStageImage("key:" + k.id);
      ctx.save();
      ctx.translate(s.x, s.y + bob);
      if (img) {
        ctx.beginPath();
        ctx.arc(0, 0, k.r * s.scale, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, -k.r * s.scale, -k.r * s.scale, k.r * 2 * s.scale, k.r * 2 * s.scale);
      } else {
        ctx.fillStyle = k.color || "#ffd23f";
        ctx.beginPath();
        ctx.arc(0, 0, k.r * s.scale, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#2b2d33";
      ctx.beginPath();
      ctx.arc(0, 0, k.r * s.scale, 0, Math.PI * 2);
      ctx.stroke();
      if (!img) {
        ctx.fillStyle = "#2b2d33";
        ctx.font = `${14 * s.scale + 6}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("🔑", 0, 0);
      }
      ctx.restore();
      // 내가 이 열쇠 근처에 있으면 E 줍기 프롬프트
      const me = (state.players || []).find((p) => p.id === window.myPlayerId);
      if (me && me.nearKeyId === k.id) {
        const ps = toScreen(k.x, k.y - k.r - 18);
        ctx.save();
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#2b2d33";
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.strokeText("E 줍기", ps.x, ps.y);
        ctx.fillText("E 줍기", ps.x, ps.y);
        ctx.restore();
      }
    });

    // 획득한 열쇠가 들고 있는 플레이어를 졸졸 따라다니는 궤적 표시
    (state.players || []).forEach((p) => {
      const trail = getPlayerTrail(p.id, p.x, p.y);
      (p.carriedKeyIds || []).forEach((kid, idx) => {
        const SPACING = 26;
        const trailIdx = trail.length - 1 - (idx + 1) * SPACING;
        const pos = trailIdx >= 0 ? trail[trailIdx] : (trail[0] || { x: p.x, y: p.y });
        const keyDef = state.keys.find((k) => k.id === kid);
        const ks = toScreen(pos.x, pos.y);
        ctx.save();
        ctx.beginPath();
        ctx.arc(ks.x, ks.y, 10 * ks.scale, 0, Math.PI * 2);
        ctx.fillStyle = (keyDef && keyDef.color) || "#ffd23f";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#a3781f";
        ctx.stroke();
        ctx.restore();
      });
    });

    updateDashParticles(dt);
    drawDashParticles();
    (state.players || []).forEach((p) => {
      if (p.dashing) {
        spawnDashParticle(p.x, p.y, p.facing);
        spawnDashParticle(p.x, p.y, p.facing);
      }
      drawPlayer(p);
      if (p.swordSwing > 0) drawSwordSwing(p);
    });
    updateBreakParticles(dt);
    drawBreakParticles();

    // 암전 모드: 벽 그림자를 반영한 실제 빛 모양(레이캐스팅), 경계는 딱 잘림(그라데이션 없음)
    if (state.darkness) {
      const me = (state.players || []).find((p) => p.id === window.myPlayerId);
      if (me) {
        const s = toScreen(me.x, me.y);
        const radiusWorld = state.visionRadius != null ? state.visionRadius : 260;
        const angleWidth = ((state.visionAngle != null ? state.visionAngle : 80) * Math.PI) / 180;
        const facing = me.facing || { x: 0, y: 1 };
        const facingAngle = Math.atan2(facing.y, facing.x);
        const polygon = computeVisionPolygon(me.x, me.y, facingAngle, angleWidth, radiusWorld, state.walls || []);
        // 메인 캔버스에 destination-out을 바로 쓰면 그 자리 전체가 완전히 투명해져서
        // 원래 배경까지 같이 지워져버린다. 그래서 어둠 레이어를 별도의 임시 캔버스에
        // 따로 그린 뒤(그 안에서만 구멍을 뚫고), 그 결과만 메인 캔버스 위에 얹는다.
        const dCanvas = getDarknessCanvas(canvas.width, canvas.height);
        const dctx = dCanvas.getContext("2d");
        dctx.clearRect(0, 0, dCanvas.width, dCanvas.height);
        dctx.globalCompositeOperation = "source-over";
        const intensity = (state.darknessIntensity != null ? state.darknessIntensity : 45) / 100;
        dctx.fillStyle = `rgba(10,10,25,${intensity})`;
        dctx.fillRect(0, 0, dCanvas.width, dCanvas.height);
        dctx.globalCompositeOperation = "destination-out";
        dctx.beginPath();
        dctx.moveTo(s.x, s.y);
        polygon.forEach((pw) => {
          const sp = toScreen(pw.x, pw.y);
          dctx.lineTo(sp.x, sp.y);
        });
        dctx.closePath();
        dctx.fillStyle = "rgba(0,0,0,1)";
        dctx.fill();
        ctx.drawImage(dCanvas, 0, 0);
      }
    }
  }

  // ---------------- 칼 휘두르기 이펙트 + 파괴 파티클 (클라이언트 전용 시각효과) ----------------
  const SWORD_SWING_DURATION = 0.22;
  const swordSkinImgCache = {}; // dataURL -> HTMLImageElement
  function getSwordSkinImage(playerId) {
    const dataUrl = window.swordSkinCache && window.swordSkinCache[playerId];
    if (!dataUrl) return null;
    if (!swordSkinImgCache[dataUrl]) {
      const img = new Image();
      img.src = dataUrl;
      swordSkinImgCache[dataUrl] = img;
    }
    const img = swordSkinImgCache[dataUrl];
    return img.complete && img.naturalWidth > 0 ? img : null;
  }
  function drawSwordSwing(p) {
    const progress = 1 - p.swordSwing / SWORD_SWING_DURATION;
    const facing = p.facing || { x: 0, y: 1 };
    const baseAngle = Math.atan2(facing.y, facing.x);
    const sweep = Math.PI * 0.9;
    const angle = baseAngle - sweep / 2 + sweep * Math.min(1, Math.max(0, progress));
    const s = toScreen(p.x, p.y);
    const reach = (22 + 46) * s.scale;
    const skinImg = getSwordSkinImage(p.id);
    if (skinImg) {
      ctx.save();
      ctx.globalAlpha = 0.9 * (p.swordSwing / SWORD_SWING_DURATION);
      ctx.translate(s.x + Math.cos(angle) * reach * 0.62, s.y + Math.sin(angle) * reach * 0.62);
      ctx.rotate(angle + Math.PI / 4);
      const size = reach * 0.85;
      ctx.drawImage(skinImg, -size / 2, -size / 2, size, size);
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.globalAlpha = 0.85 * (p.swordSwing / SWORD_SWING_DURATION);
    ctx.strokeStyle = "#e8e8f0";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + Math.cos(angle) * reach, s.y + Math.sin(angle) * reach);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(s.x, s.y, reach * 0.7, angle - 0.5, angle + 0.5);
    ctx.strokeStyle = "rgba(232,232,240,0.5)";
    ctx.lineWidth = 8;
    ctx.stroke();
    ctx.restore();
  }

  let breakParticles = [];
  function spawnBreakParticles(x, y) {
    for (let i = 0; i < 14; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 160;
      breakParticles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 40,
        life: 0,
        maxLife: 0.4 + Math.random() * 0.35,
        size: 3 + Math.random() * 4,
        color: Math.random() < 0.5 ? "#a67c52" : "#7a5a38",
      });
    }
  }
  function updateBreakParticles(dt) {
    const GRAVITY = 500;
    breakParticles.forEach((p) => {
      p.life += dt;
      p.vy += GRAVITY * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    });
    breakParticles = breakParticles.filter((p) => p.life < p.maxLife);
  }
  function drawBreakParticles() {
    breakParticles.forEach((p) => {
      const s = toScreen(p.x, p.y);
      const alpha = Math.max(0, 1 - p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(s.x - (p.size * s.scale) / 2, s.y - (p.size * s.scale) / 2, p.size * s.scale, p.size * s.scale);
      ctx.restore();
    });
  }

  // ---------------- 플레이어별 이동 궤적(따라다니는 열쇠 표시용) ----------------
  const playerTrails = {}; // playerId -> [{x,y}, ...]
  function getPlayerTrail(id, x, y) {
    const trail = playerTrails[id] || (playerTrails[id] = []);
    trail.push({ x, y });
    if (trail.length > 400) trail.shift();
    return trail;
  }

  // ---------------- 대시 불꽃 트레일 ----------------
  let dashParticles = [];
  function spawnDashParticle(x, y, facing) {
    const backX = -(facing && facing.x) || 0;
    const backY = -(facing && facing.y) || -1;
    const len = Math.hypot(backX, backY) || 1;
    const bx = backX / len, by = backY / len;
    const spreadAngle = (Math.random() - 0.5) * 0.7;
    const baseAngle = Math.atan2(by, bx) + spreadAngle;
    const spd = 15 + Math.random() * 35;
    dashParticles.push({
      x, y, // 플레이어 정중앙에서 시작 - 뒤로 흘러가면서 자연스럽게 몸 밖으로 빠져나가는 것처럼 보인다
      vx: Math.cos(baseAngle) * spd,
      vy: Math.sin(baseAngle) * spd,
      life: 0,
      maxLife: 0.35 + Math.random() * 0.35, // 뒤로 길게 늘어지도록 수명을 넉넉하게
      size: 10 + Math.random() * 10,
    });
  }
  function updateDashParticles(dt) {
    dashParticles.forEach((p) => {
      p.life += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.94;
      p.vy *= 0.94;
    });
    dashParticles = dashParticles.filter((p) => p.life < p.maxLife);
  }
  function drawDashParticles() {
    dashParticles.forEach((p) => {
      const s = toScreen(p.x, p.y);
      const t = p.life / p.maxLife;
      const alpha = (1 - t) * 0.8;
      const size = p.size * (1 - t * 0.6) * s.scale;
      const g = Math.round(210 * (1 - t) + 40 * t);
      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.fillStyle = `rgb(255,${g},0)`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawCompetition(state) {
    ctx.fillStyle = "#dfe6ee";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const g = state.game || {};

    // 공통: 게임 전용 이동 가능 영역 배경
    if (g.bounds) {
      const tl = toScreen(g.bounds.x || 0, g.bounds.y || 0);
      const br = toScreen((g.bounds.x || 0) + g.bounds.w, (g.bounds.y || 0) + g.bounds.h);
      ctx.fillStyle = "#cfd8e3";
      ctx.fillRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
    }

    // 밀어내기: 원형 경기장
    if (g.arena) {
      const arena = g.arena;
      const s = toScreen(arena.x, arena.y);
      ctx.beginPath();
      ctx.arc(s.x, s.y, arena.radius * s.scale, 0, Math.PI * 2);
      ctx.fillStyle = "#b9c2cc";
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#4da6ff";
      ctx.stroke();
      ctx.save();
      ctx.beginPath();
      ctx.arc(s.x, s.y, arena.radius * s.scale, 0, Math.PI * 2);
      ctx.rect(0, 0, canvas.width, canvas.height);
      ctx.clip("evenodd");
      ctx.fillStyle = "rgba(224,83,61,0.10)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    // 레이스: 벽, 결승선
    if (g.walls) {
      g.walls.forEach((w) => drawWorldRect(w, "#2b2d33", 4));
    }
    if (g.finishX != null && g.bounds) {
      const top = toScreen(g.finishX, g.bounds.y || 0);
      const bot = toScreen(g.finishX, (g.bounds.y || 0) + g.bounds.h);
      ctx.save();
      ctx.strokeStyle = "#4caf6d";
      ctx.lineWidth = 8;
      ctx.setLineDash([14, 10]);
      ctx.beginPath();
      ctx.moveTo(top.x, top.y);
      ctx.lineTo(bot.x, bot.y);
      ctx.stroke();
      ctx.restore();
    }

    // 영역 점령: 원형 구역
    if (g.zones) {
      g.zones.forEach((z) => {
        const s = toScreen(z.x, z.y);
        const owner = z.ownerId && (state.players || []).find((p) => p.id === z.ownerId);
        ctx.beginPath();
        ctx.arc(s.x, s.y, z.r * s.scale, 0, Math.PI * 2);
        ctx.fillStyle = owner ? owner.colorHex + "55" : "rgba(43,45,51,0.08)";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = owner ? owner.colorHex : "rgba(43,45,51,0.35)";
        ctx.stroke();
      });
    }

    // 색깔 밟기: 발판
    if (g.pads) {
      g.pads.forEach((pad) => {
        const s = toScreen(pad.x, pad.y);
        ctx.beginPath();
        ctx.arc(s.x, s.y, pad.r * s.scale, 0, Math.PI * 2);
        ctx.fillStyle = pad.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#2b2d33";
        ctx.stroke();
      });
    }

    // 보물 쟁탈: 보물
    if (g.treasures) {
      g.treasures.forEach((tr) => {
        const s = toScreen(tr.x, tr.y);
        const bob = Math.sin(performance.now() / 200 + tr.x) * 3 * s.scale;
        ctx.beginPath();
        ctx.arc(s.x, s.y + bob, tr.r * s.scale, 0, Math.PI * 2);
        ctx.fillStyle = tr.hex;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#2b2d33";
        ctx.stroke();
      });
    }

    // 꼬리잡기 / 폭탄넘기기: 보유자 표시
    const holderId = g.holderId;
    const isTail = g.gameId === "tail_tag";
    const isBomb = g.gameId === "bomb_pass";

    (state.players || []).forEach((p) => {
      const extra = g.playerExtra && g.playerExtra[p.id];
      let label = extra && extra.text;
      drawPlayer(p, label);
      if (holderId === p.id && (isTail || isBomb)) {
        const s = toScreen(p.x, p.y);
        const r = 22 * s.scale;
        ctx.font = `${Math.max(14, 22 * s.scale)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText(isBomb ? "💣" : "🎀", s.x, s.y - r - 22 * s.scale);
      }
      if (extra && extra.biting) {
        const s = toScreen(p.x, p.y);
        const r = 22 * s.scale;
        ctx.font = `${Math.max(16, 26 * s.scale)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffd23f";
        ctx.fillText("!", s.x, s.y - r - 24 * s.scale);
      }
    });

    // 상단 프롬프트 배너 (목표색/신호 등)
    if (g.prompt) {
      ctx.save();
      ctx.font = "bold 26px sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "#2b2d33";
      const textW = ctx.measureText(g.prompt).width;
      roundRect(canvas.width / 2 - textW / 2 - 24, 78, textW + 48, 44, 14);
      ctx.fill();
      ctx.fillStyle = g.gameId === "reaction" && g.phase === "signal" ? "#8fe0a8" : "#ffd23f";
      ctx.fillText(g.prompt, canvas.width / 2, 108);
      ctx.restore();
    }
  }


  function drawEffects() {
    effects.forEach((e) => {
      const prog = e.t / e.life;
      const s = toScreen(e.x, e.y);
      ctx.save();
      ctx.globalAlpha = 1 - prog;
      if (e.type === "attack") {
        ctx.strokeStyle = "#ff8c42";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(s.x, s.y, (30 + prog * 50) * s.scale, 0, Math.PI * 2);
        ctx.stroke();
      } else if (e.type === "hit") {
        ctx.fillStyle = "#e0533d";
        ctx.font = `${28 * s.scale + 10}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText("💥", s.x, s.y - prog * 30);
      } else if (e.type === "key") {
        ctx.fillStyle = "#ffd23f";
        ctx.font = `${20 * s.scale + 10}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText("✨", s.x, s.y - prog * 40);
      } else if (e.type === "eliminated") {
        ctx.fillStyle = "#e0533d";
        ctx.font = `${24 * s.scale + 10}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText("퐁당!", s.x, s.y - prog * 30);
      }
      ctx.restore();
    });
  }

  function render(state, dt) {
    updateEffects(dt);
    if (!state) return;
    const isIndependentCamera = state.mode === "coop" && state.sharedCamera === false && window.myPlayerId;
    let camPoints;
    if (isIndependentCamera) {
      // 이 스테이지는 카메라 공유가 꺼져있음 - 내 캐릭터만 따라가는 독립 카메라
      const me = (state.players || []).find((p) => p.id === window.myPlayerId);
      camPoints = me ? [{ x: me.x, y: me.y }] : (state.players || []).map((p) => ({ x: p.x, y: p.y }));
    } else {
      camPoints = (state.players || []).map((p) => ({ x: p.x, y: p.y }));
    }
    let bounds = null;
    if (state.mode === "coop") {
      bounds = state.bounds;
    } else if (state.game) {
      if (state.game.bounds) {
        bounds = { width: state.game.bounds.w + (state.game.bounds.x || 0) * 2, height: state.game.bounds.h + (state.game.bounds.y || 0) * 2 };
      } else if (state.game.arena) {
        const a = state.game.arena;
        bounds = { width: (a.x + a.radius) * 2, height: (a.y + a.radius) * 2 };
      } else {
        bounds = { width: 1400, height: 840 };
      }
    }
    if (camPoints.length === 0) camPoints.push({ x: 700, y: 400 });
    Camera.update(camPoints, bounds, isIndependentCamera ? { fixedViewW: state.cameraDistance } : null);
    window.__freeViewEnabled = !!(isIndependentCamera && state.freeView);
    if (!window.__freeViewEnabled) Camera.resetPan();

    if (state.mode === "coop") drawCoop(state, dt);
    else drawCompetition(state);

    drawEffects();
  }

  return { init, render, addEffect, resize, spawnBreakParticles, setStageAssets };
})();


// client/js/sound.js
// 외부 저작권 리소스를 쓰지 않고 Web Audio API로 합성한 짧은 효과음.
const Sound = (() => {
  let ctx = null;
  function ensureCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function beep({ freq = 440, duration = 0.1, type = "sine", gain = 0.15, slideTo = null }) {
    try {
      const c = ensureCtx();
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, c.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + duration);
      g.gain.setValueAtTime(gain, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      osc.connect(g).connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + duration);
    } catch (e) {
      /* 오디오 미지원 환경 무시 */
    }
  }

  const PRESETS = {
    button: () => beep({ freq: 520, duration: 0.08, type: "triangle" }),
    countdown: () => beep({ freq: 300, duration: 0.15, type: "square" }),
    start: () => beep({ freq: 300, duration: 0.3, type: "square", slideTo: 700 }),
    attack: () => beep({ freq: 200, duration: 0.12, type: "sawtooth" }),
    hit: () => beep({ freq: 120, duration: 0.15, type: "square" }),
    key: () => beep({ freq: 700, duration: 0.2, type: "triangle", slideTo: 1100 }),
    door: () => beep({ freq: 220, duration: 0.25, type: "sine", slideTo: 340 }),
    eliminated: () => beep({ freq: 400, duration: 0.3, type: "sawtooth", slideTo: 90 }),
    clear: () => beep({ freq: 500, duration: 0.4, type: "triangle", slideTo: 900 }),
    failed: () => beep({ freq: 300, duration: 0.4, type: "sawtooth", slideTo: 80 }),
    score: () => beep({ freq: 650, duration: 0.12, type: "triangle" }),
    victory: () => beep({ freq: 600, duration: 0.5, type: "triangle", slideTo: 1000 }),
  };

  function play(name) {
    if (PRESETS[name]) PRESETS[name]();
  }

  return { play };
})();


// client/js/ui.js
const UI = (() => {
  const screens = {
    title: document.getElementById("screen-title"),
    lobby: document.getElementById("screen-lobby"),
    game: document.getElementById("screen-game"),
  };

  function showScreen(name) {
    Object.values(screens).forEach((s) => s.classList.remove("active"));
    screens[name].classList.add("active");
  }

  function setTitleError(msg) {
    document.getElementById("title-error").textContent = msg || "";
  }
  function setConnStatus(msg) {
    document.getElementById("conn-status").textContent = msg || "";
  }
  function setLobbyError(msg) {
    document.getElementById("lobby-error").textContent = msg || "";
  }

  function renderLobby(roomState, myId) {
    document.getElementById("lobby-room-code").textContent = roomState.code;

    const list = document.getElementById("player-list");
    list.innerHTML = "";
    for (let i = 0; i < MAX_PLAYERS; i++) {
      const p = roomState.players[i];
      const card = document.createElement("div");
      if (!p) {
        card.className = "player-card empty";
        card.textContent = "빈 자리";
        list.appendChild(card);
        continue;
      }
      card.className = "player-card" + (p.ready || p.isHost ? " pready" : "");
      const accEmoji = (ACCESSORIES.find((a) => a.id === p.accessory) || {}).emoji || "";
      card.innerHTML = `
        <div class="dot" style="background:${p.colorHex}"></div>
        <div class="pname">${accEmoji ? accEmoji + " " : ""}${escapeHtml(p.name)}${p.id === myId ? " (나)" : ""}</div>
        ${p.isHost ? '<div class="tag">방장</div>' : p.ready ? '<div class="tag">준비</div>' : ""}
      `;
      list.appendChild(card);
    }

    renderAppearancePicker && renderAppearancePicker(roomState, myId);

    document.getElementById("mode-coop").classList.toggle("active", roomState.mode === "coop");
    document
      .getElementById("mode-competition")
      .classList.toggle("active", roomState.mode === "competition");

    document
      .getElementById("rounds-select")
      .classList.toggle("hidden", roomState.mode !== "competition");
    document.querySelectorAll(".round-btn").forEach((btn) => {
      btn.classList.toggle("active", parseInt(btn.dataset.rounds, 10) === roomState.rounds);
    });

    const isHost = roomState.hostId === myId;
    const me = roomState.players.find((p) => p.id === myId);
    document.getElementById("btn-ready").classList.toggle("hidden", isHost);
    document.getElementById("btn-start").classList.toggle("hidden", !isHost);
    document.getElementById("btn-ready").textContent = me && me.ready ? "준비 취소" : "준비 완료";

    const startBtn = document.getElementById("btn-start");
    const allReady = roomState.players.every((p) => p.ready || p.isHost);
    const enoughPlayers = roomState.players.length >= MIN_PLAYERS;
    startBtn.disabled = !enoughPlayers || (roomState.mode === "coop" && !allReady);

    // 모드 버튼은 방장만 조작 가능
    document.getElementById("mode-coop").disabled = !isHost;
    document.getElementById("mode-competition").disabled = !isHost;
    document.querySelectorAll(".round-btn").forEach((b) => (b.disabled = !isHost));
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function showOverlay(id) {
    document.getElementById(id).classList.remove("hidden");
    if (id === "overlay-stageintro") startLoadingDecorations();
  }
  function hideOverlay(id) {
    document.getElementById(id).classList.add("hidden");
    if (id === "overlay-stageintro") stopLoadingDecorations();
  }

  // ---------------- 로딩 화면 장식(점 애니메이션 + 랜덤 팁) ----------------
  const LOADING_TIPS = [
    "스페이스 바로 칼을 휘두를 수 있습니다.",
    "코인은 플레이어 뒤를 졸졸 따라다닙니다.",
    "대쉬로 물을 뛰어넘을 수 있습니다.",
    "게임을 후원하세요!",
    "이 게임에는 특별한 이스터에그가 있습니다.",
    "이 게임은 한국에서 개발되었습니다.",
    "로비에서 의상을 바꿀 수 있습니다.",
    "최다 후원자는 맵을 직접 추가할 기회가 생깁니다!",
  ];
  const EASTER_EGG_TIP = "이 게임에는 특별한 이스터에그가 있습니다.";
  const EASTER_EGG_TIP_FLIPPED = "이 게임에는 특별한 이스터에그가 없습니다.";
  let loadingDotsInterval = null;
  let loadingEasterEggTimeout = null;
  function startLoadingDecorations() {
    // 점 개수: 2초마다 0-1-2-3-2-1-0 순서로 반복
    const dotsPattern = [0, 1, 2, 3, 2, 1, 0];
    let step = 0;
    const dotsEl = document.getElementById("loading-dots");
    dotsEl.textContent = "";
    loadingDotsInterval = setInterval(() => {
      step = (step + 1) % dotsPattern.length;
      dotsEl.textContent = ".".repeat(dotsPattern[step]);
    }, 2000);

    const tip = LOADING_TIPS[Math.floor(Math.random() * LOADING_TIPS.length)];
    const tipEl = document.getElementById("loading-tip");
    tipEl.textContent = `TIP: ${tip}`;
    if (tip === EASTER_EGG_TIP) {
      loadingEasterEggTimeout = setTimeout(() => {
        tipEl.textContent = `TIP: ${EASTER_EGG_TIP_FLIPPED}`;
      }, 2000);
    }
  }
  function stopLoadingDecorations() {
    if (loadingDotsInterval) { clearInterval(loadingDotsInterval); loadingDotsInterval = null; }
    if (loadingEasterEggTimeout) { clearTimeout(loadingEasterEggTimeout); loadingEasterEggTimeout = null; }
  }
  function hideAllOverlays() {
    [
      "overlay-countdown",
      "overlay-stageintro",
      "overlay-clear",
      "overlay-failed",
      "overlay-roundresult",
      "overlay-finalresult",
    ].forEach(hideOverlay);
  }

  function renderScoreChips(players, scores) {
    const el = document.getElementById("hud-scores");
    if (!scores) {
      el.innerHTML = "";
      return;
    }
    el.innerHTML = players
      .map(
        (p) => `<div class="hud-score-chip"><div class="dot" style="background:${p.colorHex}"></div>${escapeHtml(
          p.name
        )}: ${scores[p.id] || 0}</div>`
      )
      .join("");
  }

  function renderResultRows(container, rows) {
    container.innerHTML = rows
      .map(
        (r, i) => `<div class="result-row">
          <div class="rank">${i + 1}</div>
          <div class="dot" style="background:${r.colorHex}"></div>
          <div class="rname">${escapeHtml(r.name)}</div>
          <div class="rpoints">${r.pointsText}</div>
        </div>`
      )
      .join("");
  }

  return {
    showScreen,
    setTitleError,
    setConnStatus,
    setLobbyError,
    renderLobby,
    showOverlay,
    hideOverlay,
    hideAllOverlays,
    renderScoreChips,
    renderResultRows,
  };
})();


// client/js/app.js
(function () {
  let myId = null;
  let roomState = null;
  let gameState = null;
  let prevGameSubState = null;
  let hudHintTimerStarted = false;
  let selectedMode = "coop";
  let selectedRounds = 5;

  const canvas = document.getElementById("game-canvas");
  Render.init(canvas);

  // ---------------- 자유시점(독립 카메라 + freeView) 마우스 드래그로 카메라 이동 ----------------
  let freeViewDragging = false;
  let freeViewLastPos = null;
  canvas.addEventListener("mousedown", (e) => {
    if (!window.__freeViewEnabled) return;
    freeViewDragging = true;
    freeViewLastPos = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener("mousemove", (e) => {
    if (!freeViewDragging || !window.__freeViewEnabled) return;
    const dx = e.clientX - freeViewLastPos.x;
    const dy = e.clientY - freeViewLastPos.y;
    freeViewLastPos = { x: e.clientX, y: e.clientY };
    Camera.panByScreenDelta(dx, dy);
  });
  window.addEventListener("mouseup", () => { freeViewDragging = false; });
  canvas.addEventListener("dblclick", () => { if (window.__freeViewEnabled) Camera.resetPan(); });

  // ---------------- 연결 ----------------
  // PeerJS 기반이라 미리 연결할 서버가 없다 - "방 만들기"/"참가하기"를 누르는 순간 연결이 시작된다.
  Net.on("_connected", () => UI.setConnStatus(""));
  Net.on("_disconnected", () => UI.setConnStatus("호스트와 연결이 끊어졌습니다. 새로고침 후 다시 시도해주세요."));
  Net.connect();

  // ---------------- 원격 참가자 수신 준비 상태 (방장 화면 전용) ----------------
  const peerStatusEl = document.getElementById("lobby-peer-status");
  function setPeerStatus(text, cls) {
    peerStatusEl.textContent = text;
    peerStatusEl.className = "peer-status" + (cls ? " " + cls : "");
  }
  Net.on("_peer_signaling_pending", () => {
    setPeerStatus("⏳ 참가자를 받을 준비 중... 코드는 잠시 후 공유해주세요", "pending");
  });
  Net.on("_peer_signaling_ready", () => {
    setPeerStatus("✅ 참가자를 초대할 수 있습니다", "ready");
  });
  Net.on("_peer_signaling_error", () => {
    setPeerStatus("⚠ 원격 참가자 연결 실패 - 같은 화면에서만 플레이 가능", "error");
  });

  // ---------------- 타이틀 화면 ----------------
  const nameInput = document.getElementById("input-name");
  const codeInput = document.getElementById("input-room-code");

  function getName() {
    return (nameInput.value || "").trim();
  }

  document.getElementById("btn-create-room").addEventListener("click", () => {
    Sound.play("button");
    const name = getName();
    if (!name) {
      UI.setTitleError("닉네임을 입력하세요.");
      nameInput.focus();
      return;
    }
    UI.setTitleError("");
    UI.setConnStatus("방 만드는 중...");
    Net.send(MSG.CREATE_ROOM, { name });
  });

  document.getElementById("btn-join-room").addEventListener("click", () => {
    Sound.play("button");
    const name = getName();
    if (!name) {
      UI.setTitleError("닉네임을 입력하세요.");
      nameInput.focus();
      return;
    }
    const code = codeInput.value.trim().toUpperCase();
    if (!code) {
      UI.setTitleError("방 코드를 입력하세요.");
      return;
    }
    UI.setTitleError("");
    UI.setConnStatus("연결하는 중...");
    Net.send(MSG.JOIN_ROOM, { code, name });
  });

  Net.on(MSG.ROOM_ERROR, (payload) => {
    UI.setConnStatus("");
    UI.setTitleError(payload.message);
    UI.setLobbyError(payload.message);
  });

  // ---------------- 로비 ----------------
  Net.on(MSG.ROOM_STATE, (payload) => {
    if (payload.joined) {
      myId = payload.playerId;
      window.myPlayerId = myId; // render.js(공유/독립 카메라 판단)에서 참조
      UI.showScreen("lobby");
      return;
    }
    roomState = payload;
    selectedMode = payload.mode;
    selectedRounds = payload.rounds;
    if (payload.phase === "lobby") {
      UI.showScreen("lobby");
      UI.renderLobby(roomState, myId);
      hudHintTimerStarted = false;
      const hintEl = document.getElementById("hud-controls-hint");
      if (hintEl) hintEl.classList.remove("faded");
    } else if (payload.phase === "in_game") {
      UI.showScreen("game");
      Input.setEnabled(true);
      prevGameSubState = null;
      if (!hudHintTimerStarted) {
        hudHintTimerStarted = true;
        setTimeout(() => {
          const hintEl = document.getElementById("hud-controls-hint");
          if (hintEl) hintEl.classList.add("faded");
        }, 10000);
      }
    }
  });

  document.getElementById("mode-coop").addEventListener("click", () => {
    Sound.play("button");
    Net.send(MSG.SET_MODE, { mode: "coop" });
  });
  document.getElementById("mode-competition").addEventListener("click", () => {
    Sound.play("button");
    Net.send(MSG.SET_MODE, { mode: "competition" });
  });
  document.querySelectorAll(".round-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      Sound.play("button");
      Net.send(MSG.SET_ROUNDS, { rounds: parseInt(btn.dataset.rounds, 10) });
    });
  });
  document.getElementById("btn-ready").addEventListener("click", () => {
    Sound.play("button");
    const me = roomState.players.find((p) => p.id === myId);
    Net.send(MSG.SET_READY, { ready: !(me && me.ready) });
  });

  // ---------------- 캐릭터 커스터마이징(색상/장신구/칼 스킨) ----------------
  window.swordSkinCache = window.swordSkinCache || {}; // playerId -> dataURL (다른 플레이어가 올린 칼 스킨 캐시)
  const swordSkinCache = window.swordSkinCache;
  let mySwordSkin = null;

  function renderAppearancePicker(roomState, myId) {
    const me = roomState.players.find((p) => p.id === myId);
    if (!me) return;
    const takenColorIds = new Set(roomState.players.filter((p) => p.id !== myId).map((p) => p.color));

    const swatchesEl = document.getElementById("color-swatches");
    swatchesEl.innerHTML = "";
    PLAYER_COLORS.forEach((c) => {
      const el = document.createElement("div");
      const taken = takenColorIds.has(c.id);
      el.className = "color-swatch" + (me.color === c.id ? " selected" : "") + (taken ? " taken" : "");
      el.style.background = c.hex;
      el.title = taken ? "이미 다른 플레이어가 사용 중" : c.id;
      if (!taken) {
        el.addEventListener("click", () => Net.send(MSG.SET_APPEARANCE, { colorId: c.id }));
      }
      swatchesEl.appendChild(el);
    });

    const accEl = document.getElementById("accessory-buttons");
    accEl.innerHTML = "";
    ACCESSORIES.forEach((a) => {
      const btn = document.createElement("button");
      btn.className = "accessory-btn" + ((me.accessory || "none") === a.id ? " selected" : "");
      btn.textContent = a.emoji || a.label;
      btn.title = a.label;
      btn.addEventListener("click", () => Net.send(MSG.SET_APPEARANCE, { accessory: a.id }));
      accEl.appendChild(btn);
    });

    const presetsEl = document.getElementById("sword-skin-presets");
    presetsEl.innerHTML = "";
    SWORD_SKIN_PRESETS.forEach((p) => {
      const btn = document.createElement("button");
      btn.className = "sword-skin-preset-btn" + (mySwordSkin === p.dataUrl ? " selected" : "");
      btn.title = p.label;
      btn.innerHTML = `<img src="${p.dataUrl}" alt="${p.label}" />`;
      btn.addEventListener("click", () => {
        mySwordSkin = p.dataUrl;
        swordSkinCache[myId] = mySwordSkin;
        Net.send(MSG.SET_APPEARANCE, { swordSkin: mySwordSkin });
        document.getElementById("btn-remove-sword-skin").classList.remove("hidden");
        renderAppearancePicker(roomState, myId);
      });
      presetsEl.appendChild(btn);
    });

    document.getElementById("btn-remove-sword-skin").classList.toggle("hidden", !mySwordSkin);
  }
  window.renderAppearancePicker = renderAppearancePicker;

  document.getElementById("sword-skin-upload").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 300 * 1024) {
      alert(`이미지가 너무 큽니다 (${Math.round(file.size / 1024)}KB). 300KB 이하로 줄여서 다시 올려주세요.`);
      e.target.value = "";
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      mySwordSkin = reader.result;
      swordSkinCache[myId] = mySwordSkin;
      Net.send(MSG.SET_APPEARANCE, { swordSkin: mySwordSkin });
      document.getElementById("btn-remove-sword-skin").classList.remove("hidden");
    };
    reader.readAsDataURL(file);
  });
  document.getElementById("btn-remove-sword-skin").addEventListener("click", () => {
    mySwordSkin = null;
    delete swordSkinCache[myId];
    Net.send(MSG.SET_APPEARANCE, { swordSkin: null });
    document.getElementById("btn-remove-sword-skin").classList.add("hidden");
    document.getElementById("sword-skin-upload").value = "";
  });

  document.getElementById("btn-start").addEventListener("click", async () => {
    Sound.play("button");
    if (window.__customStagesScanPromise) await window.__customStagesScanPromise; // 번호 붙은 커스텀 스테이지 파일 스캔이 끝났는지 확실히 기다린다
    Net.send(MSG.START_GAME, {});
  });
  document.getElementById("btn-leave-room").addEventListener("click", () => {
    Net.send(MSG.LEAVE_ROOM, {});
    location.reload();
  });
  document.getElementById("btn-back-to-lobby").addEventListener("click", () => {
    Sound.play("button");
    Net.send(MSG.RETURN_TO_LOBBY, {});
  });
  document.getElementById("btn-quit-to-lobby").addEventListener("click", () => {
    if (!confirm("지금 그만두고 팀 전체가 로비로 돌아갈까요? (진행 중인 스테이지는 저장되지 않습니다)")) return;
    Sound.play("button");
    Net.send(MSG.RETURN_TO_LOBBY, {});
  });
  document.getElementById("btn-retry").addEventListener("click", () => {
    Sound.play("button");
    Net.send(MSG.RETRY_STAGE, {});
  });

  // ---------------- 게임 상태 ----------------
  const countdownNumEl = document.getElementById("overlay-countdown-num");
  let lastCountdownShown = null;
  let lastIntroPanStageIndex = null;

  Net.on(MSG.GAME_STATE, (payload) => {
    gameState = payload;
    handleStateTransition(payload);
    updateHud(payload);
    // 스폰이 한 곳뿐인 맵이면, 스테이지 시작 시 카메라가 골(도착)까지 훑고 오는 연출
    if (
      payload.mode === "coop" &&
      payload.state === "stage_intro" &&
      payload.singleSpawn &&
      payload.stageIndex !== lastIntroPanStageIndex &&
      payload.players && payload.players.length && payload.goal
    ) {
      lastIntroPanStageIndex = payload.stageIndex;
      const fromX = payload.players[0].x, fromY = payload.players[0].y;
      const toX = payload.goal.x + payload.goal.w / 2, toY = payload.goal.y + payload.goal.h / 2;
      Camera.startIntroPan(fromX, fromY, toX, toY);
    }
    if (payload.state === "countdown" && payload.countdown != null) {
      if (payload.countdown !== lastCountdownShown) {
        lastCountdownShown = payload.countdown;
        countdownNumEl.textContent = payload.countdown > 0 ? payload.countdown : "GO!";
        // 숫자가 바뀔 때마다 팝 애니메이션이 다시 재생되도록 강제로 리스타트한다
        countdownNumEl.style.animation = "none";
        void countdownNumEl.offsetWidth; // 리플로우를 강제해서 애니메이션 재시작을 인식시킴
        countdownNumEl.style.animation = "";
        Sound.play("countdown");
      }
    } else {
      lastCountdownShown = null;
    }
  });

  Net.on(MSG.GAME_EVENT, (payload) => {
    handleGameEvent(payload.event, payload.data);
  });

  function handleGameEvent(event, data) {
    switch (event) {
      case "attack":
        Render.addEffect({ type: "attack", x: data.x, y: data.y, life: 0.25 });
        Sound.play("attack");
        break;
      case "hit": {
        const p = (gameState.players || []).find((pl) => pl.id === data.target);
        if (p) Render.addEffect({ type: "hit", x: p.x, y: p.y, life: 0.35 });
        Sound.play("hit");
        break;
      }
      case "eliminated": {
        const p = (gameState.players || []).find((pl) => pl.id === data.id);
        if (p) Render.addEffect({ type: "eliminated", x: p.x, y: p.y, life: 0.6 });
        Sound.play("eliminated");
        break;
      }
      case "key_collected": {
        const key = (gameState.keys || []).find((k) => k.id === data.keyId);
        if (key) Render.addEffect({ type: "key", x: key.x, y: key.y, life: 0.5 });
        Sound.play("key");
        break;
      }
      case "stage_clear":
        Sound.play("clear");
        break;
      case "stage_failed":
        Sound.play("failed");
        break;
      case "block_broken":
        Render.spawnBreakParticles(data.x, data.y);
        Sound.play("hit");
        break;
      case "stage_assets":
        Render.setStageAssets(data);
        break;
      case "player_sword_skin":
        window.swordSkinCache = window.swordSkinCache || {};
        if (data.swordSkin) window.swordSkinCache[data.playerId] = data.swordSkin;
        else delete window.swordSkinCache[data.playerId];
        break;
      case "room_notice":
        UI.setLobbyError(data.message);
        break;
      default:
        break;
    }
  }

  function handleStateTransition(state) {
    if (state.state === prevGameSubState) return;
    const prev = prevGameSubState;
    prevGameSubState = state.state;
    UI.hideAllOverlays();

    if (state.mode === "coop") {
      switch (state.state) {
        case "stage_intro":
          document.getElementById("stageintro-title").textContent = `STAGE ${state.stageIndex + 1} - ${state.stageName}`;
          document.getElementById("stageintro-sub").textContent = `열쇠 ${state.totalKeys}개를 모아 문을 열고 전원 골인하라!`;
          UI.showOverlay("overlay-stageintro");
          break;
        case "countdown":
          UI.showOverlay("overlay-countdown");
          break;
        case "playing":
          if (prev === "countdown") Sound.play("start");
          break;
        case "clear":
          UI.showOverlay("overlay-clear");
          break;
        case "failed":
          document.getElementById("failed-reason").textContent = state.failReason || "";
          UI.showOverlay("overlay-failed");
          break;
        case "result":
          break;
      }
    } else {
      switch (state.state) {
        case "game_intro":
          document.getElementById("stageintro-title").textContent = `ROUND ${state.round} - ${state.gameName}`;
          document.getElementById("stageintro-sub").textContent =
            `${state.gameDescription} (핵심: ${state.coreTraits.join(" + ")})`;
          UI.showOverlay("overlay-stageintro");
          break;
        case "countdown":
          UI.showOverlay("overlay-countdown");
          break;
        case "playing":
          if (prev === "countdown") Sound.play("start");
          break;
        case "game_end":
          break;
        case "result": {
          const rows = buildRoundResultRows(state);
          UI.renderResultRows(document.getElementById("roundresult-body"), rows);
          UI.showOverlay("overlay-roundresult");
          Sound.play("score");
          break;
        }
        case "final_result": {
          const rows = buildFinalResultRows(state);
          UI.renderResultRows(document.getElementById("finalresult-body"), rows);
          UI.showOverlay("overlay-finalresult");
          Sound.play("victory");
          break;
        }
      }
    }
  }

  function buildRoundResultRows(state) {
    if (!state.lastRoundResult) return [];
    const { ranking, pointsGained } = state.lastRoundResult;
    return ranking.map((pid) => {
      const p = (state.players || []).find((pl) => pl.id === pid) || { name: "?", colorHex: "#fff" };
      return { name: p.name, colorHex: p.colorHex, pointsText: `+${pointsGained[pid]}점` };
    });
  }

  function buildFinalResultRows(state) {
    if (!state.finalRanking) return [];
    return state.finalRanking.map((r) => {
      const p = (state.players || []).find((pl) => pl.id === r.id) || { name: "?", colorHex: "#fff" };
      return { name: p.name, colorHex: p.colorHex, pointsText: `${r.score}점` };
    });
  }

  function updateHud(state) {
    const modeTitle = document.getElementById("hud-mode-title");
    const objective = document.getElementById("hud-objective");
    const timer = document.getElementById("hud-timer");

    if (state.mode === "coop") {
      modeTitle.textContent = `협동 · STAGE ${state.stageIndex + 1}/${state.totalStages}`;
      objective.textContent = `${state.stageName} — 열쇠 ${state.collectedKeys}/${state.totalKeys} 획득, 전원 골인하기`;
      timer.textContent = state.timeLeft != null ? `⏱ ${state.timeLeft}s` : "";
      UI.renderScoreChips(state.players, null);
    } else {
      modeTitle.textContent = `경쟁 · ROUND ${state.round}/${state.totalRounds}`;
      objective.textContent = `${state.gameName} (${(state.coreTraits || []).join(" + ")})`;
      timer.textContent = state.game && state.game.timeLeft != null ? `⏱ ${state.game.timeLeft}s` : "";
      UI.renderScoreChips(state.players, state.scores);
    }
  }

  // ---------------- 게임 루프 ----------------
  let lastFrame = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    if (gameState && document.getElementById("screen-game").classList.contains("active")) {
      Render.render(gameState, dt);
      Net.send(MSG.INPUT, Input.getState());
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

  </script>
</body>
</html>
