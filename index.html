<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #eef2f6;
  --panel-bg: #ffffff;
  --ink: #2b2d33;
  --line: #2b2d33;
  --accent: #ff8c42;
  --accent-2: #4da6ff;
  --text-main: #2b2d33;
  --text-dim: #6b6f76;
  --success: #4caf6d;
  --danger: #e0533d;
  --radius: 18px;
}

html, body {
  height: 100%;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text-main);
  overflow: hidden;
}

.screen {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.screen.active { display: flex; }

.panel {
  background: var(--panel-bg);
  border: 3px solid var(--line);
  border-radius: var(--radius);
  padding: 40px;
  box-shadow: 0 6px 0 var(--line);
}

/* ---------- TITLE ---------- */
.title-panel {
  width: min(420px, 90vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
  animation: pop-in .3s ease;
}
.game-logo {
  font-size: 44px;
  font-weight: 900;
  letter-spacing: -1px;
  color: var(--ink);
}
.game-logo span {
  color: var(--accent);
}
.subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 10px; }

.text-input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--bg);
  color: var(--text-main);
  font-size: 16px;
  outline: none;
}
.text-input:focus { border-color: var(--accent); }
.code-input { text-transform: uppercase; text-align: center; letter-spacing: 6px; font-weight: 700; }

.btn-row { width: 100%; }
.join-row { display: flex; gap: 8px; width: 100%; }
.join-row .code-input { flex: 1; min-width: 0; }
.join-row .btn { flex: 0 0 auto; white-space: nowrap; }

.btn {
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 13px 18px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .1s ease;
  color: var(--ink);
  box-shadow: 0 4px 0 var(--line);
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn-primary { background: var(--accent); width: 100%; color: #fff; }
.btn-secondary { background: var(--accent-2); flex: 1; white-space: nowrap; color: #fff; }
.btn-ghost { background: var(--bg); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.hidden { display: none !important; }

.error-text { color: var(--danger); font-size: 13px; min-height: 18px; font-weight: 600; }
.conn-status { color: var(--text-dim); font-size: 12px; }

@keyframes pop-in { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:none;} }

/* ---------- LOBBY ---------- */
.lobby-panel {
  width: min(560px, 92vw);
  display: flex;
  flex-direction: column;
  gap: 18px;
  animation: pop-in .3s ease;
}
.lobby-header { display: flex; justify-content: space-between; align-items: center; }
.room-code-label { font-size: 12px; color: var(--text-dim); }
.room-code { font-size: 32px; font-weight: 800; letter-spacing: 8px; color: var(--ink); }

.player-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.player-card {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: 12px;
  background: var(--bg); border: 2px solid var(--line);
}
.player-card .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--line); }
.player-card .pname { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-card .tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: var(--ink); color: #fff; }
.player-card.pready { border-color: var(--success); }
.player-card.empty { opacity: 0.4; justify-content: center; border-style: dashed; }

.mode-select { display: flex; gap: 10px; }
.mode-btn {
  flex: 1; padding: 12px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--bg); color: var(--text-dim); font-weight: 700; cursor: pointer;
}
.mode-btn.active { background: var(--accent); color: #fff; }

.rounds-select { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-dim); }
.rounds-options { display: flex; gap: 8px; }
.round-btn {
  padding: 8px 14px; border-radius: 10px; border: 2px solid var(--line);
  background: var(--bg); color: var(--text-main); cursor: pointer;
}
.round-btn.active { background: var(--accent-2); color: #fff; font-weight: 800; }

.lobby-footer { display: flex; gap: 10px; }
.lobby-footer .btn { flex: 1; }

/* ---------- GAME ---------- */
#screen-game { background: #dfe6ee; }
#game-canvas { display: block; width: 100vw; height: 100vh; background: #dfe6ee; }

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; flex-direction: column; gap: 6px;
  padding: 16px 22px; pointer-events: none; z-index: 5;
}
.hud-top { display: flex; align-items: center; gap: 14px; }
.hud-badge {
  background: var(--ink); color: #fff; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 13px;
}
.hud-objective { flex: 1; color: var(--ink); font-weight: 700; font-size: 14px; background: rgba(255,255,255,0.75); padding: 4px 10px; border-radius: 10px; display: inline-block; }
.hud-timer { background: var(--ink); color: #fff; padding: 6px 16px; border-radius: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hud-scores { display: flex; gap: 8px; flex-wrap: wrap; }
.hud-score-chip {
  display: flex; align-items: center; gap: 6px;
  background: #fff; border: 2px solid var(--line); padding: 4px 10px; border-radius: 14px; font-size: 12px; font-weight: 700;
}
.hud-score-chip .dot { width: 10px; height: 10px; border-radius: 50%; }
.hud-controls {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 12px;
}

.overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(43,45,51,0.45); z-index: 10; animation: fade-in .15s ease;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.overlay-card {
  background: #fff; border: 3px solid var(--line); border-radius: 20px;
  padding: 36px 48px; text-align: center; min-width: 280px;

}
.overlay-title { font-size: 34px; font-weight: 900; letter-spacing: 2px; color: var(--ink); }
.overlay-sub { margin-top: 10px; color: var(--text-dim); }
.clear-card .overlay-title { color: var(--success); }
.failed-card .overlay-title { color: var(--danger); }
.failed-card .btn { margin-top: 18px; }

.countdown-num {
  font-size: 140px; font-weight: 900; color: var(--accent);
  animation: countdown-pop .9s ease infinite;
}
@keyframes countdown-pop { 0% { transform: scale(1.3); opacity: 0;} 30% {transform: scale(1); opacity: 1;} 100% {opacity: 0.2;} }

.result-body { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 260px; }
.result-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--bg); border: 2px solid var(--line); border-radius: 12px;
}
.result-row .rank { font-weight: 900; width: 28px; color: var(--ink); }
.result-row .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); }
.result-row .rname { flex: 1; text-align: left; color: var(--ink); }
.result-row .rpoints { font-weight: 800; color: var(--accent-2); }

  </style>

<script>
// shared/constants.js
// 서버와 클라이언트가 공통으로 사용하는 상수 정의.
// (서버에서는 require, 클라이언트에서는 <script> 태그로 그대로 로드해서 window.SHARED 에 붙인다)

const TICK_RATE = 30; // 서버 시뮬레이션 tick (Hz)
const TICK_MS = 1000 / TICK_RATE;

const ROOM_CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 헷갈리는 0/O, 1/I 제외
const ROOM_CODE_LENGTH = 4;
const MIN_PLAYERS = 2;
const MAX_PLAYERS = 4;

const PLAYER_COLORS = [
  { id: "red", hex: "#e0533d" },
  { id: "blue", hex: "#4d9dff" },
  { id: "yellow", hex: "#ffd23f" },
  { id: "green", hex: "#3fd97f" },
];

// ---- 입력 키 (중앙 입력 시스템에서 참조) ----
const KEYS = {
  UP: "KeyW",
  LEFT: "KeyA",
  DOWN: "KeyS",
  RIGHT: "KeyD",
  ACTION: "Space", // 공격 / 기본 액션
  INTERACT: "KeyE", // 상호작용
  DASH: "ShiftLeft", // 대시 / 보조 액션
};

// ---- 메시지 타입 (클라이언트 <-> 서버) ----
const MSG = {
  // room / lobby
  CREATE_ROOM: "create_room",
  JOIN_ROOM: "join_room",
  ROOM_STATE: "room_state",
  ROOM_ERROR: "room_error",
  SET_MODE: "set_mode",
  SET_ROUNDS: "set_rounds",
  SET_READY: "set_ready",
  START_GAME: "start_game",
  LEAVE_ROOM: "leave_room",

  // gameplay
  INPUT: "input", // 클라이언트가 보내는 입력 상태
  GAME_STATE: "game_state", // 서버가 매 tick 브로드캐스트하는 전체 상태
  GAME_EVENT: "game_event", // 1회성 이벤트(효과음/이펙트 트리거용)
  RETRY_STAGE: "retry_stage",
  RETURN_TO_LOBBY: "return_to_lobby",

  PING: "ping",
  PONG: "pong",
};

// ---- 상위 게임 모드 ----
const MODE = {
  COOP: "coop",
  COMPETITION: "competition",
};

// ---- 방/로비 상태 ----
const ROOM_PHASE = {
  LOBBY: "lobby",
  IN_GAME: "in_game",
};

// ---- 협동 스테이지 상태 머신 ----
const COOP_STATE = {
  STAGE_INTRO: "stage_intro",
  COUNTDOWN: "countdown",
  PLAYING: "playing",
  CLEAR: "clear",
  FAILED: "failed",
  RESULT: "result",
};

// ---- 경쟁 라운드 상태 머신 ----
const COMP_STATE = {
  GAME_INTRO: "game_intro",
  COUNTDOWN: "countdown",
  PLAYING: "playing",
  GAME_END: "game_end",
  RESULT: "result",
  FINAL_RESULT: "final_result",
};

// ---- 물리 상수 (월드 단위, 픽셀 기준) ----
const PHYSICS = {
  MOVE_SPEED: 220, // px/s
  DASH_SPEED: 480,
  DASH_DURATION: 0.18, // 초
  DASH_COOLDOWN: 0.8,
  PLAYER_RADIUS: 22,
  GRAVITY: 1400,
  JUMP_UNUSED: false, // 탑다운 시점이라 별도 점프 없음 (이동발판/구멍으로 낙하 표현)
};

const COUNTDOWN_SECONDS = 3;

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    TICK_RATE,
    TICK_MS,
    ROOM_CODE_CHARS,
    ROOM_CODE_LENGTH,
    MIN_PLAYERS,
    MAX_PLAYERS,
    PLAYER_COLORS,
    KEYS,
    MSG,
    MODE,
    ROOM_PHASE,
    COOP_STATE,
    COMP_STATE,
    PHYSICS,
    COUNTDOWN_SECONDS,
  };
}

// client/js/net.js
const Net = (() => {
  let ws = null;
  const listeners = {};
  let connected = false;
  let manualClose = false;
  let reconnectAttempts = 0;

  function on(type, cb) {
    listeners[type] = listeners[type] || [];
    listeners[type].push(cb);
  }

  function emit(type, payload) {
    (listeners[type] || []).forEach((cb) => cb(payload));
    (listeners["*"] || []).forEach((cb) => cb(type, payload));
  }

  function connect() {
    manualClose = false;
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${protocol}//${location.host}`);

    ws.onopen = () => {
      connected = true;
      reconnectAttempts = 0;
      emit("_connected", {});
    };

    ws.onmessage = (ev) => {
      let msg;
      try {
        msg = JSON.parse(ev.data);
      } catch (e) {
        console.error("[net] 잘못된 메시지:", e);
        return;
      }
      emit(msg.type, msg.payload);
    };

    ws.onclose = () => {
      connected = false;
      emit("_disconnected", {});
      if (!manualClose && reconnectAttempts < 5) {
        reconnectAttempts++;
        setTimeout(connect, 1000 * reconnectAttempts);
      }
    };

    ws.onerror = () => {
      // onclose가 뒤따라 호출됨
    };
  }

  function send(type, payload) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type, payload }));
    }
  }

  function isConnected() {
    return connected;
  }

  function close() {
    manualClose = true;
    if (ws) ws.close();
  }

  return { connect, send, on, isConnected, close };
})();


// client/js/input.js
// 중앙 입력 시스템: shared/constants.js의 KEYS 맵을 유일한 출처로 사용한다.
const Input = (() => {
  const state = {
    up: false,
    down: false,
    left: false,
    right: false,
    action: false,
    interact: false,
    dash: false,
  };

  const codeToField = {
    [KEYS.UP]: "up",
    [KEYS.DOWN]: "down",
    [KEYS.LEFT]: "left",
    [KEYS.RIGHT]: "right",
    [KEYS.ACTION]: "action",
    [KEYS.INTERACT]: "interact",
    [KEYS.DASH]: "dash",
  };

  let enabled = false;

  function onKeyDown(e) {
    if (!enabled) return;
    const field = codeToField[e.code];
    if (field) {
      state[field] = true;
      e.preventDefault();
    }
  }
  function onKeyUp(e) {
    const field = codeToField[e.code];
    if (field) {
      state[field] = false;
      e.preventDefault();
    }
  }

  window.addEventListener("keydown", onKeyDown);
  window.addEventListener("keyup", onKeyUp);
  window.addEventListener("blur", () => {
    Object.keys(state).forEach((k) => (state[k] = false));
  });

  function setEnabled(v) {
    enabled = v;
    if (!v) Object.keys(state).forEach((k) => (state[k] = false));
  }

  function getState() {
    return { ...state };
  }

  return { setEnabled, getState };
})();


// client/js/camera.js
// 모든 플레이어가 하나의 공유 시점을 본다. 독립 카메라 금지.
const Camera = (() => {
  let x = 700, y = 400;
  let viewW = 1200, viewH = 700;
  const MARGIN = 220;
  const MIN_VIEW_W = 700;
  const MAX_VIEW_W = 2000;
  const LERP = 0.08;

  function update(points, worldBounds) {
    if (!points || points.length === 0) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    points.forEach((p) => {
      minX = Math.min(minX, p.x);
      maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y);
      maxY = Math.max(maxY, p.y);
    });

    const targetCenterX = (minX + maxX) / 2;
    const targetCenterY = (minY + maxY) / 2;

    const aspect = (canvasEl ? canvasEl.width / canvasEl.height : 16 / 9) || 16 / 9;
    let neededW = Math.max(maxX - minX + MARGIN * 2, MIN_VIEW_W);
    let neededH = neededW / aspect;
    if (neededH < maxY - minY + MARGIN * 2) {
      neededH = maxY - minY + MARGIN * 2;
      neededW = neededH * aspect;
    }
    neededW = Math.min(neededW, MAX_VIEW_W);
    neededH = neededW / aspect;

    let targetX = targetCenterX;
    let targetY = targetCenterY;

    if (worldBounds) {
      const halfW = neededW / 2;
      const halfH = neededH / 2;
      targetX = Math.max(halfW, Math.min(worldBounds.width - halfW, targetX));
      targetY = Math.max(halfH, Math.min(worldBounds.height - halfH, targetY));
      if (worldBounds.width < neededW) targetX = worldBounds.width / 2;
      if (worldBounds.height < neededH) targetY = worldBounds.height / 2;
    }

    x += (targetX - x) * LERP;
    y += (targetY - y) * LERP;
    viewW += (neededW - viewW) * LERP;
    viewH += (neededH - viewH) * LERP;
  }

  let canvasEl = null;
  function setCanvas(c) {
    canvasEl = c;
  }

  function getView() {
    return { x, y, w: viewW, h: viewH };
  }

  function worldToScreen(wx, wy, canvasW, canvasH) {
    const scale = canvasW / viewW;
    const sx = (wx - (x - viewW / 2)) * scale;
    const sy = (wy - (y - viewH / 2)) * scale;
    return { x: sx, y: sy, scale };
  }

  return { update, getView, worldToScreen, setCanvas };
})();


// client/js/render.js
const Render = (() => {
  let canvas, ctx;
  let effects = []; // {type, x, y, t, life, ...}

  function init(canvasEl) {
    canvas = canvasEl;
    ctx = canvas.getContext("2d");
    Camera.setCanvas(canvas);
    resize();
    window.addEventListener("resize", resize);
  }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function addEffect(effect) {
    effects.push({ t: 0, life: 0.5, ...effect });
  }

  function updateEffects(dt) {
    effects.forEach((e) => (e.t += dt));
    effects = effects.filter((e) => e.t < e.life);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function toScreen(wx, wy) {
    return Camera.worldToScreen(wx, wy, canvas.width, canvas.height);
  }

  function drawWorldRect(rect, color, radius = 8) {
    const s = toScreen(rect.x, rect.y);
    const w = rect.w * s.scale;
    const h = rect.h * s.scale;
    ctx.fillStyle = color;
    roundRect(s.x, s.y, w, h, Math.min(radius * s.scale, w / 2, h / 2));
    ctx.fill();
  }

  function drawPlayer(p, extraText) {
    const s = toScreen(p.x, p.y);
    const r = 22 * s.scale;
    const dead = p.status === "eliminated";
    ctx.save();
    ctx.globalAlpha = dead ? 0.3 : 1;

    // 그림자
    ctx.beginPath();
    ctx.ellipse(s.x, s.y + r * 0.75, r * 0.9, r * 0.35, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(43,45,51,0.25)";
    ctx.fill();

    // 몸통
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.fillStyle = p.colorHex || "#fff";
    ctx.fill();
    ctx.lineWidth = Math.max(2, 3 * s.scale);
    ctx.strokeStyle = "#2b2d33";
    ctx.stroke();

    // 눈 (바라보는 방향 표시)
    const fx = p.facing ? p.facing.x : 0;
    const fy = p.facing ? p.facing.y : 1;
    const eyeOffsetX = fx * r * 0.35;
    const eyeOffsetY = fy * r * 0.35;
    ctx.fillStyle = "#2b2d33";
    [-1, 1].forEach((side) => {
      const perpX = -fy * side * r * 0.28;
      const perpY = fx * side * r * 0.28;
      ctx.beginPath();
      ctx.arc(s.x + eyeOffsetX + perpX, s.y + eyeOffsetY + perpY, Math.max(2, r * 0.13), 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();

    // 이름표
    ctx.font = `${Math.max(10, 12 * s.scale)}px sans-serif`;
    ctx.textAlign = "center";
    ctx.fillStyle = "#2b2d33";
    ctx.fillText(p.name, s.x, s.y - r - 8 * s.scale);

    if (dead) {
      ctx.font = `${Math.max(10, 14 * s.scale)}px sans-serif`;
      ctx.fillStyle = "#e0533d";
      ctx.fillText("X", s.x, s.y + 5 * s.scale);
    }

    if (extraText) {
      ctx.font = `${Math.max(10, 12 * s.scale)}px sans-serif`;
      ctx.fillStyle = "#c98a2e";
      ctx.fillText(extraText, s.x, s.y + r + 16 * s.scale);
    }
  }

  function drawCoop(state) {
    const bg = state.bounds;
    // 배경
    const topLeft = toScreen(0, 0);
    const botRight = toScreen(bg.width, bg.height);
    ctx.fillStyle = "#cfd8e3";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#e4ebf2";
    ctx.fillRect(topLeft.x, topLeft.y, botRight.x - topLeft.x, botRight.y - topLeft.y);

    // 구멍
    state.pits.forEach((pit) => drawWorldRect(pit, "#33363d", 4));

    // 목표
    drawWorldRect(state.goal, "#4caf6d", 14);
    const gS = toScreen(state.goal.x + state.goal.w / 2, state.goal.y - 14);
    ctx.font = `${12 * gS.scale + 10}px sans-serif`;
    ctx.fillStyle = "#4caf6d";
    ctx.textAlign = "center";
    ctx.fillText("GOAL", gS.x, gS.y);

    // 이동 발판
    state.platforms.forEach((p) => drawWorldRect(p, "#ffb74d", 6));

    // 압력판
    state.plates.forEach((p) => {
      const s = toScreen(p.x, p.y);
      ctx.beginPath();
      ctx.arc(s.x, s.y, p.r * s.scale, 0, Math.PI * 2);
      ctx.fillStyle = p.active ? "#4caf6d" : "#b9c2cc";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#2b2d33";
      ctx.stroke();
    });

    // 문
    state.doors.forEach((d) => {
      if (d.open) return; // 열리면 그리지 않음
      drawWorldRect(d, "#c9793a", 4);
    });

    // 벽
    state.walls.forEach((w) => drawWorldRect(w, "#2b2d33", 3));

    // 열쇠
    state.keys.forEach((k) => {
      if (k.collected) return;
      const s = toScreen(k.x, k.y);
      const bob = Math.sin(performance.now() / 240 + k.x) * 4 * s.scale;
      ctx.save();
      ctx.translate(s.x, s.y + bob);
      ctx.fillStyle = "#ffd23f";
      ctx.beginPath();
      ctx.arc(0, 0, k.r * s.scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#2b2d33";
      ctx.stroke();
      ctx.fillStyle = "#2b2d33";
      ctx.font = `${14 * s.scale + 6}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🔑", 0, 0);
      ctx.restore();
    });

    (state.players || []).forEach((p) => drawPlayer(p));
  }

  function drawCompetition(state) {
    ctx.fillStyle = "#dfe6ee";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const g = state.game || {};

    // 공통: 게임 전용 이동 가능 영역 배경
    if (g.bounds) {
      const tl = toScreen(g.bounds.x || 0, g.bounds.y || 0);
      const br = toScreen((g.bounds.x || 0) + g.bounds.w, (g.bounds.y || 0) + g.bounds.h);
      ctx.fillStyle = "#cfd8e3";
      ctx.fillRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
    }

    // 밀어내기: 원형 경기장
    if (g.arena) {
      const arena = g.arena;
      const s = toScreen(arena.x, arena.y);
      ctx.beginPath();
      ctx.arc(s.x, s.y, arena.radius * s.scale, 0, Math.PI * 2);
      ctx.fillStyle = "#b9c2cc";
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#4da6ff";
      ctx.stroke();
      ctx.save();
      ctx.beginPath();
      ctx.arc(s.x, s.y, arena.radius * s.scale, 0, Math.PI * 2);
      ctx.rect(0, 0, canvas.width, canvas.height);
      ctx.clip("evenodd");
      ctx.fillStyle = "rgba(224,83,61,0.10)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    // 레이스: 벽, 결승선
    if (g.walls) {
      g.walls.forEach((w) => drawWorldRect(w, "#2b2d33", 4));
    }
    if (g.finishX != null && g.bounds) {
      const top = toScreen(g.finishX, g.bounds.y || 0);
      const bot = toScreen(g.finishX, (g.bounds.y || 0) + g.bounds.h);
      ctx.save();
      ctx.strokeStyle = "#4caf6d";
      ctx.lineWidth = 8;
      ctx.setLineDash([14, 10]);
      ctx.beginPath();
      ctx.moveTo(top.x, top.y);
      ctx.lineTo(bot.x, bot.y);
      ctx.stroke();
      ctx.restore();
    }

    // 영역 점령: 원형 구역
    if (g.zones) {
      g.zones.forEach((z) => {
        const s = toScreen(z.x, z.y);
        const owner = z.ownerId && (state.players || []).find((p) => p.id === z.ownerId);
        ctx.beginPath();
        ctx.arc(s.x, s.y, z.r * s.scale, 0, Math.PI * 2);
        ctx.fillStyle = owner ? owner.colorHex + "55" : "rgba(43,45,51,0.08)";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = owner ? owner.colorHex : "rgba(43,45,51,0.35)";
        ctx.stroke();
      });
    }

    // 색깔 밟기: 발판
    if (g.pads) {
      g.pads.forEach((pad) => {
        const s = toScreen(pad.x, pad.y);
        ctx.beginPath();
        ctx.arc(s.x, s.y, pad.r * s.scale, 0, Math.PI * 2);
        ctx.fillStyle = pad.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#2b2d33";
        ctx.stroke();
      });
    }

    // 보물 쟁탈: 보물
    if (g.treasures) {
      g.treasures.forEach((tr) => {
        const s = toScreen(tr.x, tr.y);
        const bob = Math.sin(performance.now() / 200 + tr.x) * 3 * s.scale;
        ctx.beginPath();
        ctx.arc(s.x, s.y + bob, tr.r * s.scale, 0, Math.PI * 2);
        ctx.fillStyle = tr.hex;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#2b2d33";
        ctx.stroke();
      });
    }

    // 꼬리잡기 / 폭탄넘기기: 보유자 표시
    const holderId = g.holderId;
    const isTail = g.gameId === "tail_tag";
    const isBomb = g.gameId === "bomb_pass";

    (state.players || []).forEach((p) => {
      const extra = g.playerExtra && g.playerExtra[p.id];
      let label = extra && extra.text;
      drawPlayer(p, label);
      if (holderId === p.id && (isTail || isBomb)) {
        const s = toScreen(p.x, p.y);
        const r = 22 * s.scale;
        ctx.font = `${Math.max(14, 22 * s.scale)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText(isBomb ? "💣" : "🎀", s.x, s.y - r - 22 * s.scale);
      }
      if (extra && extra.biting) {
        const s = toScreen(p.x, p.y);
        const r = 22 * s.scale;
        ctx.font = `${Math.max(16, 26 * s.scale)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffd23f";
        ctx.fillText("!", s.x, s.y - r - 24 * s.scale);
      }
    });

    // 상단 프롬프트 배너 (목표색/신호 등)
    if (g.prompt) {
      ctx.save();
      ctx.font = "bold 26px sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "#2b2d33";
      const textW = ctx.measureText(g.prompt).width;
      roundRect(canvas.width / 2 - textW / 2 - 24, 78, textW + 48, 44, 14);
      ctx.fill();
      ctx.fillStyle = g.gameId === "reaction" && g.phase === "signal" ? "#8fe0a8" : "#ffd23f";
      ctx.fillText(g.prompt, canvas.width / 2, 108);
      ctx.restore();
    }
  }


  function drawEffects() {
    effects.forEach((e) => {
      const prog = e.t / e.life;
      const s = toScreen(e.x, e.y);
      ctx.save();
      ctx.globalAlpha = 1 - prog;
      if (e.type === "attack") {
        ctx.strokeStyle = "#ff8c42";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(s.x, s.y, (30 + prog * 50) * s.scale, 0, Math.PI * 2);
        ctx.stroke();
      } else if (e.type === "hit") {
        ctx.fillStyle = "#e0533d";
        ctx.font = `${28 * s.scale + 10}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText("💥", s.x, s.y - prog * 30);
      } else if (e.type === "key") {
        ctx.fillStyle = "#ffd23f";
        ctx.font = `${20 * s.scale + 10}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText("✨", s.x, s.y - prog * 40);
      } else if (e.type === "eliminated") {
        ctx.fillStyle = "#e0533d";
        ctx.font = `${24 * s.scale + 10}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText("퐁당!", s.x, s.y - prog * 30);
      }
      ctx.restore();
    });
  }

  function render(state, dt) {
    updateEffects(dt);
    if (!state) return;
    const camPoints = (state.players || []).map((p) => ({ x: p.x, y: p.y }));
    let bounds = null;
    if (state.mode === "coop") {
      bounds = state.bounds;
    } else if (state.game) {
      if (state.game.bounds) {
        bounds = { width: state.game.bounds.w + (state.game.bounds.x || 0) * 2, height: state.game.bounds.h + (state.game.bounds.y || 0) * 2 };
      } else if (state.game.arena) {
        const a = state.game.arena;
        bounds = { width: (a.x + a.radius) * 2, height: (a.y + a.radius) * 2 };
      } else {
        bounds = { width: 1400, height: 840 };
      }
    }
    if (camPoints.length === 0) camPoints.push({ x: 700, y: 400 });
    Camera.update(camPoints, bounds);

    if (state.mode === "coop") drawCoop(state);
    else drawCompetition(state);

    drawEffects();
  }

  return { init, render, addEffect, resize };
})();


// client/js/sound.js
// 외부 저작권 리소스를 쓰지 않고 Web Audio API로 합성한 짧은 효과음.
const Sound = (() => {
  let ctx = null;
  function ensureCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function beep({ freq = 440, duration = 0.1, type = "sine", gain = 0.15, slideTo = null }) {
    try {
      const c = ensureCtx();
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, c.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + duration);
      g.gain.setValueAtTime(gain, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      osc.connect(g).connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + duration);
    } catch (e) {
      /* 오디오 미지원 환경 무시 */
    }
  }

  const PRESETS = {
    button: () => beep({ freq: 520, duration: 0.08, type: "triangle" }),
    countdown: () => beep({ freq: 300, duration: 0.15, type: "square" }),
    start: () => beep({ freq: 300, duration: 0.3, type: "square", slideTo: 700 }),
    attack: () => beep({ freq: 200, duration: 0.12, type: "sawtooth" }),
    hit: () => beep({ freq: 120, duration: 0.15, type: "square" }),
    key: () => beep({ freq: 700, duration: 0.2, type: "triangle", slideTo: 1100 }),
    door: () => beep({ freq: 220, duration: 0.25, type: "sine", slideTo: 340 }),
    eliminated: () => beep({ freq: 400, duration: 0.3, type: "sawtooth", slideTo: 90 }),
    clear: () => beep({ freq: 500, duration: 0.4, type: "triangle", slideTo: 900 }),
    failed: () => beep({ freq: 300, duration: 0.4, type: "sawtooth", slideTo: 80 }),
    score: () => beep({ freq: 650, duration: 0.12, type: "triangle" }),
    victory: () => beep({ freq: 600, duration: 0.5, type: "triangle", slideTo: 1000 }),
  };

  function play(name) {
    if (PRESETS[name]) PRESETS[name]();
  }

  return { play };
})();


// client/js/ui.js
const UI = (() => {
  const screens = {
    title: document.getElementById("screen-title"),
    lobby: document.getElementById("screen-lobby"),
    game: document.getElementById("screen-game"),
  };

  function showScreen(name) {
    Object.values(screens).forEach((s) => s.classList.remove("active"));
    screens[name].classList.add("active");
  }

  function setTitleError(msg) {
    document.getElementById("title-error").textContent = msg || "";
  }
  function setConnStatus(msg) {
    document.getElementById("conn-status").textContent = msg || "";
  }
  function setLobbyError(msg) {
    document.getElementById("lobby-error").textContent = msg || "";
  }

  function renderLobby(roomState, myId) {
    document.getElementById("lobby-room-code").textContent = roomState.code;

    const list = document.getElementById("player-list");
    list.innerHTML = "";
    for (let i = 0; i < MAX_PLAYERS; i++) {
      const p = roomState.players[i];
      const card = document.createElement("div");
      if (!p) {
        card.className = "player-card empty";
        card.textContent = "빈 자리";
        list.appendChild(card);
        continue;
      }
      card.className = "player-card" + (p.ready || p.isHost ? " pready" : "");
      card.innerHTML = `
        <div class="dot" style="background:${p.colorHex}"></div>
        <div class="pname">${escapeHtml(p.name)}${p.id === myId ? " (나)" : ""}</div>
        ${p.isHost ? '<div class="tag">방장</div>' : p.ready ? '<div class="tag">준비</div>' : ""}
      `;
      list.appendChild(card);
    }

    document.getElementById("mode-coop").classList.toggle("active", roomState.mode === "coop");
    document
      .getElementById("mode-competition")
      .classList.toggle("active", roomState.mode === "competition");

    document
      .getElementById("rounds-select")
      .classList.toggle("hidden", roomState.mode !== "competition");
    document.querySelectorAll(".round-btn").forEach((btn) => {
      btn.classList.toggle("active", parseInt(btn.dataset.rounds, 10) === roomState.rounds);
    });

    const isHost = roomState.hostId === myId;
    const me = roomState.players.find((p) => p.id === myId);
    document.getElementById("btn-ready").classList.toggle("hidden", isHost);
    document.getElementById("btn-start").classList.toggle("hidden", !isHost);
    document.getElementById("btn-ready").textContent = me && me.ready ? "준비 취소" : "준비 완료";

    const startBtn = document.getElementById("btn-start");
    const allReady = roomState.players.every((p) => p.ready || p.isHost);
    const enoughPlayers = roomState.players.length >= MIN_PLAYERS;
    startBtn.disabled = !enoughPlayers || (roomState.mode === "coop" && !allReady);

    // 모드 버튼은 방장만 조작 가능
    document.getElementById("mode-coop").disabled = !isHost;
    document.getElementById("mode-competition").disabled = !isHost;
    document.querySelectorAll(".round-btn").forEach((b) => (b.disabled = !isHost));
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function showOverlay(id) {
    document.getElementById(id).classList.remove("hidden");
  }
  function hideOverlay(id) {
    document.getElementById(id).classList.add("hidden");
  }
  function hideAllOverlays() {
    [
      "overlay-countdown",
      "overlay-stageintro",
      "overlay-clear",
      "overlay-failed",
      "overlay-roundresult",
      "overlay-finalresult",
    ].forEach(hideOverlay);
  }

  function renderScoreChips(players, scores) {
    const el = document.getElementById("hud-scores");
    if (!scores) {
      el.innerHTML = "";
      return;
    }
    el.innerHTML = players
      .map(
        (p) => `<div class="hud-score-chip"><div class="dot" style="background:${p.colorHex}"></div>${escapeHtml(
          p.name
        )}: ${scores[p.id] || 0}</div>`
      )
      .join("");
  }

  function renderResultRows(container, rows) {
    container.innerHTML = rows
      .map(
        (r, i) => `<div class="result-row">
          <div class="rank">${i + 1}</div>
          <div class="dot" style="background:${r.colorHex}"></div>
          <div class="rname">${escapeHtml(r.name)}</div>
          <div class="rpoints">${r.pointsText}</div>
        </div>`
      )
      .join("");
  }

  return {
    showScreen,
    setTitleError,
    setConnStatus,
    setLobbyError,
    renderLobby,
    showOverlay,
    hideOverlay,
    hideAllOverlays,
    renderScoreChips,
    renderResultRows,
  };
})();


// client/js/app.js
(function () {
  let myId = null;
  let roomState = null;
  let gameState = null;
  let prevGameSubState = null;
  let selectedMode = "coop";
  let selectedRounds = 5;

  const canvas = document.getElementById("game-canvas");
  Render.init(canvas);

  // ---------------- 연결 ----------------
  Net.on("_connected", () => UI.setConnStatus(""));
  Net.on("_disconnected", () => UI.setConnStatus("서버와 연결이 끊어졌습니다. 재연결 시도 중..."));
  Net.connect();

  // ---------------- 타이틀 화면 ----------------
  const nameInput = document.getElementById("input-name");
  const codeInput = document.getElementById("input-room-code");

  function getName() {
    return (nameInput.value || "").trim() || "플레이어";
  }

  document.getElementById("btn-create-room").addEventListener("click", () => {
    Sound.play("button");
    if (!Net.isConnected()) {
      UI.setTitleError("서버와 연결되지 않았습니다.");
      return;
    }
    UI.setTitleError("");
    Net.send(MSG.CREATE_ROOM, { name: getName() });
  });

  document.getElementById("btn-join-room").addEventListener("click", () => {
    Sound.play("button");
    const code = codeInput.value.trim().toUpperCase();
    if (!code) {
      UI.setTitleError("방 코드를 입력하세요.");
      return;
    }
    UI.setTitleError("");
    Net.send(MSG.JOIN_ROOM, { code, name: getName() });
  });

  Net.on(MSG.ROOM_ERROR, (payload) => {
    UI.setTitleError(payload.message);
    UI.setLobbyError(payload.message);
  });

  // ---------------- 로비 ----------------
  Net.on(MSG.ROOM_STATE, (payload) => {
    if (payload.joined) {
      myId = payload.playerId;
      UI.showScreen("lobby");
      return;
    }
    roomState = payload;
    selectedMode = payload.mode;
    selectedRounds = payload.rounds;
    if (payload.phase === "lobby") {
      UI.showScreen("lobby");
      UI.renderLobby(roomState, myId);
    } else if (payload.phase === "in_game") {
      UI.showScreen("game");
      Input.setEnabled(true);
      prevGameSubState = null;
    }
  });

  document.getElementById("mode-coop").addEventListener("click", () => {
    Sound.play("button");
    Net.send(MSG.SET_MODE, { mode: "coop" });
  });
  document.getElementById("mode-competition").addEventListener("click", () => {
    Sound.play("button");
    Net.send(MSG.SET_MODE, { mode: "competition" });
  });
  document.querySelectorAll(".round-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      Sound.play("button");
      Net.send(MSG.SET_ROUNDS, { rounds: parseInt(btn.dataset.rounds, 10) });
    });
  });
  document.getElementById("btn-ready").addEventListener("click", () => {
    Sound.play("button");
    const me = roomState.players.find((p) => p.id === myId);
    Net.send(MSG.SET_READY, { ready: !(me && me.ready) });
  });
  document.getElementById("btn-start").addEventListener("click", () => {
    Sound.play("button");
    Net.send(MSG.START_GAME, {});
  });
  document.getElementById("btn-leave-room").addEventListener("click", () => {
    Net.send(MSG.LEAVE_ROOM, {});
    location.reload();
  });
  document.getElementById("btn-back-to-lobby").addEventListener("click", () => {
    Sound.play("button");
    Net.send(MSG.RETURN_TO_LOBBY, {});
  });
  document.getElementById("btn-retry").addEventListener("click", () => {
    Sound.play("button");
    Net.send(MSG.RETRY_STAGE, {});
  });

  // ---------------- 게임 상태 ----------------
  Net.on(MSG.GAME_STATE, (payload) => {
    gameState = payload;
    handleStateTransition(payload);
    updateHud(payload);
  });

  Net.on(MSG.GAME_EVENT, (payload) => {
    handleGameEvent(payload.event, payload.data);
  });

  function handleGameEvent(event, data) {
    switch (event) {
      case "attack":
        Render.addEffect({ type: "attack", x: data.x, y: data.y, life: 0.25 });
        Sound.play("attack");
        break;
      case "hit": {
        const p = (gameState.players || []).find((pl) => pl.id === data.target);
        if (p) Render.addEffect({ type: "hit", x: p.x, y: p.y, life: 0.35 });
        Sound.play("hit");
        break;
      }
      case "eliminated": {
        const p = (gameState.players || []).find((pl) => pl.id === data.id);
        if (p) Render.addEffect({ type: "eliminated", x: p.x, y: p.y, life: 0.6 });
        Sound.play("eliminated");
        break;
      }
      case "key_collected": {
        const key = (gameState.keys || []).find((k) => k.id === data.keyId);
        if (key) Render.addEffect({ type: "key", x: key.x, y: key.y, life: 0.5 });
        Sound.play("key");
        break;
      }
      case "stage_clear":
        Sound.play("clear");
        break;
      case "stage_failed":
        Sound.play("failed");
        break;
      case "room_notice":
        UI.setLobbyError(data.message);
        break;
      default:
        break;
    }
  }

  function handleStateTransition(state) {
    if (state.state === prevGameSubState) return;
    const prev = prevGameSubState;
    prevGameSubState = state.state;
    UI.hideAllOverlays();

    if (state.mode === "coop") {
      switch (state.state) {
        case "stage_intro":
          document.getElementById("stageintro-title").textContent = `STAGE ${state.stageIndex + 1} - ${state.stageName}`;
          document.getElementById("stageintro-sub").textContent = `열쇠 ${state.totalKeys}개를 모아 문을 열고 전원 골인하라!`;
          UI.showOverlay("overlay-stageintro");
          break;
        case "countdown":
          UI.showOverlay("overlay-countdown");
          Sound.play("countdown");
          break;
        case "playing":
          if (prev === "countdown") Sound.play("start");
          break;
        case "clear":
          UI.showOverlay("overlay-clear");
          break;
        case "failed":
          document.getElementById("failed-reason").textContent = state.failReason || "";
          UI.showOverlay("overlay-failed");
          break;
        case "result":
          break;
      }
    } else {
      switch (state.state) {
        case "game_intro":
          document.getElementById("stageintro-title").textContent = `ROUND ${state.round} - ${state.gameName}`;
          document.getElementById("stageintro-sub").textContent =
            `${state.gameDescription} (핵심: ${state.coreTraits.join(" + ")})`;
          UI.showOverlay("overlay-stageintro");
          break;
        case "countdown":
          UI.showOverlay("overlay-countdown");
          Sound.play("countdown");
          break;
        case "playing":
          if (prev === "countdown") Sound.play("start");
          break;
        case "game_end":
          break;
        case "result": {
          const rows = buildRoundResultRows(state);
          UI.renderResultRows(document.getElementById("roundresult-body"), rows);
          UI.showOverlay("overlay-roundresult");
          Sound.play("score");
          break;
        }
        case "final_result": {
          const rows = buildFinalResultRows(state);
          UI.renderResultRows(document.getElementById("finalresult-body"), rows);
          UI.showOverlay("overlay-finalresult");
          Sound.play("victory");
          break;
        }
      }
    }
  }

  function buildRoundResultRows(state) {
    if (!state.lastRoundResult) return [];
    const { ranking, pointsGained } = state.lastRoundResult;
    return ranking.map((pid) => {
      const p = (state.players || []).find((pl) => pl.id === pid) || { name: "?", colorHex: "#fff" };
      return { name: p.name, colorHex: p.colorHex, pointsText: `+${pointsGained[pid]}점` };
    });
  }

  function buildFinalResultRows(state) {
    if (!state.finalRanking) return [];
    return state.finalRanking.map((r) => {
      const p = (state.players || []).find((pl) => pl.id === r.id) || { name: "?", colorHex: "#fff" };
      return { name: p.name, colorHex: p.colorHex, pointsText: `${r.score}점` };
    });
  }

  function updateHud(state) {
    const modeTitle = document.getElementById("hud-mode-title");
    const objective = document.getElementById("hud-objective");
    const timer = document.getElementById("hud-timer");

    if (state.mode === "coop") {
      modeTitle.textContent = `협동 · STAGE ${state.stageIndex + 1}/${state.totalStages}`;
      objective.textContent = `${state.stageName} — 열쇠 ${state.collectedKeys}/${state.totalKeys} 획득, 전원 골인하기`;
      timer.textContent = state.timeLeft != null ? `⏱ ${state.timeLeft}s` : "";
      UI.renderScoreChips(state.players, null);
    } else {
      modeTitle.textContent = `경쟁 · ROUND ${state.round}/${state.totalRounds}`;
      objective.textContent = `${state.gameName} (${(state.coreTraits || []).join(" + ")})`;
      timer.textContent = state.game && state.game.timeLeft != null ? `⏱ ${state.game.timeLeft}s` : "";
      UI.renderScoreChips(state.players, state.scores);
    }
  }

  // ---------------- 게임 루프 ----------------
  let lastFrame = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    if (gameState && document.getElementById("screen-game").classList.contains("active")) {
      Render.render(gameState, dt);
      Net.send(MSG.INPUT, Input.getState());
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

  </script>
</body>
</html>
