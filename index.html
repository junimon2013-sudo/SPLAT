<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SPLAT!</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #eef2f6;
  --panel-bg: #ffffff;
  --ink: #2b2d33;
  --line: #2b2d33;
  --accent: #ff8c42;
  --accent-2: #4da6ff;
  --text-main: #2b2d33;
  --text-dim: #6b6f76;
  --success: #4caf6d;
  --danger: #e0533d;
  --radius: 18px;
}

html, body {
  height: 100%;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text-main);
  overflow: hidden;
}

.screen {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.screen.active { display: flex; }

.panel {
  background: var(--panel-bg);
  border: 3px solid var(--line);
  border-radius: var(--radius);
  padding: 40px;
  box-shadow: 0 6px 0 var(--line);
}

/* ---------- TITLE ---------- */
.title-panel {
  width: min(420px, 90vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
  animation: pop-in .3s ease;
}
.game-logo {
  font-size: 44px;
  font-weight: 900;
  letter-spacing: -1px;
  color: var(--ink);
}
.game-logo span {
  color: var(--accent);
}
.subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 10px; }

.text-input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--bg);
  color: var(--text-main);
  font-size: 16px;
  outline: none;
}
.text-input:focus { border-color: var(--accent); }
.code-input { text-transform: uppercase; text-align: center; letter-spacing: 6px; font-weight: 700; }

.btn-row { width: 100%; }
.join-row { display: flex; gap: 8px; width: 100%; }
.join-row .code-input { flex: 1; min-width: 0; }
.join-row .btn { flex: 0 0 auto; white-space: nowrap; }

.btn {
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 13px 18px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .1s ease;
  color: var(--ink);
  box-shadow: 0 4px 0 var(--line);
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn-primary { background: var(--accent); width: 100%; color: #fff; }
.btn-secondary { background: var(--accent-2); flex: 1; white-space: nowrap; color: #fff; }
.btn-ghost { background: var(--bg); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.hidden { display: none !important; }

.error-text { color: var(--danger); font-size: 13px; min-height: 18px; font-weight: 600; }
.conn-status { color: var(--text-dim); font-size: 12px; }

@keyframes pop-in { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:none;} }

/* ---------- LOBBY ---------- */
.lobby-panel {
  width: min(560px, 92vw);
  display: flex;
  flex-direction: column;
  gap: 18px;
  animation: pop-in .3s ease;
}
.lobby-header { display: flex; justify-content: space-between; align-items: center; }
.room-code-label { font-size: 12px; color: var(--text-dim); }
.peer-status { font-size: 12px; margin-top: 4px; font-weight: 600; }
.peer-status.pending { color: var(--accent); }
.peer-status.ready { color: var(--success); }
.peer-status.error { color: var(--danger); }
.room-code { font-size: 32px; font-weight: 800; letter-spacing: 8px; color: var(--ink); }

.player-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.player-card {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: 12px;
  background: var(--bg); border: 2px solid var(--line);
}
.player-card .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--line); }
.player-card .pname { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-card .tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: var(--ink); color: #fff; }
.player-card.pready { border-color: var(--success); }
.player-card.empty { opacity: 0.4; justify-content: center; border-style: dashed; }

.mode-select { display: flex; gap: 10px; }

.appearance-panel { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; padding: 10px; background: var(--panel-bg2, #f7f8fa); border-radius: 12px; }
.appearance-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.appearance-label { font-size: 12px; font-weight: 700; color: var(--text-dim); width: 46px; flex-shrink: 0; }
.color-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.color-swatch {
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 3px solid transparent;
  box-sizing: border-box;
}
.color-swatch.selected { border-color: var(--ink); }
.color-swatch.taken { cursor: not-allowed; opacity: 0.3; }
.accessory-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
.accessory-btn {
  border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 4px 10px; font-size: 16px; cursor: pointer;
}
.accessory-btn.selected { border-color: var(--accent); background: rgba(255,140,66,0.12); }
#sword-skin-upload { font-size: 11px; max-width: 150px; }
.sword-skin-presets { display: flex; gap: 6px; flex-wrap: wrap; }
.sword-skin-preset-btn {
  width: 34px; height: 34px; border-radius: 8px; border: 2px solid var(--line); background: #fff;
  cursor: pointer; padding: 3px; display: flex; align-items: center; justify-content: center;
}
.sword-skin-preset-btn img { width: 100%; height: 100%; object-fit: contain; }
.sword-skin-preset-btn.selected { border-color: var(--accent); background: rgba(255,140,66,0.12); }
.btn.small { padding: 4px 10px; font-size: 11px; }

.mode-btn {
  flex: 1; padding: 12px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--bg); color: var(--text-dim); font-weight: 700; cursor: pointer;
}
.mode-btn.active { background: var(--accent); color: #fff; }

.rounds-select { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-dim); }
.rounds-options { display: flex; gap: 8px; }
.round-btn {
  padding: 8px 14px; border-radius: 10px; border: 2px solid var(--line);
  background: var(--bg); color: var(--text-main); cursor: pointer;
}
.round-btn.active { background: var(--accent-2); color: #fff; font-weight: 800; }

.lobby-footer { display: flex; gap: 10px; }
.lobby-footer .btn { flex: 1; }

/* ---------- GAME ---------- */
#screen-game { background: #dfe6ee; }
#game-canvas { display: block; width: 100vw; height: 100vh; background: #dfe6ee; }

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; flex-direction: column; gap: 6px;
  padding: 16px 22px; pointer-events: none; z-index: 5;
}
.hud-top { display: flex; align-items: center; gap: 14px; }
.hud-quit-btn {
  pointer-events: auto; background: var(--panel-bg); color: var(--ink); border: 2px solid var(--line);
  border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.hud-quit-btn:hover { filter: brightness(0.95); }
.hud-badge {
  background: var(--ink); color: #fff; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 13px;
}
.hud-objective { flex: 1; color: var(--ink); font-weight: 700; font-size: 14px; background: rgba(255,255,255,0.75); padding: 4px 10px; border-radius: 10px; display: inline-block; }
.hud-timer { background: var(--ink); color: #fff; padding: 6px 16px; border-radius: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hud-scores { display: flex; gap: 8px; flex-wrap: wrap; }
.hud-score-chip {
  display: flex; align-items: center; gap: 6px;
  background: #fff; border: 2px solid var(--line); padding: 4px 10px; border-radius: 14px; font-size: 12px; font-weight: 700;
}
.hud-score-chip .dot { width: 10px; height: 10px; border-radius: 50%; }
.hud-controls {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 12px;
  transition: opacity 1.2s ease;
  opacity: 1;
}
.hud-controls.faded { opacity: 0; pointer-events: none; }

.overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(43,45,51,0.45); z-index: 10; animation: fade-in .15s ease;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.overlay-card {
  background: #fff; border: 3px solid var(--line); border-radius: 20px;
  padding: 36px 48px; text-align: center; min-width: 280px;
  box-shadow: 0 6px 0 var(--line);
}
.overlay-title { font-size: 34px; font-weight: 900; letter-spacing: 2px; color: var(--ink); }
.overlay-sub { margin-top: 10px; color: var(--text-dim); }
.clear-card .overlay-title { color: var(--success); }
.failed-card .overlay-title { color: var(--danger); }
.failed-card .btn { margin-top: 18px; }

.loading-card { min-width: 320px; }
.loading-logo {
  font-size: 30px; font-weight: 900; letter-spacing: 1px; color: var(--ink); margin-bottom: 6px;
}
.loading-logo span { color: var(--accent); }
.loading-text {
  margin-top: 18px; font-size: 15px; font-weight: 700; color: var(--text-dim);
  display: flex; align-items: center; justify-content: center; gap: 2px;
}
#loading-dots { display: inline-block; width: 22px; text-align: left; }
.loading-tip {
  margin-top: 14px; font-size: 12px; color: var(--text-dim); background: var(--bg2, #f3f4f7);
  border-radius: 10px; padding: 8px 14px; line-height: 1.5;
}

.countdown-num {
  font-size: 140px; font-weight: 900; color: var(--accent);
  animation: countdown-pop .9s ease infinite;
}
@keyframes countdown-pop { 0% { transform: scale(1.3); opacity: 0;} 30% {transform: scale(1); opacity: 1;} 100% {opacity: 0.2;} }

.result-body { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 260px; }
.result-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--bg); border: 2px solid var(--line); border-radius: 12px;
}
.result-row .rank { font-weight: 900; width: 28px; color: var(--ink); }
.result-row .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); }
.result-row .rname { flex: 1; text-align: left; color: var(--ink); }
.result-row .rpoints { font-weight: 800; color: var(--accent-2); }

  </style>
</head>
<body>

<!-- ================= TITLE ================= -->
<section id="screen-title" class="screen active">
  <div class="panel title-panel">
    <h1 class="game-logo">SPLAT<span>!</span></h1>
    <p class="subtitle">2~4인 온라인 협동 &amp; 경쟁 파티게임</p>
    <input id="input-name" class="text-input" maxlength="12" placeholder="닉네임을 입력하세요" />
    <div class="btn-row">
      <button id="btn-create-room" class="btn btn-primary">방 만들기</button>
    </div>
    <div class="join-row">
      <input id="input-room-code" class="text-input code-input" maxlength="4" placeholder="방 코드" />
      <button id="btn-join-room" class="btn btn-secondary">참가하기</button>
    </div>
    <p id="title-error" class="error-text"></p>
    <p id="conn-status" class="conn-status"></p>
  </div>
</section>

<!-- ================= LOBBY ================= -->
<section id="screen-lobby" class="screen">
  <div class="panel lobby-panel">
    <div class="lobby-header">
      <div>
        <div class="room-code-label">방 코드</div>
        <div id="lobby-room-code" class="room-code">----</div>
        <div id="lobby-peer-status" class="peer-status"></div>
      </div>
      <button id="btn-leave-room" class="btn btn-ghost">나가기</button>
    </div>

    <div id="player-list" class="player-list"></div>

    <div class="appearance-panel">
      <div class="appearance-row">
        <span class="appearance-label">색상</span>
        <div id="color-swatches" class="color-swatches"></div>
      </div>
      <div class="appearance-row">
        <span class="appearance-label">장신구</span>
        <div id="accessory-buttons" class="accessory-buttons"></div>
      </div>
      <div class="appearance-row">
        <span class="appearance-label">칼 스킨</span>
        <div id="sword-skin-presets" class="sword-skin-presets"></div>
      </div>
      <div class="appearance-row">
        <span class="appearance-label"></span>
        <input type="file" id="sword-skin-upload" accept="image/*" />
        <button id="btn-remove-sword-skin" class="btn btn-ghost small hidden">기본으로</button>
      </div>
    </div>

    <div class="mode-select">
      <button id="mode-coop" class="mode-btn active" data-mode="coop">🧩 협동 모드</button>
      <button id="mode-competition" class="mode-btn" data-mode="competition">🏆 경쟁 모드</button>
    </div>

    <div id="rounds-select" class="rounds-select hidden">
      <span>라운드 수</span>
      <div class="rounds-options">
        <button class="round-btn" data-rounds="3">3</button>
        <button class="round-btn" data-rounds="5">5</button>
        <button class="round-btn" data-rounds="7">7</button>
        <button class="round-btn" data-rounds="10">10</button>
      </div>
    </div>

    <div class="lobby-footer">
      <button id="btn-ready" class="btn btn-secondary">준비 완료</button>
      <button id="btn-start" class="btn btn-primary hidden">게임 시작</button>
    </div>
    <p id="lobby-error" class="error-text"></p>
  </div>
</section>

<!-- ================= GAME ================= -->
<section id="screen-game" class="screen">
  <div class="hud">
    <div class="hud-top">
      <div id="hud-mode-title" class="hud-badge">협동</div>
      <div id="hud-objective" class="hud-objective"></div>
      <div id="hud-timer" class="hud-timer">--</div>
      <button id="btn-quit-to-lobby" class="hud-quit-btn" title="지금 스테이지를 그만두고 팀 전체가 로비로 돌아갑니다">로비로</button>
    </div>
    <div id="hud-scores" class="hud-scores"></div>
    <div id="hud-controls-hint" class="hud-controls">W A S D 이동 · SPACE 공격/액션 · SHIFT 대시</div>
  </div>

  <canvas id="game-canvas"></canvas>

  <div id="overlay-countdown" class="overlay hidden">
    <div id="overlay-countdown-num" class="countdown-num">3</div>
  </div>

  <div id="overlay-stageintro" class="overlay hidden">
    <div class="overlay-card loading-card">
      <div class="loading-logo">SPLAT<span>!</span></div>
      <div id="stageintro-title" class="overlay-title">STAGE 1</div>
      <div id="stageintro-sub" class="overlay-sub"></div>
      <div class="loading-text">로딩중<span id="loading-dots"></span></div>
      <div id="loading-tip" class="loading-tip"></div>
    </div>
  </div>

  <div id="overlay-clear" class="overlay hidden">
    <div class="overlay-card clear-card">
      <div class="overlay-title">CLEAR!</div>
    </div>
  </div>

  <div id="overlay-failed" class="overlay hidden">
    <div class="overlay-card failed-card">
      <div class="overlay-title">FAILED</div>
      <div id="failed-reason" class="overlay-sub"></div>
      <button id="btn-retry" class="btn btn-primary">다시 시도</button>
    </div>
  </div>

  <div id="overlay-roundresult" class="overlay hidden">
    <div class="overlay-card">
      <div class="overlay-title">라운드 결과</div>
      <div id="roundresult-body" class="result-body"></div>
    </div>
  </div>

  <div id="overlay-finalresult" class="overlay hidden">
    <div class="overlay-card">
      <div class="overlay-title">최종 순위</div>
      <div id="finalresult-body" class="result-body"></div>
      <button id="btn-back-to-lobby" class="btn btn-primary">로비로</button>
    </div>
  </div>
</section>

// ==== 협동/경쟁 게임 로직 (서버 코드를 브라우저에서 그대로 실행하도록 이식) ====
// ==== server/games/competition/utils.js ====
(function(){
// server/games/competition/utils.js

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function rand(min, max) {
  return min + Math.random() * (max - min);
}

function randInt(min, max) {
  return Math.floor(rand(min, max + 1));
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// 벽이 없는 열린 공간에서의 자유 이동 (World bounds 안으로 클램프)
function freeMove(pl, dt, bounds, speedOverride) {
  let mx = 0,
    my = 0;
  if (pl.input.up) my -= 1;
  if (pl.input.down) my += 1;
  if (pl.input.left) mx -= 1;
  if (pl.input.right) mx += 1;
  const len = Math.sqrt(mx * mx + my * my) || 1;
  mx /= len;
  my /= len;
  if (mx !== 0 || my !== 0) pl.facing = { x: mx, y: my };
  const speed = speedOverride || PHYSICS.MOVE_SPEED;
  pl.x += mx * speed * dt;
  pl.y += my * speed * dt;
  if (bounds) {
    pl.x = Math.max(bounds.x + pl.radius, Math.min(bounds.x + bounds.w - pl.radius, pl.x));
    pl.y = Math.max(bounds.y + pl.radius, Math.min(bounds.y + bounds.h - pl.radius, pl.y));
  }
}

// 순위 없는 점수 맵을 순위 배열(playerId 내림차순)로 변환
function rankFromScores(scoreMap, playerIds) {
  return [...playerIds].sort((a, b) => (scoreMap[b] || 0) - (scoreMap[a] || 0));
}

window.dist = dist;
window.rand = rand;
window.randInt = randInt;
window.pick = pick;
window.freeMove = freeMove;
window.rankFromScores = rankFromScores;
})();

(function(){
// server/games/coop/stages.js
// 협동 모드 스테이지 데이터. 기존 스테이지는 전부 삭제된 상태입니다 - SPLAT! 레벨 에디터로
// 새로 만든 스테이지를 이 배열에 붙여넣어 추가하세요. (server/games/coop/stages.js 참고)
// 깃허브 페이지 등에서 <script src="커스텀스테이지.js">로 불러온 커스텀 스테이지는 여기서
// 바로 합치지 않고, 실제로 게임을 시작하려는 시점(Room.canStart)에 합쳐진다 - 그래야 커스텀
// 스크립트 태그를 이 파일보다 뒤에 둬도 항상 정상적으로 인식된다.

const STAGES = [];

window.STAGES = STAGES;
})();

// index.html과 같은 폴더에 1stage.js, 2stage.js, 3stage.js ... 처럼 번호를 붙인 파일을
// 그냥 놔두기만 하면, 1번부터 순서대로 자동으로 찾아서 불러온다(파일이 없으면 거기서 멈춘다).
// index.html은 한 번도 다시 안 건드려도 되고, 새 스테이지를 추가할 땐 다음 번호 파일만 새로 올리면 된다.
// (파일:// 로 직접 열면 fetch가 막혀서 안 되고, http(s)로 서빙해야 동작한다 - 깃허브 페이지 등)
window.__customStagesScanPromise = (async function scanNumberedCustomStages() {
  let i = 1;
  const found = [];
  while (i <= 500) {
    let text = null;
    try {
      const res = await fetch(`./${i}stage.js`);
      if (!res.ok) break;
      text = await res.text();
    } catch (e) {
      break;
    }
    try {
      (0, eval)(text);
      found.push(i);
    } catch (e) {
      console.warn(`${i}stage.js 로딩 중 오류:`, e.message);
    }
    i++;
  }
  return found;
})();

  static description = "SPACE로 공격해서 상대를 경기장 밖으로 밀어내라! 마지막까지 살아남으면 승리.";

  constructor(room) {
    this.room = room;
    this.timeLeft = ROUND_TIME_LIMIT;
    this.eliminationOrder = []; // 탈락한 순서대로 push (마지막 탈락자가 더 순위 높음)
    this.finished = false;
    const players = room.getAlivePlayers();
    const n = players.length;
    players.forEach((pl, i) => {
      const angle = (i / n) * Math.PI * 2;
      pl.x = ARENA.x + Math.cos(angle) * (ARENA.radius * 0.55);
      pl.y = ARENA.y + Math.sin(angle) * (ARENA.radius * 0.55);
      pl.facing = { x: -Math.cos(angle), y: -Math.sin(angle) };
      pl.gameData.eliminated = false;
      pl.gameData.attackCooldown = 0;
      pl.gameData.knockX = 0;
      pl.gameData.knockY = 0;
      pl.status = "playing";
    });
  }

  update(dt) {
    if (this.finished) return true;
    this.timeLeft -= dt;
    const players = this.room.getAlivePlayers().filter((p) => !p.gameData.eliminated);

    players.forEach((pl) => {
      let mx = 0,
        my = 0;
      if (pl.input.up) my -= 1;
      if (pl.input.down) my += 1;
      if (pl.input.left) mx -= 1;
      if (pl.input.right) mx += 1;
      const len = Math.sqrt(mx * mx + my * my) || 1;
      mx /= len;
      my /= len;
      if (mx !== 0 || my !== 0) pl.facing = { x: mx, y: my };

      if (pl.gameData.attackCooldown > 0) pl.gameData.attackCooldown -= dt;

      // 넉백 감쇠 적용 이동
      const knock = Math.sqrt(pl.gameData.knockX ** 2 + pl.gameData.knockY ** 2);
      let nx, ny;
      if (knock > 5) {
        nx = pl.x + pl.gameData.knockX * dt;
        ny = pl.y + pl.gameData.knockY * dt;
        pl.gameData.knockX *= 0.86;
        pl.gameData.knockY *= 0.86;
      } else {
        nx = pl.x + mx * PHYSICS.MOVE_SPEED * dt;
        ny = pl.y + my * PHYSICS.MOVE_SPEED * dt;
      }
      pl.x = nx;
      pl.y = ny;

      // 공격 판정
      if (pl.actionPressed() && pl.gameData.attackCooldown <= 0) {
        pl.gameData.attackCooldown = ATTACK_COOLDOWN;
        this.room.broadcastEvent("attack", { by: pl.id, x: pl.x, y: pl.y, facing: pl.facing });
        players.forEach((other) => {
          if (other.id === pl.id) return;
          const dx = other.x - pl.x;
          const dy = other.y - pl.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > ATTACK_RANGE + other.radius) return;
          const pointBlank = dist < pl.radius + other.radius + 12; // 완전히 밀착한 경우 방향 무관하게 명중
          if (!pointBlank) {
            const toOther = Math.atan2(dy, dx);
            const facingAngle = Math.atan2(pl.facing.y, pl.facing.x);
            let diff = Math.abs(toOther - facingAngle);
            if (diff > Math.PI) diff = 2 * Math.PI - diff;
            if (diff > ATTACK_ARC / 2) return;
          }
          const nDist = dist || 1;
          const kdx = dist > 0.01 ? dx / nDist : pl.facing.x || 1;
          const kdy = dist > 0.01 ? dy / nDist : pl.facing.y || 0;
          other.gameData.knockX = kdx * KNOCKBACK_FORCE;
          other.gameData.knockY = kdy * KNOCKBACK_FORCE;
          this.room.broadcastEvent("hit", { by: pl.id, target: other.id });
        });
      }
    });

    // 탈락 판정 (경기장 밖)
    players.forEach((pl) => {
      const dx = pl.x - ARENA.x;
      const dy = pl.y - ARENA.y;
      if (Math.sqrt(dx * dx + dy * dy) > ARENA.radius + pl.radius * 0.3) {
        pl.gameData.eliminated = true;
        pl.status = "eliminated";
        this.eliminationOrder.push(pl.id);
        this.room.broadcastEvent("eliminated", { id: pl.id });
      }
    });

    players.forEach((pl) => pl.commitInputFrame());

    const remaining = this.room.getAlivePlayers().filter((p) => !p.gameData.eliminated);
    if (remaining.length <= 1 || this.timeLeft <= 0) {
      this.finished = true;
      // 남은 플레이어들도 탈락순서 리스트 뒤에 추가(동시 생존 = 동순위)
      remaining.forEach((pl) => {
        if (!this.eliminationOrder.includes(pl.id)) this.eliminationOrder.push(pl.id);
      });
      return true;
    }
    return false;
  }

  // 순위 계산: 마지막까지 남은 사람이 1등. eliminationOrder는 "탈락한 순"이므로 뒤집으면 순위.
  getRanking() {
    const order = [...this.eliminationOrder].reverse();
    return order; // [1등 playerId, 2등, ...]
  }

  getStateJSON() {
    return {
      gameId: PushOutGame.id,
      arena: ARENA,
      timeLeft: Math.max(0, Math.ceil(this.timeLeft)),
    };
  }
}

window.PushOutGame = PushOutGame;
})();

(function(){
// server/games/competition/TimingGame.js
// 핵심 요소: 반응속도 + 판단력

const MAX_DURATION = 9;

class TimingGame {
  static id = "timing";
  static displayName = "초 정확히 맞추기";
  static coreTraits = ["반응속도", "판단력"];
  static description = "목표 시간이 되는 정확한 순간에 SPACE를 눌러라! 오차가 작을수록 고득점.";

  constructor(room) {
    this.room = room;
    this.target = Math.round(rand(3, 7) * 100) / 100;
    this.t = 0;
    this.finished = false;
    this.results = {}; // playerId -> {error, pressed, pressTime}
    room.getAlivePlayers().forEach((pl) => {
      pl.status = "playing";
      this.results[pl.id] = { error: null, pressed: false, pressTime: null };
    });
  }

  update(dt) {
    if (this.finished) return true;
    this.t += dt;
    const players = this.room.getAlivePlayers();
    players.forEach((pl) => {
      const r = this.results[pl.id];
      if (!r.pressed && pl.actionPressed()) {
        r.pressed = true;
        r.pressTime = this.t;
        r.error = Math.abs(this.t - this.target);
        this.room.broadcastEvent("timing_press", { id: pl.id, error: r.error });
      }
      pl.commitInputFrame();
    });

    const allPressed = players.every((pl) => this.results[pl.id].pressed);
    if (allPressed || this.t >= MAX_DURATION) {
      this.finished = true;
      return true;
    }
    return false;
  }

  getRanking() {
    const players = this.room.getAlivePlayers();
    return players
      .map((pl) => pl.id)
      .sort((a, b) => {
        const ea = this.results[a].error == null ? Infinity : this.results[a].error;
        const eb = this.results[b].error == null ? Infinity : this.results[b].error;
        return ea - eb;
      });
  }

  getStateJSON() {
    return {
      gameId: TimingGame.id,
      target: this.target,
      elapsed: Math.round(this.t * 100) / 100,
      timeLeft: Math.max(0, Math.ceil(MAX_DURATION - this.t)),
      prompt: `목표: ${this.target.toFixed(2)}초`,
      playerExtra: Object.fromEntries(
        Object.entries(this.results).map(([id, r]) => [
          id,
          { text: r.pressed ? `오차 ${r.error.toFixed(2)}s` : "대기중" },
        ])
      ),
    };
  }
}

window.TimingGame = TimingGame;
})();

(function(){
// server/games/competition/TailTagGame.js
// 핵심 요소: 반응속도 + 눈치

const DURATION = 30;
const BOUNDS = { x: 60, y: 60, w: 1300, h: 700 };
const TAG_COOLDOWN = 0.8;

class TailTagGame {
  static id = "tail_tag";
  static displayName = "꼬리 잡기";
  static coreTraits = ["반응속도", "눈치"];
  static description = "꼬리를 가진 플레이어를 쫓아가 접촉해서 빼앗아라! 시간이 끝났을 때 꼬리 보유 시간이 길수록 고득점.";

  constructor(room) {
    this.room = room;
    this.t = 0;
    this.finished = false;
    const players = room.getAlivePlayers();
    this.holderId = players[0] ? players[0].id : null;
    this.holdTime = {};
    this.tagCooldown = 0;
    players.forEach((pl, i) => {
      pl.status = "playing";
      pl.x = BOUNDS.x + 100 + (i % 2) * 400;
      pl.y = BOUNDS.y + 100 + Math.floor(i / 2) * 300;
      this.holdTime[pl.id] = 0;
    });
    this.room.broadcastEvent("tail_assigned", { id: this.holderId });
  }

  update(dt) {
    if (this.finished) return true;
    this.t += dt;
    if (this.tagCooldown > 0) this.tagCooldown -= dt;
    const players = this.room.getAlivePlayers();

    players.forEach((pl) => freeMove(pl, dt, BOUNDS));

    if (this.holderId) this.holdTime[this.holderId] += dt;

    if (this.tagCooldown <= 0) {
      const holder = players.find((p) => p.id === this.holderId);
      if (holder) {
        for (const pl of players) {
          if (pl.id === holder.id) continue;
          if (dist(pl, holder) < pl.radius + holder.radius) {
            this.holderId = pl.id;
            this.tagCooldown = TAG_COOLDOWN;
            this.room.broadcastEvent("tail_assigned", { id: pl.id });
            break;
          }
        }
      }
    }

    if (this.t >= DURATION) {
      this.finished = true;
      return true;
    }
    return false;

  getRanking() {
    const players = this.room.getAlivePlayers();
    return players
      .map((pl) => pl.id)
      .sort((a, b) => (this.holdTime[b] || 0) - (this.holdTime[a] || 0));
  }

  getStateJSON() {
    return {
      gameId: TailTagGame.id,
      timeLeft: Math.max(0, Math.ceil(DURATION - this.t)),
      holderId: this.holderId,
      bounds: BOUNDS,
      prompt: "꼬리를 가진 사람을 쫓아라!",

  }

// ==== server/games/competition/RaceGame.js ====
(function(){
// server/games/competition/RaceGame.js
// 핵심 요소: 반응속도 + 판단력

const DURATION = 40;
const BOUNDS = { x: 0, y: 0, w: 1700, h: 800 };
const FINISH_X = 1620;

function circleRectCollide(cx, cy, cr, rect) {
  const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
  const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
  const dx = cx - closestX;
  const dy = cy - closestY;
  return dx * dx + dy * dy < cr * cr;
}
function resolveCircleRect(px, py, pr, rect) {
  const closestX = Math.max(rect.x, Math.min(px, rect.x + rect.w));
  const closestY = Math.max(rect.y, Math.min(py, rect.y + rect.h));
  let dx = px - closestX;
  let dy = py - closestY;
  let d = Math.sqrt(dx * dx + dy * dy);
  if (d === 0) return { x: px, y: py - pr };
  const push = pr - d;
  return { x: px + (dx / d) * push, y: py + (dy / d) * push };
}

// 지그재그 장애물 벽 (갈림길처럼 위/아래로 틈을 낸 벽들)
const WALLS = [
  { x: 300, y: 0, w: 40, h: 520 },
  { x: 300, y: 620, w: 40, h: 180 },
  { x: 650, y: 280, w: 40, h: 520 },
  { x: 1000, y: 0, w: 40, h: 500 },
  { x: 1350, y: 200, w: 40, h: 600 },
];
const CHECKPOINTS_X = [300, 650, 1000, 1350];

class RaceGame {
  static id = "race";
  static displayName = "레이스";
  static coreTraits = ["반응속도", "판단력"];
  static description = "장애물을 피해 결승선에 가장 먼저 도착하라! 갈림길에서 어디로 갈지 판단이 중요하다.";

  constructor(room) {
    this.room = room;
    this.t = 0;
    this.finished = false;
    this.finishOrder = [];
    this.finishTime = {};
    const players = room.getAlivePlayers();
    players.forEach((pl, i) => {
      pl.status = "playing";
      pl.x = 60;
      pl.y = 120 + i * 150;
    });
  }

  update(dt) {
    if (this.finished) return true;
    this.t += dt;
    const players = this.room.getAlivePlayers().filter((p) => !this.finishTime[p.id]);

    players.forEach((pl) => {
      freeMove(pl, dt, BOUNDS, 260);
      WALLS.forEach((w) => {
        if (circleRectCollide(pl.x, pl.y, pl.radius, w)) {
          const r = resolveCircleRect(pl.x, pl.y, pl.radius, w);
          pl.x = r.x;
          pl.y = r.y;
        }
      });
      if (pl.x >= FINISH_X && !this.finishTime[pl.id]) {
        this.finishTime[pl.id] = this.t;
        this.finishOrder.push(pl.id);
        this.room.broadcastEvent("race_finish", { id: pl.id, place: this.finishOrder.length });
      }
    });

    const allFinished = this.room.getAlivePlayers().every((p) => this.finishTime[p.id]);
    if (allFinished || this.t >= DURATION) {
      this.finished = true;
      return true;
    }
    return false;
  }

  getRanking() {
    const players = this.room.getAlivePlayers();
    const finished = [...this.finishOrder];
    const unfinished = players
      .map((p) => p.id)
      .filter((id) => !this.finishTime[id])
      .sort((a, b) => {
        const pa = players.find((p) => p.id === a);
        const pb = players.find((p) => p.id === b);
        return (pb ? pb.x : 0) - (pa ? pa.x : 0);
      });
    return [...finished, ...unfinished];
  }

  getStateJSON() {
    return {
      gameId: RaceGame.id,
      timeLeft: Math.max(0, Math.ceil(DURATION - this.t)),
      bounds: BOUNDS,
      walls: WALLS,
      finishX: FINISH_X,
      checkpoints: CHECKPOINTS_X,
      prompt: "결승선까지 먼저 도착하라!",
      playerExtra: Object.fromEntries(
        this.room.getAlivePlayers().map((p) => [
          p.id,
          { text: this.finishTime[p.id] != null ? `${this.finishOrder.indexOf(p.id) + 1}위 도착` : "" },
        ])
      ),
    };
  }
}

window.RaceGame = RaceGame;
})();

(function(){
// server/games/competition/BombPassGame.js
// 핵심 요소: 운 + 눈치

const BOUNDS = { x: 60, y: 60, w: 1300, h: 700 };
const PASS_COOLDOWN = 0.6;

class BombPassGame {
  static id = "bomb_pass";
  static displayName = "폭탄 넘기기";
  static coreTraits = ["운", "눈치"];
  static description = "폭탄을 다른 플레이어에게 넘겨라! 랜덤한 시간 뒤 터지며, 그때 들고 있으면 페널티.";

  constructor(room) {
    this.room = room;
    this.t = 0;
    this.fuse = rand(12, 20); // 언제 터질지 (운)
    this.finished = false;
    this.holdTime = {};
    this.exploded = false;
    this.loserId = null;
    const players = room.getAlivePlayers();
    players.forEach((pl, i) => {
      pl.status = "playing";
      pl.x = BOUNDS.x + 100 + (i % 2) * 400;
      pl.y = BOUNDS.y + 100 + Math.floor(i / 2) * 300;
      this.holdTime[pl.id] = 0;
    });
    this.holderId = players[0] ? players[0].id : null;
    this.passCooldown = 0;
    this.room.broadcastEvent("bomb_assigned", { id: this.holderId });
  }

  update(dt) {
    if (this.finished) return true;
    this.t += dt;
    if (this.passCooldown > 0) this.passCooldown -= dt;
    const players = this.room.getAlivePlayers();
    players.forEach((pl) => freeMove(pl, dt, BOUNDS));

    if (this.holderId) this.holdTime[this.holderId] += dt;

    if (this.passCooldown <= 0 && this.holderId) {
      const holder = players.find((p) => p.id === this.holderId);
      if (holder) {
        for (const pl of players) {
          if (pl.id === holder.id) continue;
          if (dist(pl, holder) < pl.radius + holder.radius) {
            this.holderId = pl.id;
            this.passCooldown = PASS_COOLDOWN;
            this.room.broadcastEvent("bomb_assigned", { id: pl.id });
            break;
          }
        }
      }
    }

    if (this.t >= this.fuse) {
      this.exploded = true;
      this.loserId = this.holderId;
      this.finished = true;
      this.room.broadcastEvent("bomb_explode", { id: this.loserId });
      return true;
    }
    return false;
  }

  getRanking() {
    const players = this.room.getAlivePlayers().map((p) => p.id);
    // 폭탄을 가지고 터진 사람이 꼴찌, 나머지는 폭탄을 적게 들고 있었을수록 상위
    const others = players
      .filter((id) => id !== this.loserId)
      .sort((a, b) => (this.holdTime[a] || 0) - (this.holdTime[b] || 0));
    return this.loserId ? [...others, this.loserId] : others;
  }

  getStateJSON() {
    return {
      gameId: BombPassGame.id,
      holderId: this.holderId,
      exploded: this.exploded,
      bounds: BOUNDS,
      prompt: "폭탄을 넘겨라! (터지는 시점은 아무도 모른다)",
      playerExtra: Object.fromEntries(
        this.room.getAlivePlayers().map((p) => [p.id, { bomb: p.id === this.holderId }])
      ),
    };
  }
}

window.BombPassGame = BombPassGame;
})();

(function(){
// server/games/competition/TerritoryGame.js
// 핵심 요소: 판단력 + 눈치

const DURATION = 30;
const BOUNDS = { x: 0, y: 0, w: 1400, h: 800 };
const ZONES = [
  { id: "z1", x: 250, y: 200, r: 90 },
  { id: "z2", x: 1150, y: 200, r: 90 },
  { id: "z3", x: 250, y: 600, r: 90 },
  { id: "z4", x: 1150, y: 600, r: 90 },
];

class TerritoryGame {
  static id = "territory";
  static displayName = "영역 점령";
  static coreTraits = ["판단력", "눈치"];
  static description = "영역 안에 혼자 머물러 점유도를 올려라! 상대가 들어오면 점유가 막힌다. 시간 종료 시 점유량이 가장 높은 사람이 승리.";

  constructor(room) {
    this.room = room;
    this.t = 0;
    this.finished = false;
    this.score = {};
    const players = room.getAlivePlayers();
    players.forEach((pl, i) => {
      pl.status = "playing";
      pl.x = BOUNDS.w / 2 + Math.cos((i / players.length) * Math.PI * 2) * 400;
      pl.y = BOUNDS.h / 2 + Math.sin((i / players.length) * Math.PI * 2) * 250;
      this.score[pl.id] = 0;
    });
    this.zoneOwner = {};
  }

  update(dt) {
    if (this.finished) return true;
    this.t += dt;
    const players = this.room.getAlivePlayers();
    players.forEach((pl) => freeMove(pl, dt, BOUNDS));

    ZONES.forEach((zone) => {
      const inside = players.filter((pl) => Math.hypot(pl.x - zone.x, pl.y - zone.y) < zone.r);
      if (inside.length === 1) {
        this.score[inside[0].id] = (this.score[inside[0].id] || 0) + dt * 10;
        this.zoneOwner[zone.id] = inside[0].id;
      } else if (inside.length === 0) {
        // 비어있으면 유지
      } else {
        this.zoneOwner[zone.id] = null; // 경합 중
      }
    });

    if (this.t >= DURATION) {
      this.finished = true;
      return true;
    }
    return false;
  }

  getRanking() {
    const players = this.room.getAlivePlayers().map((p) => p.id);
    return players.sort((a, b) => (this.score[b] || 0) - (this.score[a] || 0));
  }

  getStateJSON() {
    return {
      gameId: TerritoryGame.id,
      timeLeft: Math.max(0, Math.ceil(DURATION - this.t)),
      bounds: BOUNDS,
      zones: ZONES.map((z) => ({ ...z, ownerId: this.zoneOwner[z.id] || null })),
      prompt: "영역 안에 혼자 머물러 점령하라!",
      playerExtra: Object.fromEntries(
        Object.entries(this.score).map(([id, s]) => [id, { text: `${Math.round(s)}점` }])
      ),
    };
  }
}

window.TerritoryGame = TerritoryGame;
})();

const COLOR_HEX = { red: "#ff5c5c", blue: "#4d9dff", yellow: "#ffd23f", green: "#3fd97f" };

  { id: "p5", x: 700, y: 400 },
  { id: "p6", x: 700, y: 150 },
];
const PAD_RADIUS = 55;
const START_ROUND_TIME = 3.2;
const MIN_ROUND_TIME = 1.3;

class ColorStepGame {
  static id = "color_step";
  static displayName = "색깔 밟기";
  static coreTraits = ["반응속도", "눈치"];
  static description = "지정된 색깔 발판을 제한 시간 내에 밟아라! 라운드가 지날수록 점점 빨라진다.";

  constructor(room) {
    this.room = room;
    this.t = 0;
    this.finished = false;
    this.score = {};
    this.roundTime = START_ROUND_TIME;
    this.roundElapsed = 0;
    const players = room.getAlivePlayers();
    players.forEach((pl, i) => {
      pl.status = "playing";
      pl.x = BOUNDS.w / 2 + (i - players.length / 2) * 120;
      pl.y = BOUNDS.h - 100;
      this.score[pl.id] = 0;
      pl.gameData.scoredThisRound = false;
    });
    this._newTargetColor();
  }

  _newTargetColor() {
    this.padColors = {};
    PADS.forEach((p) => (this.padColors[p.id] = pick(COLORS)));
    this.targetColor = pick(COLORS);
    this.roundElapsed = 0;
    this.room.getAlivePlayers().forEach((pl) => (pl.gameData.scoredThisRound = false));
    this.roundTime = Math.max(MIN_ROUND_TIME, this.roundTime * 0.94);
  }

  update(dt) {
    if (this.finished) return true;
    this.t += dt;
    this.roundElapsed += dt;
    const players = this.room.getAlivePlayers();
    players.forEach((pl) => freeMove(pl, dt, BOUNDS));

    players.forEach((pl) => {
      if (pl.gameData.scoredThisRound) return;
      PADS.forEach((pad) => {
        if (pl.gameData.scoredThisRound) return;
        const d = Math.hypot(pl.x - pad.x, pl.y - pad.y);
        if (d < PAD_RADIUS) {
          pl.gameData.scoredThisRound = true;
          if (this.padColors[pad.id] === this.targetColor) {
            this.score[pl.id] = (this.score[pl.id] || 0) + 3;
            this.room.broadcastEvent("color_correct", { id: pl.id });
          } else {
            this.score[pl.id] = (this.score[pl.id] || 0) - 1;
            this.room.broadcastEvent("color_wrong", { id: pl.id });
          }
        }
      });
    });

    if (this.roundElapsed >= this.roundTime) {
      this._newTargetColor();
    }

    if (this.t >= DURATION) {
      this.finished = true;
      return true;
    }
    return false;
  }

  getRanking() {
    const players = this.room.getAlivePlayers().map((p) => p.id);
    return players.sort((a, b) => (this.score[b] || 0) - (this.score[a] || 0));
  }

  getStateJSON() {
    return {
      gameId: ColorStepGame.id,
      timeLeft: Math.max(0, Math.ceil(DURATION - this.t)),
      bounds: BOUNDS,
      pads: PADS.map((p) => ({ ...p, r: PAD_RADIUS, color: COLOR_HEX[this.padColors[p.id]] })),
      targetColorHex: COLOR_HEX[this.targetColor],
      targetColorName: this.targetColor,
      prompt: `목표 색: ${this.targetColor.toUpperCase()}`,
      playerExtra: Object.fromEntries(
        Object.entries(this.score).map(([id, s]) => [id, { text: `${s}점` }])
      ),
    };
  }
}

window.ColorStepGame = ColorStepGame;
})();

const BOUNDS = { x: 0, y: 0, w: 1400, h: 800 };

const TREASURE_TYPES = [

];

function weightedPick() {
  const total = TREASURE_TYPES.reduce((s, t) => s + t.weight, 0);
  let r = Math.random() * total;
  for (const t of TREASURE_TYPES) {
    if (r < t.weight) return t;
    r -= t.weight;
  }
  return TREASURE_TYPES[0];
}

class TreasureHuntGame {

  static displayName = "보물 쟁탈";

  constructor(room) {
    this.room = room;
    this.t = 0;
    this.finished = false;
    this.score = {};
    this.treasures = [];
    this.nextSpawn = rand(0.3, 1.2);
    const players = room.getAlivePlayers();

      pl.status = "playing";
      pl.x = 100 + i * 60;
      pl.y = BOUNDS.h / 2;

      y: randInt(80, BOUNDS.h - 80),

(function(){
// server/games/competition/ReactionGame.js
// 핵심 요소: 반응속도 + 눈치

const ROUNDS = 3;
const MIN_WAIT = 2;
const MAX_WAIT = 5;
const EARLY_PENALTY = 999;

class ReactionGame {
  static id = "reaction";
  static displayName = "반응속도";
  static coreTraits = ["반응속도", "눈치"];
  static description = "신호가 나타나면 최대한 빨리 SPACE! 신호 전에 누르면 페널티.";

  constructor(room) {
    this.room = room;
    this.finished = false;
    this.round = 0;
    this.totalMs = {};
    room.getAlivePlayers().forEach((pl) => {
      pl.status = "playing";
      this.totalMs[pl.id] = 0;
    });
    this._setupRound();
  }

  _setupRound() {
    this.phase = "waiting"; // waiting -> signal
    this.waitFor = rand(MIN_WAIT, MAX_WAIT);
    this.roundT = 0;
    this.signalT = null;
    this.pressed = {};
    this.room.getAlivePlayers().forEach((pl) => (this.pressed[pl.id] = false));
    this.room.broadcastEvent("reaction_round_start", { round: this.round + 1 });
  }

  update(dt) {
    if (this.finished) return true;
    this.roundT += dt;
    const players = this.room.getAlivePlayers();

    if (this.phase === "waiting" && this.roundT >= this.waitFor) {
      this.phase = "signal";
      this.signalT = this.roundT;
      this.room.broadcastEvent("reaction_signal", {});
    }

    players.forEach((pl) => {
      if (this.pressed[pl.id]) {
        pl.commitInputFrame();
        return;
      }
      if (pl.actionPressed()) {
        this.pressed[pl.id] = true;
        if (this.phase === "waiting") {
          this.totalMs[pl.id] += EARLY_PENALTY; // 성급하게 누름 페널티
          this.room.broadcastEvent("reaction_early", { id: pl.id });
        } else {
          const rt = Math.round((this.roundT - this.signalT) * 1000);
          this.totalMs[pl.id] += rt;
          this.room.broadcastEvent("reaction_result", { id: pl.id, ms: rt });
        }
      }
      pl.commitInputFrame();
    });

    const allPressed = players.every((pl) => this.pressed[pl.id]);
    const roundTimeout = this.phase === "signal" && this.roundT - this.signalT > 3;
    if (allPressed || roundTimeout) {
      players.forEach((pl) => {
        if (!this.pressed[pl.id]) this.totalMs[pl.id] += EARLY_PENALTY;
      });
      this.round++;
      if (this.round >= ROUNDS) {
        this.finished = true;
        return true;
      }
      this._setupRound();
    }
    return false;
  }

  getRanking() {
    const players = this.room.getAlivePlayers().map((p) => p.id);
    return players.sort((a, b) => (this.totalMs[a] || 0) - (this.totalMs[b] || 0));
  }

  getStateJSON() {
    return {
      gameId: ReactionGame.id,
      round: this.round + 1,
      totalRoundsInGame: ROUNDS,
      phase: this.phase,
      prompt: this.phase === "signal" ? "지금 눌러!!" : "신호를 기다리세요...",
      playerExtra: Object.fromEntries(
        Object.entries(this.totalMs).map(([id, ms]) => [id, { text: `누적 ${ms}ms` }])
      ),
    };
  }
}

window.ReactionGame = ReactionGame;
})();

  constructor(room) {
    this.room = room;
    this.t = 0;
    this.finished = false;
    this.score = {};
    this.spots = {}; // playerId -> {state, waitFor, t, fish}
    const players = room.getAlivePlayers();
    players.forEach((pl, i) => {
      pl.status = "playing";
      pl.x = 150 + i * 40;
      pl.y = 700;
      this.score[pl.id] = 0;
      this.spots[pl.id] = { state: "idle", waitFor: rand(1.5, 4), t: 0, fish: null };

        spot.state = "bite";
        spot.t = 0;
        spot.fish = weightedPick();
        this.room.broadcastEvent("fish_bite", { id: pl.id });
      } else if (spot.state === "bite") {

          spot.state = "idle";
          spot.t = 0;
          spot.waitFor = rand(1.5, 4);

(function(){
// server/games/competition/CompetitionManager.js











// 새 미니게임을 추가하려면 이 배열에 클래스만 추가하면 된다.
const GAME_POOL = [
  PushOutGame,
  TimingGame,
  TailTagGame,
  RaceGame,
  BombPassGame,
  TerritoryGame,
  ColorStepGame,
  TreasureHuntGame,
  ReactionGame,
  FishingGame,
];

const RANK_POINTS = [10, 7, 4, 2]; // 1위,2위,3위,4위

class CompetitionManager {
  constructor(room, totalRounds) {
    this.room = room;
    this.totalRounds = totalRounds || 3;
    this.round = 0;
    this.state = COMP_STATE.GAME_INTRO;
    this.timer = 0;
    this.scores = {}; // playerId -> 누적 점수
    room.players.forEach((pl) => (this.scores[pl.id] = 0));
    this.currentGame = null;
    this.lastRoundResult = null; // {ranking, pointsGained}
    this._pickGame();
  }

  _pickGame() {
    let GameClass;
    if (GAME_POOL.length === 1) {
      GameClass = GAME_POOL[0];
    } else {
      do {
        GameClass = GAME_POOL[Math.floor(Math.random() * GAME_POOL.length)];
      } while (this.GameClass && GameClass.id === this.GameClass.id);
    }
    this.GameClass = GameClass;
    this.state = COMP_STATE.GAME_INTRO;
    this.timer = 0;
  }

  onPlayerLeave(player) {
    // 점수 기록은 유지, 게임 중이면 해당 플레이어는 자연히 update에서 제외됨
  }

  update(dt) {
    this.timer += dt;
    switch (this.state) {
      case COMP_STATE.GAME_INTRO:
        if (this.timer >= 2.2) this._enter(COMP_STATE.COUNTDOWN);
        break;
      case COMP_STATE.COUNTDOWN:
        if (this.timer >= COUNTDOWN_SECONDS) {
          this.currentGame = new this.GameClass(this.room);
          this._enter(COMP_STATE.PLAYING);
        }
        break;
      case COMP_STATE.PLAYING: {
        const done = this.currentGame.update(dt);
        if (done) this._finishRound();
        break;
      }
      case COMP_STATE.GAME_END:
        if (this.timer >= 1.5) this._enter(COMP_STATE.RESULT);
        break;
      case COMP_STATE.RESULT:
        // room이 다음 라운드 진행을 트리거 (자동 진행)
        if (this.timer >= 3.5) this._advance();
        break;
      case COMP_STATE.FINAL_RESULT:
        break;
    }
  }

  _enter(state) {
    this.state = state;
    this.timer = 0;
  }

  _finishRound() {
    const ranking = this.currentGame.getRanking();
    const pointsGained = {};
    ranking.forEach((pid, idx) => {
      const pts = RANK_POINTS[idx] != null ? RANK_POINTS[idx] : 1;
      pointsGained[pid] = pts;
      this.scores[pid] = (this.scores[pid] || 0) + pts;
    });
    this.lastRoundResult = { ranking, pointsGained, gameName: this.GameClass.displayName };
    this._enter(COMP_STATE.GAME_END);
  }

  _advance() {
    this.round++;
    if (this.round >= this.totalRounds) {
      this._enter(COMP_STATE.FINAL_RESULT);
    } else {
      this._pickGame();
    }
  }

  getFinalRanking() {
    return Object.entries(this.scores)
      .sort((a, b) => b[1] - a[1])
      .map(([id, score]) => ({ id, score }));
  }

  getStateJSON() {
    return {
      mode: "competition",
      state: this.state,
      round: this.round + 1,
      totalRounds: this.totalRounds,
      gameId: this.GameClass.id,
      gameName: this.GameClass.displayName,
      gameDescription: this.GameClass.description,
      coreTraits: this.GameClass.coreTraits,
      countdown:
        this.state === COMP_STATE.COUNTDOWN
          ? Math.max(0, Math.ceil(COUNTDOWN_SECONDS - this.timer))
          : null,
      scores: this.scores,
      lastRoundResult: this.lastRoundResult,
      finalRanking: this.state === COMP_STATE.FINAL_RESULT ? this.getFinalRanking() : null,
      game: this.currentGame ? this.currentGame.getStateJSON() : null,
    };
  }
}

window.CompetitionManager = CompetitionManager;
window.GAME_POOL = GAME_POOL;
window.RANK_POINTS = RANK_POINTS;
})();

(function(){
// server/games/coop/CoopEngine.js
const PIT_GRACE_SECONDS = 0.4;
const SWORD_RANGE = 46;
const SWORD_SWING_DURATION = 0.22;
const SWORD_COOLDOWN = 0.32;

function circleRectCollide(cx, cy, cr, rect) {
  const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
  const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
  const dx = cx - closestX;
  const dy = cy - closestY;
  return dx * dx + dy * dy < cr * cr;
}

function resolveCircleRect(px, py, pr, rect) {
  const closestX = Math.max(rect.x, Math.min(px, rect.x + rect.w));
  const closestY = Math.max(rect.y, Math.min(py, rect.y + rect.h));
  let dx = px - closestX;
  let dy = py - closestY;
  let dist = Math.sqrt(dx * dx + dy * dy);
  if (dist === 0) {
    const overlaps = [
      { d: px - rect.x, ax: -1, ay: 0 },
      { d: rect.x + rect.w - px, ax: 1, ay: 0 },
      { d: py - rect.y, ax: 0, ay: -1 },
      { d: rect.y + rect.h - py, ax: 0, ay: 1 },
    ];
    overlaps.sort((a, b) => a.d - b.d);
    return { x: px + overlaps[0].ax * pr, y: py + overlaps[0].ay * pr };
  }
  const push = pr - dist;
  dx /= dist;
  dy /= dist;
  return { x: px + dx * push, y: py + dy * push };
}

// 회전(rotation, 도형 자체의 정적 각도)이 걸린 사각형과의 원 충돌 판정: 원의 중심을
// 사각형의 로컬(회전 안 된) 좌표계로 역회전시켜서 일반 축정렬 판정을 그대로 재사용한다.
function toLocalSpace(px, py, rect, rotationDeg) {
  if (!rotationDeg) return { x: px, y: py };
  const rad = (-rotationDeg * Math.PI) / 180;
  const cx = rect.x + rect.w / 2;
  const cy = rect.y + rect.h / 2;
  const dx = px - cx;
  const dy = py - cy;
  return {
    x: cx + dx * Math.cos(rad) - dy * Math.sin(rad),
    y: cy + dx * Math.sin(rad) + dy * Math.cos(rad),
  };
}
function fromLocalDelta(dx, dy, rotationDeg) {
  if (!rotationDeg) return { x: dx, y: dy };
  const rad = (rotationDeg * Math.PI) / 180;
  return { x: dx * Math.cos(rad) - dy * Math.sin(rad), y: dx * Math.sin(rad) + dy * Math.cos(rad) };
}
function circleRectCollideRotated(cx, cy, cr, rect, rotationDeg) {
  const local = toLocalSpace(cx, cy, rect, rotationDeg);
  return circleRectCollide(local.x, local.y, cr, rect);
}
function resolveCircleRectRotated(px, py, pr, rect, rotationDeg) {
  if (!rotationDeg) return resolveCircleRect(px, py, pr, rect);
  const local = toLocalSpace(px, py, rect, rotationDeg);
  const resolvedLocal = resolveCircleRect(local.x, local.y, pr, rect);
  const localDelta = { x: resolvedLocal.x - local.x, y: resolvedLocal.y - local.y };
  const worldDelta = fromLocalDelta(localDelta.x, localDelta.y, rotationDeg);
  return { x: px + worldDelta.x, y: py + worldDelta.y };
}

// ============================================================
// 범용 움직임(모든 블록 타입에 공통 적용: 왕복 직선 또는 회전운동)
// ============================================================
function initMovementState(def) {
  if (!def.movement) return { x: def.x, y: def.y };
  if (def.movement.type === "rotate") {
    return { angle: def.movement.startAngle || 0, x: def.x, y: def.y };
  }
  if (def.movement.type === "waypoints") {
    return { elapsed: 0, x: def.x, y: def.y };
  }
  return { t: 0, x: def.x, y: def.y };
}

// 다중 정거장(waypoints) 경로 계산 - 레벨 에디터의 검증된 계산식과 동일 (구간별 속도, 왕복/순환)
function waypointSegments(m) {
  const wps = m.waypoints || [];
  const loop = m.loopMode === "loop";
  const n = loop ? wps.length : Math.max(0, wps.length - 1);
  const segs = [];
  for (let i = 0; i < n; i++) {
    const a = wps[i];
    const b = wps[(i + 1) % wps.length];
    const dist = Math.hypot(b.x - a.x, b.y - a.y);
    const speed = Math.max(1, a.speed || 40);
    segs.push({ from: a, to: b, duration: dist / speed });
  }
  return { segs, loop };
}
function waypointPositionAt(m, tSeconds) {
  const wps = m.waypoints || [];
  if (wps.length === 0) return { x: 0, y: 0 };
  if (wps.length === 1) return { x: wps[0].x, y: wps[0].y };
  const { segs, loop } = waypointSegments(m);
  const forwardDuration = segs.reduce((s, seg) => s + seg.duration, 0);
  if (forwardDuration <= 0) return { x: wps[0].x, y: wps[0].y };

  let cyclePos;
  let segsToWalk;
  if (loop) {
    cyclePos = tSeconds % forwardDuration;
    segsToWalk = segs;
  } else {
    const cycleDuration = forwardDuration * 2;
    cyclePos = tSeconds % cycleDuration;
    if (cyclePos <= forwardDuration) {
      segsToWalk = segs;
    } else {
      cyclePos -= forwardDuration;
      segsToWalk = segs.slice().reverse().map((s) => ({ from: s.to, to: s.from, duration: s.duration }));
    }
  }
  let acc = 0;
  for (const seg of segsToWalk) {
    if (cyclePos <= acc + seg.duration) {
      const segT = seg.duration > 0 ? (cyclePos - acc) / seg.duration : 0;
      return { x: seg.from.x + (seg.to.x - seg.from.x) * segT, y: seg.from.y + (seg.to.y - seg.from.y) * segT };
    }
    acc += seg.duration;
  }
  const last = segsToWalk[segsToWalk.length - 1];
  return { x: last.to.x, y: last.to.y };
}

function stepMovement(def, state, dt) {
  if (!def.movement) return;
  const m = def.movement;
  if (m.type === "rotate") {
    const dir = m.clockwise === false ? -1 : 1;
    state.angle = (state.angle || 0) + dir * (m.speed || 30) * dt;
    const rad = (state.angle * Math.PI) / 180;
    const w = def.w || 0;
    const h = def.h || 0;
    state.x = m.centerX + Math.cos(rad) * (m.radius || 0) - w / 2;
    state.y = m.centerY + Math.sin(rad) * (m.radius || 0) - h / 2;
    return;
  }
  if (m.type === "waypoints") {
    state.elapsed = (state.elapsed || 0) + dt;
    const pos = waypointPositionAt(m, state.elapsed);
    state.x = pos.x;
    state.y = pos.y;
    return;
  }
  const range = Math.abs(m.to - m.from);
  if (range < 0.001) return;
  const dir = m.to >= m.from ? 1 : -1;
  state.t = (state.t || 0) + ((m.speed || 40) * dt) / Math.max(1, range);
  const phase = (Math.sin(state.t * Math.PI * 2 - Math.PI / 2) + 1) / 2;
  const pos = m.from + dir * range * phase;
  if (m.axis === "y") {
    state.x = def.x;
    state.y = pos;
  } else {
    state.x = pos;
    state.y = def.y;
  }
}

class CoopEngine {
  constructor(room) {
    this.room = room;
    this.stageIndex = 0;
    this.state = COOP_STATE.STAGE_INTRO;
    this.timer = 0;
    this.stageTimeLeft = 0;
    this.collectedKeys = 0;
    this.keys = [];
    this.plateGroupsOpen = {};
    this.doorsOpen = {};
    this.doorOpenedAt = {};
    this.eliminated = new Set();
    this._playingElapsed = 0;
    this._loadStage();
  }

  _loadStage() {
    const def = STAGES[this.stageIndex];
    this.def = def;
    this.state = COOP_STATE.STAGE_INTRO;
    this.timer = 0;
    this.stageTimeLeft = def.timeLimit;
    this.collectedKeys = 0;
    this.collectedKeyIds = new Set();
    this.keys = def.keys.map((k) => ({ ...k, collected: false }));
    this.plateGroupsOpen = {};
    this.doorsOpen = {};
    this.doorOpenedAt = {};
    this.doorConditionWasMet = {};
    this.eliminated = new Set();
    this._playingElapsed = 0;
    this.brokenDestructibles = new Set();
    this.destructibleHits = {};

    this.platformState = def.platforms.map((p) => initMovementState(p));
    this.wallState = (def.walls || []).map((w) => initMovementState(w));
    this.pitState = (def.pits || []).map((p) => initMovementState(p));
    this.killbrickState = (def.killbricks || []).map((k) => initMovementState(k));
    this.doorState = (def.doors || []).map((d) => initMovementState(d));
    this.destructibleState = (def.destructibles || []).map((d) => initMovementState(d));

    this._assignSpawns();
    this._broadcastStageAssets();
  }

  // 다중 스폰 + 인원수 흩뿌리기: spawns 배열(각 {x,y,count})을 앞에서부터 채우고,
  // count 합보다 인원이 많으면 남는 인원은 맵 안에서 무작위 위치에 흩뿌린다.
  // 구버전 스테이지(spawns 없이 단일 spawn:{x,y}만 있는 경우)는 기존 방식 그대로 동작한다.
  _assignSpawns() {
    const def = this.def;
    const players = this.room.getAlivePlayers();
    const bounds = def.bounds;

    const resetPlayer = (pl, x, y) => {
      pl.x = x;
      pl.y = y;
      pl.vx = 0;
      pl.vy = 0;
      pl.status = "playing";
      pl.gameData.finished = false;
      pl.gameData.pitGrace = 0;
      pl.gameData.toolActive = false;
      pl.gameData.swordSwing = 0;
      pl.gameData.swordCooldown = 0;
      pl.gameData.nearKeyId = null;
      pl.gameData.carriedKeyIds = [];
      pl.gameData.teleportCooldown = 0;
    };

    if (!def.spawns || !def.spawns.length) {
      const base = def.spawn || { x: 100, y: 100 };
      players.forEach((pl, i) => resetPlayer(pl, base.x + (i % 2) * 50, base.y + Math.floor(i / 2) * 50));
      return;
    }

    const slots = [];
    def.spawns.forEach((sp) => {
      for (let i = 0; i < (sp.count || 1); i++) slots.push({ x: sp.x, y: sp.y });
    });
    while (slots.length < players.length) {
      slots.push({
        x: PHYSICS.PLAYER_RADIUS + Math.random() * Math.max(1, bounds.width - PHYSICS.PLAYER_RADIUS * 2),
        y: PHYSICS.PLAYER_RADIUS + Math.random() * Math.max(1, bounds.height - PHYSICS.PLAYER_RADIUS * 2),
      });
    }
    players.forEach((pl, i) => {
      const slot = slots[i % slots.length];
      resetPlayer(pl, slot.x, slot.y);
    });
  }

  onPlayerLeave(player) {
    this.eliminated.delete(player.id);
  }

  // 이미지가 붙은 오브젝트가 있으면, 매 틱 재전송하지 않고 스테이지 로드 시 딱 한 번만 보낸다
  // (base64 이미지를 30Hz 게임 상태에 매번 실어보내면 대역폭이 감당 안 된다).
  _broadcastStageAssets() {
    const def = this.def;
    const assets = {};
    (def.walls || []).forEach((w, i) => { if (w.image) assets["wall:" + i] = w.image; });
    (def.pits || []).forEach((p, i) => { if (p.image) assets["pit:" + i] = p.image; });
    (def.killbricks || []).forEach((k) => { if (k.image) assets["killbrick:" + k.id] = k.image; });
    (def.doors || []).forEach((d) => { if (d.image) assets["door:" + d.id] = d.image; });
    (def.platforms || []).forEach((p) => { if (p.image) assets["platform:" + p.id] = p.image; });
    (def.destructibles || []).forEach((d) => { if (d.image) assets["destructible:" + d.id] = d.image; });
    (def.keys || []).forEach((k) => { if (k.image) assets["key:" + k.id] = k.image; });
    (def.plates || []).forEach((p) => { if (p.image) assets["plate:" + p.id] = p.image; });
    (def.teleporters || []).forEach((tp) => { if (tp.image) assets["teleporter:" + tp.id] = tp.image; });
    if (def.goal && def.goal.image) assets["goal"] = def.goal.image;
    this.room.broadcastEvent("stage_assets", assets);
  }

  _activePlateCount(group) {
    const groupPlates = this.def.plates.filter((p) => p.group === group);
    const aliveCount = this.room.getAlivePlayers().filter((p) => !this.eliminated.has(p.id)).length;
    return Math.max(1, Math.min(groupPlates.length, aliveCount));
  }

  // 방장이 게임을 시작하기 전에, 이 스테이지가 요구하는 인원수와 현재 방 인원이 맞는지 확인
  static checkPlayerCount(stageDef, playerCount) {
    if (!stageDef || !stageDef.playerCount) return true;
    return playerCount === stageDef.playerCount;
  }

  update(dt) {
    this.timer += dt;
    switch (this.state) {
      case COOP_STATE.STAGE_INTRO:
        if (this.timer >= 2.5) this._enter(COOP_STATE.COUNTDOWN);
        break;
      case COOP_STATE.COUNTDOWN:
        if (this.timer >= COUNTDOWN_SECONDS) this._enter(COOP_STATE.PLAYING);
        break;
      case COOP_STATE.PLAYING:
        this._updatePlaying(dt);
        break;
      case COOP_STATE.CLEAR:
      case COOP_STATE.FAILED:
        if (this.timer >= 2.5) {
          this._resultFrom = this.state;
          this._enter(COOP_STATE.RESULT);
        }
        break;
      case COOP_STATE.RESULT:
        if (this._resultFrom === COOP_STATE.CLEAR && this.timer >= 3) {
          if (this.stageIndex >= STAGES.length - 1) {
            this.room.returnToLobby();
          } else {
            this.nextStage();
          }
        }
        break;
    }
  }

  _enter(state) {
    this.state = state;
    this.timer = 0;
  }

  _updatePlaying(dt) {
    this.stageTimeLeft -= dt;
    if (this.stageTimeLeft <= 0) {
      this._fail("시간 초과");
      return;
    }
    this._playingElapsed += dt;

    this.def.platforms.forEach((p, i) => stepMovement(p, this.platformState[i], dt));
    (this.def.walls || []).forEach((w, i) => stepMovement(w, this.wallState[i], dt));
    (this.def.pits || []).forEach((p, i) => stepMovement(p, this.pitState[i], dt));
    (this.def.killbricks || []).forEach((k, i) => stepMovement(k, this.killbrickState[i], dt));
    (this.def.doors || []).forEach((d, i) => stepMovement(d, this.doorState[i], dt));
    (this.def.destructibles || []).forEach((d, i) => stepMovement(d, this.destructibleState[i], dt));

    const players = this.room.getAlivePlayers().filter((pl) => !this.eliminated.has(pl.id));

    // 압력판 판정
    const groups = {};
    this.def.plates.forEach((plate) => {
      groups[plate.group] = groups[plate.group] || [];
    });
    Object.keys(groups).forEach((group) => {
      const groupPlates = this.def.plates.filter((p) => p.group === group);
      let occupied = 0;
      const usedPlayers = new Set();
      groupPlates.forEach((plate) => {
        for (const pl of players) {
          if (usedPlayers.has(pl.id)) continue;
          const dx = pl.x - plate.x;
          const dy = pl.y - plate.y;
          if (Math.sqrt(dx * dx + dy * dy) < plate.r + pl.radius) {
            occupied++;
            usedPlayers.add(pl.id);
            break;
          }
        }
      });
      const needed = this._activePlateCount(group);
      this.plateGroupsOpen[group] = occupied >= needed;
    });

    // 문 개방/재폐쇄 판정 (openDuration > 0 이면 그 시간이 지나면 다시 닫힌다).
    // openDuration으로 닫힌 뒤에는, 조건이 "새로 다시 충족(엣지)"되어야만 재개방한다 - 조건이 계속
    // 참인 상태(예: 열쇠를 이미 다 모은 경우)로 매 틱 재평가하면 열리자마자 또 열려버려서 깜빡이게 된다.
    this.def.doors.forEach((door) => {
      const wasOpen = !!this.doorsOpen[door.id];
      let conditionMet = false;
      if (door.requiresKeyIds != null) {
        conditionMet = door.requiresKeyIds.every((kid) => this.collectedKeyIds.has(kid));
      } else if (door.requiresKeys != null) {
        conditionMet = this.collectedKeys >= door.requiresKeys;
      } else if (door.requiresPlateGroup) {
        conditionMet = !!this.plateGroupsOpen[door.requiresPlateGroup];
      }

      const prevConditionMet = !!this.doorConditionWasMet[door.id];
      const risingEdge = conditionMet && !prevConditionMet;
      this.doorConditionWasMet[door.id] = conditionMet;

      if (!wasOpen && risingEdge) {
        this.doorsOpen[door.id] = true;
        this.doorOpenedAt[door.id] = this._playingElapsed;
        this.room.broadcastEvent("door_open", { doorId: door.id });
      } else if (wasOpen && door.openDuration > 0) {
        const openedAt = this.doorOpenedAt[door.id] || 0;
        if (this._playingElapsed - openedAt >= door.openDuration) {
          this.doorsOpen[door.id] = false;
          this.room.broadcastEvent("door_close", { doorId: door.id });
        }
      }
    });

    players.forEach((pl) => {
      let mx = 0,
        my = 0;
      if (pl.input.up) my -= 1;
      if (pl.input.down) my += 1;
      if (pl.input.left) mx -= 1;
      if (pl.input.right) mx += 1;
      const len = Math.sqrt(mx * mx + my * my) || 1;
      mx /= len;
      my /= len;
      if (mx !== 0 || my !== 0) pl.facing = { x: mx, y: my };

      // 대시 (스테이지별 dashDistance 설정을 대시 지속시간은 고정, 속도만 환산해서 반영)
      if (pl.dashCooldown > 0) pl.dashCooldown -= dt;
      if (pl.dashPressed() && pl.dashCooldown <= 0 && (mx !== 0 || my !== 0)) {
        pl.dashTimer = PHYSICS.DASH_DURATION;
        pl.dashCooldown = PHYSICS.DASH_COOLDOWN;
      }
      const isDashingThisFrame = pl.dashTimer > 0; // 이번 프레임에 실제로 대시 중이었는지 - 감소시키기 전에 미리 기록
      let speed = PHYSICS.MOVE_SPEED;
      if (pl.dashTimer > 0) {
        const dashDistance = this.def.dashDistance != null ? this.def.dashDistance : PHYSICS.DASH_SPEED * PHYSICS.DASH_DURATION;
        speed = dashDistance / PHYSICS.DASH_DURATION;
        pl.dashTimer -= dt;
      }

      // SPACE = 칼 휘두르기 (이 스테이지에서 spaceToolEnabled가 켜져 있을 때만)
      if (pl.gameData.swordCooldown > 0) pl.gameData.swordCooldown -= dt;
      if (pl.gameData.swordSwing > 0) pl.gameData.swordSwing -= dt;
      if (this.def.spaceToolEnabled && pl.actionPressed() && pl.gameData.swordCooldown <= 0) {
        pl.gameData.swordSwing = SWORD_SWING_DURATION;
        pl.gameData.swordCooldown = SWORD_COOLDOWN;
        this._trySwordHit(pl);
      }

      let nx = pl.x + mx * speed * dt;
      let ny = pl.y + my * speed * dt;

      const solids = this.def.walls.map((w, i) => ({ rect: { x: this.wallState[i].x, y: this.wallState[i].y, w: w.w, h: w.h }, rotation: w.rotation }));
      this.def.doors.forEach((d, i) => {
        if (!this.doorsOpen[d.id]) solids.push({ rect: { x: this.doorState[i].x, y: this.doorState[i].y, w: d.w, h: d.h }, rotation: d.rotation });
      });
      (this.def.destructibles || []).forEach((d, i) => {
        if (!this.brokenDestructibles.has(d.id)) solids.push({ rect: { x: this.destructibleState[i].x, y: this.destructibleState[i].y, w: d.w, h: d.h }, rotation: d.rotation });
      });
      solids.forEach(({ rect, rotation }) => {
        if (circleRectCollideRotated(nx, ny, pl.radius, rect, rotation)) {
          const resolved = resolveCircleRectRotated(nx, ny, pl.radius, rect, rotation);
          nx = resolved.x;
          ny = resolved.y;
        }
      });

      pl.x = nx;
      pl.y = ny;

      let onPlatform = false;
      this.def.platforms.forEach((p, idx) => {
        const st = this.platformState[idx];
        const rect = { x: st.x, y: st.y, w: p.w, h: p.h };
        if (circleRectCollide(pl.x, pl.y, pl.radius * 1.15, rect)) onPlatform = true;
      });

      // 물웅덩이 낙사 판정 - 발판 위이거나 대시로 뛰어넘는 중일 때는 완전히 안전, 그 외엔 짧은 유예시간(코요테 타임) 적용
      const inPit = this.def.pits.some((pit, i) => {
        const st = this.pitState[i];
        return pl.x > st.x && pl.x < st.x + pit.w && pl.y > st.y && pl.y < st.y + pit.h;
      });
      if (onPlatform || isDashingThisFrame || !inPit) {
        pl.gameData.pitGrace = 0;
      } else {
        pl.gameData.pitGrace = (pl.gameData.pitGrace || 0) + dt;
        if (pl.gameData.pitGrace > PIT_GRACE_SECONDS) {
          this.eliminated.add(pl.id);
          pl.status = "eliminated";
        }
      }

      // 킬브릭: 유예시간 없이 닿는 즉시 탈락
      (this.def.killbricks || []).forEach((k, i) => {
        if (this.eliminated.has(pl.id)) return;
        const st = this.killbrickState[i];
        const rect = { x: st.x, y: st.y, w: k.w, h: k.h };
        if (circleRectCollideRotated(pl.x, pl.y, pl.radius * 0.7, rect, k.rotation)) {
          this.eliminated.add(pl.id);
          pl.status = "eliminated";
        }
      });

      // 열쇠 획득: 가까이 가면 E(interact)로 줍는다 (자동 획득 아님)
      pl.gameData.nearKeyId = null;
      let nearestDist = Infinity;
      this.keys.forEach((k) => {
        if (k.collected) return;
        const dx = pl.x - k.x;
        const dy = pl.y - k.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < k.r + pl.radius + 12 && d < nearestDist) {
          nearestDist = d;
          pl.gameData.nearKeyId = k.id;
        }
      });
      if (pl.interactPressed() && pl.gameData.nearKeyId) {
        const k = this.keys.find((kk) => kk.id === pl.gameData.nearKeyId && !kk.collected);
        if (k) {
          k.collected = true;
          k.carriedBy = pl.id;
          this.collectedKeys++;
          this.collectedKeyIds.add(k.id);
          pl.gameData.carriedKeyIds = pl.gameData.carriedKeyIds || [];
          pl.gameData.carriedKeyIds.push(k.id);
          pl.gameData.nearKeyId = null;
          this.room.broadcastEvent("key_collected", { keyId: k.id, by: pl.id });
        }
      }

      // 텔레포터: 짝지어진 곳으로 순간이동, 도착지에서 같은 틱에 바로 되돌아가지 않도록 쿨다운
      if (pl.gameData.teleportCooldown > 0) pl.gameData.teleportCooldown -= dt;
      if (!(pl.gameData.teleportCooldown > 0)) {
        for (const tp of this.def.teleporters || []) {
          if (!tp.linkedId) continue;
          const dx = pl.x - tp.x, dy = pl.y - tp.y;
          if (Math.sqrt(dx * dx + dy * dy) < tp.r + pl.radius) {
            const target = (this.def.teleporters || []).find((o) => o.id === tp.linkedId);
            if (target) {
              pl.x = target.x;
              pl.y = target.y;
              pl.gameData.teleportCooldown = 0.6;
              this.room.broadcastEvent("teleported", { playerId: pl.id, toId: target.id });
            }
            break;
          }
        }
      }
    });

    players.forEach((pl) => pl.commitInputFrame());

    if (this.eliminated.size > 0) {
      this._fail("동료가 탈락했습니다");
      return;
    }

    const alivePlayers = players.filter((pl) => !this.eliminated.has(pl.id));
    if (alivePlayers.length > 0) {
      const allIn = alivePlayers.every((pl) => {
        const g = this.def.goal;
        return pl.x > g.x && pl.x < g.x + g.w && pl.y > g.y && pl.y < g.y + g.h;
      });
      if (allIn) this._clear();
    }
  }

  // 칼 휘두르기 판정: 플레이어가 바라보는 방향 앞쪽의 파괴 가능 블럭을 확인한다
  _trySwordHit(pl) {
    const swordRange = this.def.swordRange != null ? this.def.swordRange : SWORD_RANGE;
    const hitX = pl.x + pl.facing.x * (pl.radius + swordRange / 2);
    const hitY = pl.y + pl.facing.y * (pl.radius + swordRange / 2);
    (this.def.destructibles || []).forEach((d, i) => {
      if (this.brokenDestructibles.has(d.id)) return;
      const st = this.destructibleState[i];
      const rect = { x: st.x, y: st.y, w: d.w, h: d.h };
      if (!circleRectCollideRotated(hitX, hitY, swordRange / 2, rect, d.rotation)) return;
      this.destructibleHits[d.id] = (this.destructibleHits[d.id] || 0) + 1;
      const need = d.hitsToBreak != null ? d.hitsToBreak : 1;
      if (this.destructibleHits[d.id] >= need) {
        this.brokenDestructibles.add(d.id);
        this.room.broadcastEvent("block_broken", { blockId: d.id, x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 });
      } else {
        this.room.broadcastEvent("block_hit", { blockId: d.id, x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 });
      }
    });
  }

  _fail(reason) {
    this.state = COOP_STATE.FAILED;
    this.timer = 0;
    this.failReason = reason;
    this.room.broadcastEvent("stage_failed", { reason });
  }

  _clear() {
    this.state = COOP_STATE.CLEAR;
    this.timer = 0;
    this.room.broadcastEvent("stage_clear", { stageId: this.def.id });
  }

  retry() {
    this._loadStage();
  }

  nextStage() {
    if (this.stageIndex < STAGES.length - 1) {
      this.stageIndex++;
      this._loadStage();
      return true;
    }
    return false;
  }

  isAllStagesCleared() {
    return this.stageIndex >= STAGES.length - 1 && this.state === COOP_STATE.CLEAR;
  }

  getStateJSON() {
    return {
      mode: "coop",
      state: this.state,
      stageIndex: this.stageIndex,
      totalStages: STAGES.length,
      stageName: this.def.name,
      timeLeft: Math.max(0, Math.ceil(this.stageTimeLeft)),
      countdown: this.state === COOP_STATE.COUNTDOWN ? Math.max(0, Math.ceil(COUNTDOWN_SECONDS - this.timer)) : null,
      failReason: this.failReason || null,
      bounds: this.def.bounds,
      sharedCamera: this.def.sharedCamera !== false,
      singleSpawn: !!(this.def.spawns && this.def.spawns.length === 1),
      cameraDistance: this.def.cameraDistance != null ? this.def.cameraDistance : 500,
      darkness: !!this.def.darkness,
      visionRadius: this.def.visionRadius != null ? this.def.visionRadius : 260,
      visionAngle: this.def.visionAngle != null ? this.def.visionAngle : 80,
      darknessIntensity: this.def.darknessIntensity != null ? this.def.darknessIntensity : 45,
      freeView: !!this.def.freeView,
      walls: this.def.walls.map((w, i) => ({ w: w.w, h: w.h, rotation: w.rotation || 0, color: w.color, x: this.wallState[i].x, y: this.wallState[i].y })),
      keys: this.keys,
      teleporters: this.def.teleporters || [],
      doors: this.def.doors.map((d, i) => ({
        ...d,
        open: !!this.doorsOpen[d.id],
        x: this.doorState[i].x,
        y: this.doorState[i].y,
        openRemaining:
          this.doorsOpen[d.id] && d.openDuration > 0
            ? Math.max(0, d.openDuration - (this._playingElapsed - (this.doorOpenedAt[d.id] || 0)))
            : null,
      })),
      plates: this.def.plates.map((p) => ({ ...p, active: !!this.plateGroupsOpen[p.group] })),
      platforms: this.def.platforms.map((p, i) => ({
        id: p.id,
        w: p.w,
        h: p.h,
        rotation: p.rotation || 0,
        color: p.color,
        x: this.platformState[i].x,
        y: this.platformState[i].y,
      })),
      pits: (this.def.pits || []).map((p, i) => ({ w: p.w, h: p.h, rotation: p.rotation || 0, color: p.color, x: this.pitState[i].x, y: this.pitState[i].y })),
      killbricks: (this.def.killbricks || []).map((k, i) => ({
        id: k.id,
        w: k.w,
        h: k.h,
        rotation: k.rotation || 0,
        color: k.color,
        x: this.killbrickState[i].x,
        y: this.killbrickState[i].y,
      })),
      destructibles: (this.def.destructibles || [])
        .map((d, i) => ({
          id: d.id,
          w: d.w,
          h: d.h,
          rotation: d.rotation || 0,
          color: d.color,
          x: this.destructibleState[i].x,
          y: this.destructibleState[i].y,
          broken: this.brokenDestructibles.has(d.id),
        }))
        .filter((d) => !d.broken),
      goal: this.def.goal,
      collectedKeys: this.collectedKeys,
      collectedKeyIds: Array.from(this.collectedKeyIds),
      totalKeys: this.keys.length,
      eliminated: Array.from(this.eliminated),
      isLastStage: this.stageIndex >= STAGES.length - 1,
    };
  }
}
window.CoopEngine = CoopEngine;
})();

// ==== server/Player.js ====
(function(){
// server/Player.js
let nextInternalId = 1;

class Player {
  constructor(ws, name) {
    this.id = "p" + nextInternalId++;
    this.ws = ws;
    this.name = (name || "Player").slice(0, 12);
    this.color = null; // room이 배정
    this.accessory = "none"; // 장신구(로비에서 선택)
    this.swordSkin = null; // 칼 스킨 이미지(data URL, 로비에서 업로드)
    this.isHost = false;
    this.ready = false;
    this.connected = true;

    // 공통 게임 상태 (탑다운 좌표계)
    this.x = 0;
    this.y = 0;
    this.vx = 0;
    this.vy = 0;
    this.facing = { x: 0, y: 1 };
    this.radius = PHYSICS.PLAYER_RADIUS;

    // 입력 상태 (클라이언트가 매 프레임 전송)
    this.input = {
      up: false,
      down: false,
      left: false,
      right: false,
      action: false, // 이번 tick에 새로 눌렸는지 여부는 서버에서 edge 감지
      interact: false,
      dash: false,
    };
    this._prevAction = false;
    this._prevInteract = false;
    this._prevDash = false;

    this.dashTimer = 0;
    this.dashCooldown = 0;

    // 게임별 확장 상태 (co-op/경쟁 로직에서 자유롭게 사용)
    this.status = "connected"; // connected, ready, playing, eliminated, finished, winner
    this.gameData = {};
  }

  assignColor(colorId) {
    const c = PLAYER_COLORS.find((c) => c.id === colorId) || PLAYER_COLORS[0];
    this.color = c;
  }

  // 이번 tick에 새로 눌린 입력인지 (edge trigger)
  actionPressed() {
    const pressed = this.input.action && !this._prevAction;
    return pressed;
  }
  interactPressed() {
    return this.input.interact && !this._prevInteract;
  }
  dashPressed() {
    return this.input.dash && !this._prevDash;
  }

  commitInputFrame() {
    this._prevAction = this.input.action;
    this._prevInteract = this.input.interact;
    this._prevDash = this.input.dash;
  }

  toPublicJSON() {
    return {
      id: this.id,
      name: this.name,
      color: this.color ? this.color.id : null,
      colorHex: this.color ? this.color.hex : "#ffffff",
      accessory: this.accessory || "none",
      isHost: this.isHost,
      ready: this.ready,
      connected: this.connected,
      x: Math.round(this.x),
      y: Math.round(this.y),
      facing: this.facing,
      status: this.status,
      swordSwing: this.gameData && this.gameData.swordSwing > 0 ? this.gameData.swordSwing : 0,
      dashing: this.dashTimer > 0,
      nearKeyId: (this.gameData && this.gameData.nearKeyId) || null,
      carriedKeyIds: (this.gameData && this.gameData.carriedKeyIds) || [],
    };
  }

  send(type, payload) {
    if (this.ws && this.ws.readyState === 1) {
      try {
        this.ws.send(JSON.stringify({ type, payload }));
      } catch (e) {
        // ignore send errors (client probably disconnecting)
      }
    }
  }
}
window.Player = Player;
})();

// ==== server/Room.js ====
(function(){
// server/Room.js
class Room {
  constructor(code) {
    this.code = code;
    this.players = new Map(); // id -> Player
    this.hostId = null;
    this.phase = ROOM_PHASE.LOBBY;
    this.mode = MODE.COOP;
    this.rounds = 5;
    this.engine = null; // CoopEngine | CompetitionManager
    this._loopHandle = null;
    this._lastTick = Date.now();
  }

  isEmpty() {
    return this.players.size === 0;
  }

  isFull() {
    return this.players.size >= MAX_PLAYERS;
  }

  getAlivePlayers() {
    return Array.from(this.players.values());
  }

  _nextFreeColor() {
    const used = new Set(Array.from(this.players.values()).map((p) => p.color && p.color.id));
    const free = PLAYER_COLORS.find((c) => !used.has(c.id));
    return free ? free.id : PLAYER_COLORS[0].id;
  }

  addPlayer(player) {
    player.assignColor(this._nextFreeColor());
    this.players.set(player.id, player);
    if (!this.hostId) {
      this.hostId = player.id;
      player.isHost = true;
    }
    this._ensureLoop();
    this.broadcastRoomState();
  }

  removePlayer(playerId) {
    const wasHost = this.hostId === playerId;
    this.players.delete(playerId);
    if (this.engine && this.engine.onPlayerLeave) {
      // best effort - 엔진에 알림 (탈락 처리 등)
      const fakePlayer = { id: playerId };
      this.engine.onPlayerLeave(fakePlayer);
    }
    if (wasHost) {
      const next = this.players.values().next();
      if (!next.done) {
        this.hostId = next.value.id;
        next.value.isHost = true;
      } else {
        this.hostId = null;
      }
    }
    if (this.players.size < MIN_PLAYERS && this.phase === ROOM_PHASE.IN_GAME) {
      // 인원 부족 -> 로비로 강제 복귀
      this.phase = ROOM_PHASE.LOBBY;
      this.engine = null;
      this.players.forEach((p) => (p.ready = false));
      this.broadcastEvent("room_notice", { message: "인원이 부족해 로비로 돌아갑니다." });
    }
    this.broadcastRoomState();
  }

  setMode(mode) {
    if (this.phase !== ROOM_PHASE.LOBBY) return;
    if (mode === MODE.COOP || mode === MODE.COMPETITION) {
      this.mode = mode;
      this.broadcastRoomState();
    }
  }

  setRounds(rounds) {
    if (this.phase !== ROOM_PHASE.LOBBY) return;
    const r = parseInt(rounds, 10);
    if ([3, 5, 7, 10].includes(r)) {
      this.rounds = r;
      this.broadcastRoomState();
    }
  }

  setReady(playerId, ready) {
    const p = this.players.get(playerId);
    if (!p) return;
    p.ready = !!ready;
    this.broadcastRoomState();
  }

  // 로비에서 캐릭터 색상/장신구/칼 스킨을 바꾼다. 색상은 중복 선택이 안 되게 막는다.
  setAppearance(playerId, payload) {
    const p = this.players.get(playerId);
    if (!p) return { ok: false, reason: "플레이어를 찾을 수 없습니다." };
    if (payload && payload.colorId) {
      const already = Array.from(this.players.values()).some(
        (other) => other.id !== p.id && other.color && other.color.id === payload.colorId
      );
      if (already) return { ok: false, reason: "이미 다른 플레이어가 선택한 색상입니다." };
      p.assignColor(payload.colorId);
    }
    if (payload && payload.accessory != null) {
      p.accessory = payload.accessory;
    }
    if (payload && payload.swordSkin !== undefined) {
      p.swordSkin = payload.swordSkin; // null이면 스킨 제거
      // 이미지 데이터는 매 틱 상태에 안 실어보내고, 딱 한 번만 이벤트로 브로드캐스트한다
      this.broadcastEvent("player_sword_skin", { playerId: p.id, swordSkin: p.swordSkin });
    }
    this.broadcastRoomState();
    return { ok: true };
  }

  canStart(requesterId) {
    if (requesterId !== this.hostId) return { ok: false, reason: "방장만 시작할 수 있습니다." };
    if (this.players.size < MIN_PLAYERS)
      return { ok: false, reason: "최소 2명의 플레이어가 필요합니다." };
    if (this.mode === MODE.COOP) {
      const allReady = Array.from(this.players.values()).every((p) => p.ready || p.isHost);
      if (!allReady) return { ok: false, reason: "모든 플레이어가 준비해야 합니다." };
      // 깃허브 페이지 등 정적 호스팅에서 <script src="커스텀스테이지.js">로 불러온 스테이지가 있으면
      // (스크립트 태그가 본문 스크립트보다 뒤에 있어도) 이 시점에 합쳐준다. Node 서버에는 window가 없다.
      if (typeof window !== "undefined" && window.SPLAT_CUSTOM_STAGES && window.SPLAT_CUSTOM_STAGES.length) {
        window.SPLAT_CUSTOM_STAGES.forEach((s) => {
          if (!STAGES.find((x) => x.id === s.id)) STAGES.push(s);
        });
      }
      if (STAGES.length === 0) {
        return { ok: false, reason: "협동 스테이지가 하나도 없습니다. 레벨 에디터로 스테이지를 만들어 추가해주세요." };
      }
      if (!CoopEngine.checkPlayerCount(STAGES[0], this.players.size)) {
        return { ok: false, reason: `이 스테이지는 ${STAGES[0].playerCount}명 전용입니다. 현재 인원: ${this.players.size}명` };
      }
    }
    return { ok: true };
  }

  startGame(requesterId) {
    const check = this.canStart(requesterId);
    if (!check.ok) return check;
    this.phase = ROOM_PHASE.IN_GAME;
    if (this.mode === MODE.COOP) {
      this.engine = new CoopEngine(this);
    } else {
      this.engine = new CompetitionManager(this, this.rounds);
    }
    this.broadcastRoomState();
    return { ok: true };
  }

  retryStage() {
    if (this.mode === MODE.COOP && this.engine) this.engine.retry();
  }

  returnToLobby() {
    this.phase = ROOM_PHASE.LOBBY;
    this.engine = null;
    this.players.forEach((p) => {
      p.ready = false;
      p.status = "connected";
    });
    this.broadcastRoomState();
  }

  handleInput(playerId, inputPayload) {
    const p = this.players.get(playerId);
    if (!p || this.phase !== ROOM_PHASE.IN_GAME) return;
    p.input.up = !!inputPayload.up;
    p.input.down = !!inputPayload.down;
    p.input.left = !!inputPayload.left;
